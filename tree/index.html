  /* ---------------- 着色器 ---------------- */
  const VS_TREE = `#version 300 es
  precision highp float;
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aScatter;
  layout(location=2) in vec3 aMeta;
  layout(location=3) in vec3 aCol;
  layout(location=4) in vec3 aHeart;
  layout(location=5) in vec3 aEmblem;
  uniform mat4 uVP;
  uniform float uDisperse, uHeart, uEmblem, uTime, uSize, uProj, uAlpha, uMaxPx, uBuild, uReflect;
  out vec3 vCol; out float vA;
  void main() {
    vec3 p = mix(aPos, aScatter, uDisperse);
    p = mix(p, aEmblem, uEmblem);
    p = mix(p, aHeart, uHeart);
    // 倒影：沿树底镜像并压扁
    float reflFade = 1.0;
    if (uReflect > 0.5) {
      float below = p.y - (-1.15);
      p.y = -1.15 - below * 0.19;
      reflFade = 0.22 * exp(-max(0.0, -below) * 0.9);
    }
    // 开场生长：每颗星按高度依次从树底升起并淡入
    float hN = clamp((p.y + 1.15) / 2.45, 0.0, 1.0);
    vec3 hTint = mix(vec3(0.94, 0.86, 0.72), vec3(1.16, 1.06, 0.90), smoothstep(0.02, 0.98, hN));
    float th = hN * 0.72 + fract(aMeta.z * 13.17) * 0.28;
    float grow = clamp((uBuild * 1.30 - th) / 0.30, 0.0, 1.0);
    grow = grow * grow * (3.0 - 2.0 * grow);
    p.y = mix(p.y - 0.75 - th * 0.35, p.y, grow);
    vec4 clip = uVP * vec4(p, 1.0);
    gl_Position = clip;
    float isOrn = step(1500.0, aMeta.y);
    float flow = 0.5 + 0.5 * sin(aMeta.x * 44.0 - uTime * 2.8 + aMeta.y * 0.35 + aMeta.z * 6.283);
    float tw = 0.55 + 0.45 * sin(uTime * 3.2 + aMeta.z * 40.0);
    float b = mix(0.30 + 0.95 * flow * flow, 0.75 + 0.85 * tw, isOrn);
    b *= mix(1.0, 0.55, smoothstep(3.2, 5.6, clip.w));   // 越远越暗，出现纵深
    b *= max(grow, 0.0015);                              // 未就位的星不可见
    b *= mix(1.0, 0.40, smoothstep(0.68, 1.0, hN));       // 顶部压亮，避免过曝成白团
    b *= mix(1.0, 0.72, uDisperse) * (1.0 + 0.02 * uHeart) * (1.0 - 0.58 * uEmblem);
    vCol = aCol * b * 1.35 * hTint * mix(1.0, reflFade, uReflect);
    vA = uAlpha;
    float sz = uSize * (0.85 + 0.55 * isOrn) * (1.0 + 0.5 * uDisperse) * uProj / max(0.001, clip.w);
    gl_PointSize = clamp(sz, 1.6, max(uMaxPx, 2.2));
  }`;

  const VS_SPRITE = `#version 300 es
  precision highp float;
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aCol;
  layout(location=2) in float aSize;
  uniform vec2 uRes;
  out vec3 vCol; out float vA;
  void main() {
    vec2 ndc = vec2(aPos.x / uRes.x * 2.0 - 1.0, 1.0 - aPos.y / uRes.y * 2.0);
    gl_Position = vec4(ndc, 0.0, 1.0);
    gl_PointSize = aSize;
    vCol = aCol; vA = aPos.z;
  }`;

  // uniform 位置缓存（避免逐帧查询）
  const UT = {}, UD = {}, UB = {}, UC = {}, US = {}, UG = {};
  function cacheUniforms() {
    for (const n of ['uVP', 'uDisperse', 'uHeart', 'uEmblem', 'uTime', 'uSize', 'uProj', 'uAlpha', 'uMaxPx', 'uBuild', 'uReflect']) {
      UT[n] = gl.getUniformLocation(progTree, n);
    }
    for (const n of ['uRes', 'uSky', 'uGlow', 'uStar', 'uTime']) {
      UG[n] = gl.getUniformLocation(progBG, n);
    }
    for (const n of ['uTex', 'uTexel', 'uThresh']) {
      UD[n] = gl.getUniformLocation(progDown, n);
    }
    for (const n of ['uTex', 'uDir']) {
      UB[n] = gl.getUniformLocation(progBlur, n);
    }
    for (const n of ['uScene', 'uBloom', 'uBloom2', 'uBloomAmt', 'uBloom2Amt']) {
      UC[n] = gl.getUniformLocation(progComp, n);
    }
    US.uRes = gl.getUniformLocation(progSprite, 'uRes');
  }

  const FS_POINT = `#version 300 es
  precision highp float;
  in vec3 vCol; in float vA;
  out vec4 frag;
  void main() {
    vec2 d = gl_PointCoord - 0.5;
    float r2 = dot(d, d) * 4.0;
    float a = exp(-r2 * 3.4);
    if (a < 0.004) discard;
    frag = vec4(vCol * a * vA, 1.0);
  }`;

  const FS_BG = `#version 300 es
  precision highp float;
  uniform vec2 uRes;
  uniform vec3 uSky, uGlow, uStar;
  uniform float uTime;
  out vec4 frag;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

  // 平滑值噪声 + 三倍频，用于极光带
  float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i), b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }
  float fbm(vec2 p) {
    float v = 0.0, amp = 0.6;
    for (int k = 0; k < 3; k++) { v += amp * vnoise(p); p *= 2.05; amp *= 0.5; }
    return v;
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    float aspect = uRes.x / uRes.y;

    // 基础天空：下亮上暗
    vec3 col = mix(uSky * 1.25, uSky * 0.55, uv.y);

    // 极光带：两条缓慢流动的横向光带（低强度，只做氛围）
    float a1 = fbm(vec2(uv.x * 2.6 + uTime * 0.012, uv.y * 1.5 - uTime * 0.008));
    float band1 = smoothstep(0.62, 0.86, a1) * smoothstep(0.42, 0.70, uv.y) * smoothstep(1.02, 0.66, uv.y);
    float a2 = fbm(vec2(uv.x * 1.7 - uTime * 0.009, uv.y * 2.2 + uTime * 0.011 + 7.3));
    float band2 = smoothstep(0.66, 0.90, a2) * smoothstep(0.30, 0.58, uv.y) * smoothstep(0.92, 0.56, uv.y);
    col += uGlow * (band1 * 0.34 + band2 * 0.26) * 0.26;

    // 树后主光
    vec2 c = (uv - vec2(0.5, 0.52)) * vec2(aspect, 1.0);
    col += uGlow * 0.26 * exp(-dot(c, c) * 3.2);
    // 地面反光
    vec2 f = (uv - vec2(0.5, 0.06)) * vec2(aspect * 1.4, 3.0);
    col += uGlow * 0.07 * exp(-dot(f, f) * 2.2);
    // 树底光池
    vec2 g = (uv - vec2(0.5, 0.02)) * vec2(aspect * 2.6, 7.5);
    col += uGlow * 0.13 * exp(-dot(g, g) * 1.6);

    // ---- 近层星尘（细密，3px 网格）----
    vec2 gp = floor(gl_FragCoord.xy / 3.0);
    float h = hash(gp);
    if (h > 0.9985) {
      float tw = 0.55 + 0.45 * sin(uTime * 2.0 + h * 90.0);
      vec2 lp = fract(gl_FragCoord.xy / 3.0) - 0.5;
      float core = exp(-dot(lp, lp) * 5.0);
      col += uStar * (0.35 + 0.5 * tw) * core * smoothstep(0.05, 0.55, uv.y);
    }

    // ---- 远层亮星（稀疏、更大、缓慢视差）----
    vec2 far = gl_FragCoord.xy + vec2(uTime * 1.6, uTime * 0.9);
    vec2 gp2 = floor(far / 7.0);
    float h2 = hash(gp2 + 31.7);
    if (h2 > 0.99865) {
      float tw2 = 0.6 + 0.4 * sin(uTime * 1.3 + h2 * 210.0);
      vec2 lp2 = fract(far / 7.0) - 0.5;
      float core2 = exp(-dot(lp2, lp2) * 4.0);
      col += uStar * (0.5 + 0.7 * tw2) * core2 * smoothstep(0.0, 0.5, uv.y) * 1.15;
    }

    // ---- 地平线剪影：起伏的暗色山影，给画面景深 ----
    float ridge = 0.105
                + 0.030 * sin(uv.x * 5.3 + 1.2)
                + 0.018 * sin(uv.x * 11.7 - 0.6)
                + 0.010 * sin(uv.x * 23.1 + 2.4);
    float sil = smoothstep(ridge + 0.004, ridge - 0.02, uv.y);
    col *= mix(1.0, 0.28, sil);
    // 山脊上沿的极淡高光，勾出轮廓
    float rim = smoothstep(ridge + 0.012, ridge + 0.001, uv.y) * smoothstep(ridge - 0.001, ridge + 0.006, uv.y);
    col += uGlow * rim * 0.10;

    // ---- 偶发流星：约每 22 秒一颗，斜向划过 ----
    float mt = floor(uTime / 22.0);
    float mseed = hash(vec2(mt, 7.77));
    float mlocal = uTime - mt * 22.0 - 3.0 - mseed * 6.0;   // 3~9 秒之间出现
    if (mseed > 0.45 && mlocal > 0.0 && mlocal < 1.5) {
      float prog = mlocal / 1.5;
      vec2 start = vec2(0.12 + mseed * 0.7, 0.86 - mseed * 0.18);
      vec2 dir = normalize(vec2(0.85, -0.52));
      vec2 head = start + dir * prog * 0.55;
      vec2 rel = (uv - head) * vec2(aspect, 1.0);
      float perp = abs(rel.x * (-dir.y) + rel.y * dir.x);
      float along = rel.x * dir.x + rel.y * dir.y;
      float tail = smoothstep(0.0, -0.16, along) * smoothstep(-0.22, -0.02, along);
      float glow = exp(-perp * perp * 520.0) * tail;
      col += uStar * glow * (0.55 * (1.0 - prog) + 0.12);
    }

    frag = vec4(col, 1.0);
  }`;

  const FS_DOWN = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 frag;
  uniform sampler2D uTex; uniform vec2 uTexel; uniform float uThresh;
  void main() {
    vec3 c = vec3(0.0);
    c += texture(uTex, vUv + uTexel * vec2(-1.0, -1.0)).rgb;
    c += texture(uTex, vUv + uTexel * vec2( 1.0, -1.0)).rgb;
    c += texture(uTex, vUv + uTexel * vec2(-1.0,  1.0)).rgb;
    c += texture(uTex, vUv + uTexel * vec2( 1.0,  1.0)).rgb;
    c *= 0.25;
    float l = max(c.r, max(c.g, c.b));
    c *= smoothstep(uThresh, uThresh + 0.35, l) * 1.6;
    frag = vec4(c, 1.0);
  }`;

  const FS_BLUR = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 frag;
  uniform sampler2D uTex; uniform vec2 uDir;
  void main() {
    vec3 s = texture(uTex, vUv).rgb * 0.2270;
    s += texture(uTex, vUv + uDir * 1.3846).rgb * 0.3162;
    s += texture(uTex, vUv - uDir * 1.3846).rgb * 0.3162;
    s += texture(uTex, vUv + uDir * 3.2307).rgb * 0.0702;
    s += texture(uTex, vUv - uDir * 3.2307).rgb * 0.0702;
    frag = vec4(s, 1.0);
  }`;

  const FS_COMP = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 frag;
  uniform sampler2D uScene; uniform sampler2D uBloom; uniform sampler2D uBloom2;
  uniform float uTime; uniform float uBloomAmt; uniform float uBloom2Amt;
  void main() {
    vec3 s = texture(uScene, vUv).rgb;
    vec3 b = texture(uBloom, vUv).rgb;
    vec3 b2 = texture(uBloom2, vUv).rgb;
    vec3 c = s + b * uBloomAmt + b2 * uBloom2Amt;
    c = vec3(1.0) - exp(-c * 1.25);
    c = pow(c, vec3(0.92));
    float vig = smoothstep(0.42, 1.05, length((vUv - 0.5) * vec2(1.15, 1.0)));
    c *= mix(1.0, 0.84, vig);                 // 极轻暗角，边缘压暗 16%
    vec2 dq = vUv * vec2(1920.0, 1080.0) + vec2(uTime * 17.0, uTime * 23.0);
    float dh = fract(sin(dot(dq, vec2(12.9898, 78.233))) * 43758.5453);
    c += (dh - 0.5) / 255.0;                  // 抖动：打散 8bit 色阶，暗部更细腻
    frag = vec4(c, 1.0);
  }`;

  function compile(vsSrc, fsSrc) {
    function sh(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
      }
      return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  let progTree, progSprite, progBG, progDown, progBlur, progComp;
  try {
    progTree = compile(VS_TREE, FS_POINT);
    progSprite = compile(VS_SPRITE, FS_POINT);
    progBG = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_BG);
    progDown = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_DOWN);
    progBlur = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_BLUR);
    progComp = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_COMP);
  } catch (err) {
    console.error('shader init failed', err);
    var fb = document.getElementById('nogl');
    if (fb) { fb.style.display = 'flex'; }
    return;
  }

  // 小屏 / 高 DPR 时压低点精灵上限，减少填充率
  const maxPointPx = (window.innerWidth < 760 || (window.devicePixelRatio || 1) > 1.5) ? 14.0 : 20.0;
  cacheUniforms();
  // 两个共用 FS_POINT 的程序都要设一次，否则未初始化的 uniform 会让 clamp 变成未定义行为
  gl.useProgram(progTree); gl.uniform1f(UT.uMaxPx, maxPointPx);
  gl.useProgram(progSprite); gl.uniform1f(US.uMaxPx, maxPointPx);

  /* ---------------- 全屏四边形 ---------------- */
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const quadVAO = gl.createVertexArray();
  const treeVAO = gl.createVertexArray();
  gl.bindVertexArray(quadVAO);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  /* ---------------- FBO ---------------- */
  const FLOAT_RT = !!gl.getExtension('EXT_color_buffer_float');
  const RT_FMT = FLOAT_RT ? gl.RGBA16F : gl.RGBA8;
  const RT_TYPE = FLOAT_RT ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

  function makeFBO(w, h, filter) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, RT_FMT, w, h, 0, gl.RGBA, RT_TYPE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fb, tex, w, h };
  }
  let rtScene = null, rtA = null, rtB = null, rtC = null, rtD = null;
  let W = 1, H = 1;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const scaleQ = (cvs.dataset && cvs.dataset.lowQ === '1') ? 0.72 : 0.9;
    const nw = Math.max(2, Math.floor(window.innerWidth * dpr * scaleQ));
    const nh = Math.max(2, Math.floor(window.innerHeight * dpr * scaleQ));
    if (nw === W && nh === H && rtScene && rtScene.w === W) return;   // 尺寸没变就不重建
    W = nw; H = nh;
    cvs.width = W; cvs.height = H;
    cvs.style.width = window.innerWidth + 'px';
    cvs.style.height = window.innerHeight + 'px';
    if (rtScene) { gl.deleteTexture(rtScene.tex); gl.deleteFramebuffer(rtScene.fb); }
    if (rtA) { gl.deleteTexture(rtA.tex); gl.deleteFramebuffer(rtA.fb); }
    if (rtB) { gl.deleteTexture(rtB.tex); gl.deleteFramebuffer(rtB.fb); }
    rtScene = makeFBO(W, H, gl.LINEAR);
    rtA = makeFBO(Math.max(2, W >> 2), Math.max(2, H >> 2), gl.LINEAR);
    rtB = makeFBO(Math.max(2, W >> 2), Math.max(2, H >> 2), gl.LINEAR);
    if (rtC) { gl.deleteTexture(rtC.tex); gl.deleteFramebuffer(rtC.fb); }
    if (rtD) { gl.deleteTexture(rtD.tex); gl.deleteFramebuffer(rtD.fb); }
    rtC = makeFBO(Math.max(2, W >> 3), Math.max(2, H >> 3), gl.LINEAR);
    rtD = makeFBO(Math.max(2, W >> 3), Math.max(2, H >> 3), gl.LINEAR);
  }
  window.addEventListener('resize', resize);

  // 上下文丢失兜底：暂停渲染并提示手动刷新（不做自动 reload —— 某些显卡会反复
  // 触发 lost/restored，自动重载会表现为整页不停闪烁）
  function showGLLost() {
    window.__glLost = true;
    const fb = document.getElementById('nogl');
    if (fb && fb.style.display !== 'flex') {
      fb.style.display = 'flex';
      fb.innerHTML = '<div style="text-align:center"><h2>画面已暂停</h2>' +
                     '<p>显卡上下文被重置，点击任意处刷新即可恢复</p></div>';
      fb.addEventListener('click', function () { location.reload(); }, { once: true });
    }
  }
  cvs.addEventListener('webglcontextlost', function (e) { e.preventDefault(); showGLLost(); }, false);
  cvs.addEventListener('webglcontextrestored', function () {
    // 保持暂停：旧 program / VAO / 纹理已失效，等用户手动刷新，避免闪烁
  }, false);

  // DPR 变化（跨屏拖动、浏览器缩放）时重建渲染目标
  let lastDpr = Math.min(window.devicePixelRatio || 1, 2);
  const bgTmp = new Float32Array(3);
  let lastZoomCss = '';
  resize();

  /* ---------------- 状态 ---------------- */
  const state = {
    yaw: 0.4, pitch: -0.06, zoom: 1,
    t: 0, disperse: 0, phase: 0, timer: 90, heart: 0, emblem: 0, heartWanted: false, build: 0, photoY: 0,
    alpha: 0, snow: true, text: true,
    glyphs: [], sparks: [], snowPts: []
  };

  // 雪花
  for (let i = 0; i < 220; i++) {
    state.snowPts.push({
      x: Math.random() * 2000, y: Math.random() * 1200,
      vy: 18 + Math.random() * 40, vx: -8 + Math.random() * 16,
      s: 1.4 + Math.random() * 2.6, ph: Math.random() * 6.28
    });
  }

  /* ---------------- 交互 ---------------- */
  let dragging = false, moved = 0, lastX = 0, lastY = 0, idle = 0, spinVel = 0;

  cvs.addEventListener('pointerdown', (e) => {
    dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
    spawnRipple(e.clientX, e.clientY);
    cvs.setPointerCapture(e.pointerId);
  });
  // 双指捏合缩放（移动端）
  const touches = new Map();
  let pinchStart = 0, pinchZoom = 1;
  cvs.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'touch') return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) {
      const it = Array.from(touches.values());
      pinchStart = Math.hypot(it[0].x - it[1].x, it[0].y - it[1].y);
      pinchZoom = state.zoom;
      dragging = false;
    }
  });
  cvs.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'touch' || !touches.has(e.pointerId)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2 && pinchStart > 0) {
      const it = Array.from(touches.values());
      const d = Math.hypot(it[0].x - it[1].x, it[0].y - it[1].y);
      state.zoom = Math.max(0.6, Math.min(1.9, pinchZoom * (d / pinchStart)));
    }
  });
  ['pointerup', 'pointercancel'].forEach(function (evt) {
    cvs.addEventListener(evt, function (e) { touches.delete(e.pointerId); if (touches.size < 2) pinchStart = 0; });
  });

  cvs.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse' && !dragging) spawnDust(e.clientX, e.clientY);
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    state.yaw += dx * 0.006;
    spinVel = dx * 0.006;
    state.pitch = Math.max(-0.9, Math.min(0.55, state.pitch + dy * 0.004));
    idle = 0;
  });
  let tapTimer = null, lastTapT = 0, lastTapX = 0, lastTapY = 0;
  function fireSingle(x, y) {
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapTimer = null; onClick(x, y); }, 300);
  }

  // 桌面：用浏览器原生 dblclick（按系统双击速度判定，比手写时间窗可靠）
  cvs.addEventListener('dblclick', (e) => {
    e.preventDefault();
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
    toggleDisperse(e.clientX, e.clientY);
  });

  cvs.addEventListener('pointerup', (e) => {
    dragging = false;
    if (moved >= 10) return;
    if (e.pointerType === 'touch') {          // 触摸端：手写双击判定
      const now = performance.now();
      const isDouble = (now - lastTapT) < 340 &&
                       Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 40;
      lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
      if (isDouble) {
        if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
        toggleDisperse(e.clientX, e.clientY);
        return;
      }
    }
    fireSingle(e.clientX, e.clientY);
  });
  ['pointercancel', 'lostpointercapture'].forEach(function (evt) {
    cvs.addEventListener(evt, function () { dragging = false; moved = 0; });
  });

  cvs.addEventListener('wheel', (e) => {
    e.preventDefault();
    // 爱心阶段：滚轮上下微调照片位置（不再缩放，避免照片跑出爱心）
    if (stage === STAGE.HEART) {
      e.preventDefault();
      state.photoY = Math.max(-10, Math.min(10, (state.photoY || 0) - e.deltaY * 0.01));
      const hp = personalEl.querySelector('.hp');
      if (hp) hp.style.transform = 'translateY(' + state.photoY.toFixed(2) + '%)';
      return;
    }
    state.zoom = Math.max(0.6, Math.min(1.9, state.zoom * (e.deltaY > 0 ? 0.94 : 1.06)));
  }, { passive: false });

  function toggleDisperse(x, y) {
    if (stage === STAGE.TREE) {
      startDissolve();
      if (x !== undefined) { spawnSpark(x, y); spawnSpark(x, y); }
    } else {
      restoreTree();
    }
  }

  function onClick(x, y) {
    if (stage === STAGE.TEXT) {         // 文案 -> 爱心：文字汇入轮廓，中间大字变成照片
      if (!heartPending) beginHeartTransition();
      for (let i = 0; i < 2; i++) spawnSpark(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30);
      return;
    }
    if (stage === STAGE.HEART) {        // 爱心中单击：换一张照片，并重置自动计时
      if (finaleStarted) { clearFinale(); restoreTree(); return; }
      photoIdx = (photoIdx + 1) % PHOTOS.length;
      if (PHOTOS.length > 1 && photoIdx === 0) { startFinale(); return; }
      switchPhoto(photoIdx);
      stageT = 0;                       // 点击后重新数 6 秒
      return;
    }
    if (stage === STAGE.SYMBOL) return;
    // 洗牌袋：一轮内不重复，避免连续抽到同一种图案
    if (!glyphBag.length) {
      glyphBag = GLYPH_ORDER.slice();
      for (let i = glyphBag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = glyphBag[i]; glyphBag[i] = glyphBag[j]; glyphBag[j] = t;
      }
    }
    const kind = glyphBag.pop();
    spawnGlyph(kind, x, y);
    spawnSpark(x, y);
  }

  function spawnSpark(x, y) {
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 120;
      state.sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, s: 2 + Math.random() * 3 });
    }
  }

  function spawnGlyph(kind, x, y) {
    const base = SHAPES[kind]();
    const scale = Math.min(window.innerWidth, window.innerHeight) * 0.17;
    const n = base.length;
    const target = new Float32Array(n * 3);
    const start = new Float32Array(n * 3);
    const col = new Float32Array(n * 3);
    const th = THEMES[themeIdx];
    const c = th.orn[0];
    const c2 = th.star;
    for (let i = 0; i < n; i++) {
      target[i * 3] = x + base[i][0] * scale;
      target[i * 3 + 1] = y + base[i][1] * scale;
      target[i * 3 + 2] = 1;
      const a = Math.random() * Math.PI * 2, rr = 120 + Math.random() * 420;
      start[i * 3] = x + Math.cos(a) * rr;
      start[i * 3 + 1] = y + Math.sin(a) * rr;
      start[i * 3 + 2] = 0;
      const mixv = (i / n);
      col[i * 3] = c[0] * (1 - mixv) + c2[0] * mixv;
      col[i * 3 + 1] = c[1] * (1 - mixv) + c2[1] * mixv;
      col[i * 3 + 2] = c[2] * (1 - mixv) + c2[2] * mixv;
    }
    state.glyphs.push({ kind, t: 0, dur: 5.6, n, target, start, col, cx: x, cy: y, scale });
    if (state.glyphs.length > 8) state.glyphs.shift();
  }

  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;      // 不抢浏览器快捷键
    const k = e.key.toLowerCase();
    if (k === 'c') { themeIdx = (themeIdx + 1) % THEMES.length; rebuildGeometry(); flashName(THEMES[themeIdx].name); }
    else if (k >= '1' && k <= '4') { formIdx = parseInt(k) - 1; rebuildGeometry(); flashName(FORM_NAMES[formIdx]); }
    else if (k === 'r') { toggleRecord(); }
    else if (k === 'g') { toggleDisperse(); }
    else if (k === 's') { state.snow = !state.snow; }
    else if (k === 't') {
      state.text = !state.text;
      document.getElementById('ui').style.opacity = state.text ? '1' : '0';
    } else if (k === 'f') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });

  // ---- 页内录制：按 R 开始/结束，录的是整个标签页（含 DOM 文案）----
  let rec = null, recChunks = [];
  async function toggleRecord() {
    if (rec && rec.state === 'recording') { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 30 }, audio: false, preferCurrentTab: true
      });
      recChunks = [];
      rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
      rec.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
      rec.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        const blob = new Blob(recChunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '圣诞树.webm';
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
        flashName('已保存 webm');
      };
      rec.start();
      flashName('录制中 · 再按 R 结束');
      setTimeout(function () { if (rec && rec.state === 'recording') rec.stop(); }, 30000);
    } catch (err) {
      flashName('已取消录制');
    }
  }

  const FORM_NAMES = ['光瀑', '双螺旋', '光环', '飘带'];
  let nameTimer = 0;
  function flashMsg(_txt) { /* 顶部提示已按要求移除 */ }
  let dustAt = 0;
  function spawnDust(x, y) {
    const now = performance.now();
    if (now - dustAt < 45) return;          // 节流
    dustAt = now;
    const el = document.createElement('u');
    el.style.left = (x + (Math.random() - 0.5) * 10) + 'px';
    el.style.top = (y + (Math.random() - 0.5) * 10) + 'px';
    el.style.setProperty('--ds', (0.6 + Math.random() * 0.7).toFixed(2) + 's');
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1400);
  }

  function spawnRipple(x, y) {
    const el = document.createElement('i');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1100);
  }

  function flashName(txt) {
    let el = document.getElementById('formName');
    if (!el) return;
    el.textContent = txt || '';
    el.classList.add('show');
    if (nameTimer) clearTimeout(nameTimer);
    nameTimer = setTimeout(function () { el.classList.remove('show'); }, 1500);
  }

  /* ---------------- 尺寸与投影 ---------------- */
  const proj = new Float32Array(16), view = new Float32Array(16), vp = new Float32Array(16);

  function updateCamera() {
    const aspect = W / H;
    const dist = CAM_DIST / state.zoom;
    const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    const eye = [
      Math.sin(state.yaw) * dist * cp,
      0.12 + sp * dist,
      Math.cos(state.yaw) * dist * cp
    ];
    mat4Perspective(proj, 45 * Math.PI / 180, aspect, 0.1, 100);
    mat4LookAt(view, eye, [0, 0.02, 0], [0, 1, 0]);
    mat4Mul(vp, proj, view);
    return dist;
  }

  /* ---------------- 渲染 ---------------- */
  let last = performance.now();


  function render(dt) {
    const dprNow = Math.min(window.devicePixelRatio || 1, 2);
    if (Math.abs(dprNow - lastDpr) > 0.01) { lastDpr = dprNow; resize(); }
    state.t += dt;

    // 散开 / 凝聚：0 成形等待 · 1 散开中 · 2 散开停留 · 3 凝聚中
    if (state.phase === 0) {
      if (!dragging && idle > 3) state.timer -= dt;      // 正在看/拖拽时暂停倒计时
      if (state.timer <= 0) startDissolve();
    } else if (state.phase === 1) {
      state.disperse = Math.min(1, state.disperse + dt * 0.55);
      if (state.disperse >= 1) { state.phase = 2; state.timer = 30; }
    } else if (state.phase === 2) {
      // 停留期间按阶段推进（不再自动收回，交给流程 / 双击）
    } else {
      state.disperse = Math.max(0, state.disperse - dt * 0.45);
      if (state.disperse <= 0) { state.phase = 0; state.timer = 70 + Math.random() * 40; }
    }

    // 阶段推进
    stageT += dt;
    if (stage === STAGE.SYMBOL && stageT > 4.6 && state.disperse > 0.999) {   // 粒子完全散开才出文案
      setStage(STAGE.TEXT);
    }

    // 粒子形态：散开量 + 爱心权重
    const wantHeart = (stage === STAGE.HEART || state.heartWanted) ? 1 : 0;
    // 凝聚用更含蓄的速率：慢慢拼，不是一下子跳过去
    state.heart += (wantHeart - state.heart) * Math.min(1, dt * 2.10);
    if (state.heart > 0.9 && !heartCentered) { heartCentered = true; centerPhotoOnHeart(); }
    else if (state.heart < 0.2 && heartCentered) { heartCentered = false; }
    if (state.heart < 0.001) state.heart = 0;

    // 梨/鱼/星：由同一批星粒子汇聚（符号阶段 1，其余 0）
    const wantEmblem = (stage === STAGE.SYMBOL && state.disperse > 0.9) ? 1 : 0;
    state.emblem += (wantEmblem - state.emblem) * Math.min(1, dt * 1.5);
    if (state.emblem < 0.001) state.emblem = 0;

    state.alpha = Math.min(1, state.alpha + dt * 0.6);
    // 缩放同步：粒子与文字/照片一起放大缩小
    const zs = state.zoom.toFixed(4);
    if (zs !== lastZoomCss) {
      lastZoomCss = zs;
      personalEl.style.transform = 'scale(' + zs + ')';
      if (uiEl) uiEl.style.transform = 'scale(' + zs + ')';
    }
    if (state.build < 1) {
      // 生长速度：约 6.7 秒长完，且起步/收尾都更慢（缓入缓出）
      const ease = 0.55 + 0.9 * Math.sin(Math.PI * Math.min(1, state.build));
      state.build = Math.min(1, state.build + dt * 0.15 * ease);
    }
    // 松手后的旋转惯性（逐渐衰减），手感更顺
    if (!dragging && Math.abs(spinVel) > 0.0002) {
      state.yaw += spinVel * Math.min(1, dt * 60);
      spinVel *= Math.pow(0.90, dt * 60);
      idle = 0;
    } else if (!dragging) {
      spinVel = 0;
    }
    if (idle > 2.5 && !dragging && stage === STAGE.TREE) state.yaw += dt * 0.12;
    // 进入符号/爱心阶段时把镜头缓缓转正，让图案正面朝人
    if ((stage === STAGE.SYMBOL || stage === STAGE.HEART) && !dragging && stageT < 2.2) {
      const k = Math.min(1, dt * 2.4);
      state.yaw += (0 - state.yaw) * k;
      state.pitch += (0 - state.pitch) * k;
    }

    // ---- 场景到 FBO ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtScene.fb);
    gl.viewport(0, 0, W, H);
    gl.disable(gl.BLEND);

    // 背景
    gl.useProgram(progBG);
    const th = THEMES[themeIdx];
    gl.uniform2f(UG.uRes, W, H);
    const bgGlowK = (stage === STAGE.HEART) ? 1.22 : (stage === STAGE.SYMBOL ? 1.08 : 1.0);
    const bgStarK = (stage === STAGE.HEART) ? 1.12 : 1.0;
    const bgK = 1.0;
    bgTmp[0] = th.sky[0]; bgTmp[1] = th.sky[1]; bgTmp[2] = th.sky[2];
    gl.uniform3fv(UG.uSky, bgTmp);
    bgTmp[0] = th.glow[0] * bgGlowK; bgTmp[1] = th.glow[1] * bgGlowK; bgTmp[2] = th.glow[2] * bgGlowK;
    gl.uniform3fv(UG.uGlow, bgTmp);
    bgTmp[0] = th.star[0] * bgStarK; bgTmp[1] = th.star[1] * bgStarK; bgTmp[2] = th.star[2] * bgStarK;
    gl.uniform3fv(UG.uStar, bgTmp);
    gl.uniform1f(UG.uTime, state.t);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // 树
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    const dist = updateCamera();
    gl.useProgram(progTree);
    gl.uniformMatrix4fv(UT.uVP, false, vp);
    gl.uniform1f(UT.uDisperse, state.disperse);
    gl.uniform1f(UT.uTime, state.t);
    gl.uniform1f(UT.uSize, 0.0375);
    gl.uniform1f(UT.uProj, H * 0.62);
    gl.uniform1f(UT.uAlpha, state.alpha * (stage === STAGE.TEXT ? 0.55 : 1) * (finaleStarted ? 1.26 : 1));
    gl.uniform1f(UT.uBuild, state.build);
    gl.uniform1f(UT.uMaxPx, maxPointPx);
    gl.uniform1f(UT.uHeart, state.heart);
    gl.uniform1f(UT.uEmblem, state.emblem);

    const aPos = 0, aSc = 1, aMt = 2, aCo = 3;
    gl.bindVertexArray(treeVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.vbo);
    gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.sbo);
    gl.enableVertexAttribArray(aSc); gl.vertexAttribPointer(aSc, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.mbo);
    gl.enableVertexAttribArray(aMt); gl.vertexAttribPointer(aMt, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.cbo);
    gl.enableVertexAttribArray(aCo); gl.vertexAttribPointer(aCo, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.hbo);
    gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.ebo);
    gl.enableVertexAttribArray(5); gl.vertexAttribPointer(5, 3, gl.FLOAT, false, 0, 0);
    gl.uniform1f(UT.uReflect, 0);
    gl.drawArrays(gl.POINTS, 0, geo.count);
    // 地面倒影（同一批点镜像绘制，亮度已衰减）
    gl.uniform1f(UT.uReflect, 1);
    gl.drawArrays(gl.POINTS, 0, geo.count);
    gl.uniform1f(UT.uReflect, 0);

    // 爱心内部的粒子装饰
    drawDecor();
    gl.useProgram(progTree);   // drawDecor 改过 uniform，这里恢复

    // ---- 屏幕空间：雪花 / 形状 / 火花 ----
    gl.useProgram(progSprite);
    gl.uniform2f(US.uRes, W, H);

    // 雪花（用同一个 sprite 程序，手工上传）
    drawScreenPoints(dt);
    drawGlyphs(dt);
    drawSparks(dt);

    // ---- Bloom ----
    // 降采样 + 阈值
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtA.fb);
    gl.viewport(0, 0, rtA.w, rtA.h);
    gl.disable(gl.BLEND);
    gl.useProgram(progDown);
    gl.bindVertexArray(quadVAO);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rtScene.tex);
    gl.uniform1i(UD.uTex, 0);
    gl.uniform2f(UD.uTexel, 1 / W, 1 / H);
    gl.uniform1f(UD.uThresh, 0.56);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // 横向模糊 -> rtB
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtB.fb);
    gl.viewport(0, 0, rtB.w, rtB.h);
    gl.useProgram(progBlur);
    gl.bindVertexArray(quadVAO);
    gl.bindTexture(gl.TEXTURE_2D, rtA.tex);
    gl.uniform1i(UB.uTex, 0);
    gl.uniform2f(UB.uDir, 1.2 / rtA.w, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // 纵向模糊 -> rtA
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtA.fb);
    gl.bindVertexArray(quadVAO);
    gl.bindTexture(gl.TEXTURE_2D, rtB.tex);
    gl.uniform2f(UB.uDir, 0, 1.2 / rtB.h);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // ---- 第二层：更宽的 1/8 光晕（阈值更高，只取最亮的部分）----
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtC.fb);
    gl.viewport(0, 0, rtC.w, rtC.h);
    gl.useProgram(progDown);
    gl.bindVertexArray(quadVAO);
    gl.bindTexture(gl.TEXTURE_2D, rtA.tex);
    gl.uniform1i(UD.uTex, 0);
    gl.uniform2f(UD.uTexel, 1 / rtA.w, 1 / rtA.h);
    gl.uniform1f(UD.uThresh, 0.72);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.bindFramebuffer(gl.FRAMEBUFFER, rtD.fb);
    gl.viewport(0, 0, rtD.w, rtD.h);
    gl.useProgram(progBlur);
    gl.bindVertexArray(quadVAO);
    gl.bindTexture(gl.TEXTURE_2D, rtC.tex);
    gl.uniform1i(UB.uTex, 0);
    gl.uniform2f(UB.uDir, 2.0 / rtC.w, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.bindFramebuffer(gl.FRAMEBUFFER, rtC.fb);
    gl.bindVertexArray(quadVAO);
    gl.bindTexture(gl.TEXTURE_2D, rtD.tex);
    gl.uniform2f(UB.uDir, 0, 2.0 / rtD.h);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // ---- 合成到屏幕 ----
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(progComp);
    gl.bindVertexArray(quadVAO);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rtScene.tex);
    gl.uniform1i(UC.uScene, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, rtA.tex);
    gl.uniform1i(UC.uBloom, 1);
    gl.uniform1f(UC.uBloomAmt, 1.05);
    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, rtC.tex);
    gl.uniform1i(UC.uBloom2, 2);
    gl.uniform1f(UC.uBloom2Amt, 0.42);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindVertexArray(null);

    if (nameTimer > 0) {
      nameTimer -= dt;
      if (nameTimer <= 0) document.getElementById('themeName').style.opacity = '0';
    }
  }

  // 屏幕空间点集的通用绘制
  const scratch = { pos: new Float32Array(4096 * 3), col: new Float32Array(4096 * 3), size: new Float32Array(4096) };
  let spriteVAO = null, spritePosBuf = null, spriteColBuf = null, spriteSizeBuf = null;
  function ensureSpriteVAO() {
    if (spriteVAO) return;
    spriteVAO = gl.createVertexArray();
    spritePosBuf = gl.createBuffer(); spriteColBuf = gl.createBuffer(); spriteSizeBuf = gl.createBuffer();
    gl.bindVertexArray(spriteVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, spritePosBuf);
    gl.bufferData(gl.ARRAY_BUFFER, scratch.pos, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, spriteColBuf);
    gl.bufferData(gl.ARRAY_BUFFER, scratch.col, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, spriteSizeBuf);
    gl.bufferData(gl.ARRAY_BUFFER, scratch.size, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
  }

  function uploadAndDraw(n) {
    ensureSpriteVAO();
    gl.bindVertexArray(spriteVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, spritePosBuf);
    gl.bufferData(gl.ARRAY_BUFFER, scratch.pos.subarray(0, n * 3), gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, spriteColBuf);
    gl.bufferData(gl.ARRAY_BUFFER, scratch.col.subarray(0, n * 3), gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, spriteSizeBuf);
    gl.bufferData(gl.ARRAY_BUFFER, scratch.size.subarray(0, n), gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.POINTS, 0, n);
    gl.bindVertexArray(null);
  }

  function drawScreenPoints(dt) {
    if (!state.snow) return;
    const scale = W / window.innerWidth;
    const th = THEMES[themeIdx];
    let n = 0;
    for (const s of state.snowPts) {
      s.y += s.vy * dt;
      s.x += (s.vx + Math.sin(state.t * 1.3 + s.ph) * 12) * dt;
      if (s.y > window.innerHeight + 20) { s.y = -20; s.x = Math.random() * window.innerWidth; }
      if (s.x < -20) s.x = window.innerWidth + 20;
      if (s.x > window.innerWidth + 20) s.x = -20;
      if (n >= 4096) break;
      scratch.pos[n * 3] = s.x * scale;
      scratch.pos[n * 3 + 1] = s.y * scale;
      scratch.pos[n * 3 + 2] = 0.55;
      scratch.col[n * 3] = th.star[0] * 0.75;
      scratch.col[n * 3 + 1] = th.star[1] * 0.78;
      scratch.col[n * 3 + 2] = th.star[2] * 0.85;
      scratch.size[n] = s.s * scale * 0.9;
      n++;
    }
    if (n) uploadAndDraw(n);
  }

  function drawGlyphs(dt) {
    const scale = W / window.innerWidth;
    const th = THEMES[themeIdx];
    ensureSpriteVAO();
    for (let gi = state.glyphs.length - 1; gi >= 0; gi--) {
      const g = state.glyphs[gi];
      g.t += dt;
      // 散开时让图案跟着一起淡掉
      if (g.fading) g.fadeK = Math.max(0, (g.fadeK === undefined ? 1 : g.fadeK) - dt / 0.7);
      else if (g.fadeK === undefined) g.fadeK = 1;
      if (g.fadeK <= 0.001) {
        state.glyphs.splice(gi, 1);
        continue;
      }
      const p = g.t / g.dur;
      if (p > 1) {
        state.glyphs.splice(gi, 1);
        continue;
      }
      let k;
      if (p < 0.18) k = easeOutCubic(p / 0.18);
      else if (p < 0.72) k = 1;
      else k = 1 - easeInCubic((p - 0.72) / 0.28);
      if (!g.arr) g.arr = new Float32Array(g.n * 3);
      if (!g.cols) g.cols = new Float32Array(g.n * 3);
      if (!g.sizes) g.sizes = new Float32Array(g.n);
      const arr = g.arr;
      for (let i = 0; i < g.n; i++) {
        const j = i * 3;
        const sx = g.start[j], sy = g.start[j + 1];
        const tx = g.target[j], ty = g.target[j + 1];
        arr[j] = (sx + (tx - sx) * k) * scale;
        arr[j + 1] = (sy + (ty - sy) * k) * scale;
        arr[j + 2] = ((p < 0.18) ? (0.25 + 0.75 * k) : (p > 0.72 ? Math.max(0.15, 1 - (p - 0.72) / 0.28) : 1.0)) * g.fadeK;
      }
      for (let i = 0; i < g.n; i++) {
        const m = i / g.n;
        g.cols[i * 3] = th.orn[0][0] * (1 - m) + th.star[0] * m;
        g.cols[i * 3 + 1] = th.orn[0][1] * (1 - m) + th.star[1] * m;
        g.cols[i * 3 + 2] = th.orn[0][2] * (1 - m) + th.star[2] * m;
        g.sizes[i] = 3.4 * scale;
      }
      gl.bindVertexArray(spriteVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER, spritePosBuf);
      gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, spriteColBuf);
      gl.bufferData(gl.ARRAY_BUFFER, g.cols, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, spriteSizeBuf);
      gl.bufferData(gl.ARRAY_BUFFER, g.sizes, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.POINTS, 0, g.n);
      gl.bindVertexArray(null);
    }
  }

  function drawSparks(dt) {
    if (!state.sparks.length) return;
    const scale = W / window.innerWidth;
    const th = THEMES[themeIdx];
    let n = 0;
    for (let i = state.sparks.length - 1; i >= 0; i--) {
      const s = state.sparks[i];
      s.life -= dt * 1.8;
      if (s.life <= 0) { state.sparks.splice(i, 1); continue; }
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vx *= 0.96; s.vy = s.vy * 0.96 + 40 * dt;
      if (n >= 4096) break;
      scratch.pos[n * 3] = s.x * scale;
      scratch.pos[n * 3 + 1] = s.y * scale;
      scratch.pos[n * 3 + 2] = s.life;
      scratch.col[n * 3] = th.star[0];
      scratch.col[n * 3 + 1] = th.star[1];
      scratch.col[n * 3 + 2] = th.star[2];
      scratch.size[n] = s.s * scale * (0.6 + 0.6 * s.life);
      n++;
    }
    if (n) uploadAndDraw(n);
  }

  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInCubic(x) { return x * x * x; }

  /* ---------------- 爱心内部的粒子装饰 ---------------- */
  const HEART_SC = 0.0865, HEART_OFFY = 0.40;
  let decorN = 0, decorBase = null, decorPhase = null, decorAmp = null;
  let decorVAO = null, decorPosBuf = null, decorColBuf = null, decorMetaBuf = null;

  function buildDecor() {
    const th = THEMES[themeIdx];
    const cols = [th.star, th.orn[0], th.orn[1], th.orn[2], th.orn[3] || th.star];
    const pts = [];
    let guard = 0;
    while (pts.length < 560 && guard < 40000) {
      guard++;
      const t = rnd() * Math.PI * 2;
      const f = 0.10 + Math.pow(rnd(), 0.55) * 0.86;
      const X = 16 * Math.pow(Math.sin(t), 3) * f * 1.13 * HEART_SC;
      const Y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
                * f * 0.94 * HEART_SC + HEART_OFFY;
      // 避开中间的照片区域
      if (Math.abs(X) < 0.31 && Math.abs(Y - HEART_OFFY) < 0.35) continue;
      const c = cols[Math.floor(rnd() * cols.length)];
      pts.push([X, Y, (rnd() - 0.5) * 0.10, rnd() * 6.283,
                0.010 + rnd() * 0.026, c, rnd() < 0.30 ? 1 : 0]);
      // 少量四角星芒
      if (rnd() < 0.07) {
        const d = 0.024 + rnd() * 0.01;
        for (const o of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          pts.push([X + o[0] * d, Y + o[1] * d, 0, rnd() * 6.283, 0.004, c, 1]);
        }
      }
    }
    // 爱心外侧：稀疏光晕（浓度明显低于爱心边缘）
    let outer = 0;
    while (outer < 170 && guard < 80000) {
      guard++;
      const t = rnd() * Math.PI * 2;
      const f = 1.06 + Math.pow(rnd(), 1.6) * 0.62;
      const X = 16 * Math.pow(Math.sin(t), 3) * f * 1.13 * HEART_SC;
      const Y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
                * f * 0.94 * HEART_SC + HEART_OFFY;
      const c = cols[Math.floor(rnd() * cols.length)];
      pts.push([X, Y, (rnd() - 0.5) * 0.5, rnd() * 6.283,
                0.014 + rnd() * 0.030, [c[0] * 0.62, c[1] * 0.62, c[2] * 0.68], 0]);
      outer++;
    }
    // 再远一点：零星漂浮
    for (let i = 0; i < 60; i++) {
      const a = rnd() * Math.PI * 2, rr = 0.55 + Math.pow(rnd(), 0.7) * 0.85;
      const X = Math.cos(a) * rr;
      const Y = Math.sin(a) * rr * 0.8 + HEART_OFFY;
      const c = cols[Math.floor(rnd() * cols.length)];
      pts.push([X, Y, (rnd() - 0.5) * 0.8, rnd() * 6.283,
                0.020 + rnd() * 0.040, [c[0] * 0.5, c[1] * 0.5, c[2] * 0.56], 0]);
    }

    decorN = pts.length;
    decorBase = new Float32Array(decorN * 3);
    decorPhase = new Float32Array(decorN);
    decorAmp = new Float32Array(decorN);
    const col = new Float32Array(decorN * 3);
    const meta = new Float32Array(decorN * 3);
    for (let i = 0; i < decorN; i++) {
      const q = pts[i];
      decorBase[i * 3] = q[0];
      decorBase[i * 3 + 1] = q[1];
      decorBase[i * 3 + 2] = q[2];
      decorPhase[i] = q[3];
      decorAmp[i] = q[4];
      const warm = 0.35;   // 往暖白靠，避免红绿杂色
      col[i * 3] = Math.min(255, (q[5][0] * (1 - warm) + 255 * warm) * 0.30);
      col[i * 3 + 1] = Math.min(255, (q[5][1] * (1 - warm) + 244 * warm) * 0.30);
      col[i * 3 + 2] = Math.min(255, (q[5][2] * (1 - warm) + 214 * warm) * 0.30);
      meta[i * 3] = rnd();                    // u
      meta[i * 3 + 1] = q[6] ? 2000 : i;      // strand（>=1500 视为装饰珠）
      meta[i * 3 + 2] = rnd();                // rnd
    }
    if (!decorVAO) {
      decorVAO = gl.createVertexArray();
      decorPosBuf = gl.createBuffer();
      decorColBuf = gl.createBuffer();
      decorMetaBuf = gl.createBuffer();
    }
    gl.bindVertexArray(decorVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, decorPosBuf);
    gl.bufferData(gl.ARRAY_BUFFER, decorBase, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, decorColBuf);
    gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, decorMetaBuf);
    gl.bufferData(gl.ARRAY_BUFFER, meta, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
  }

  const decorPos = () => decorVAO && decorBase;

  let decorTmp = null;
  function drawDecor() {
    if (!decorVAO || decorN === 0 || state.heart < 0.04) return;
    if (!decorTmp || decorTmp.length !== decorN * 3) decorTmp = new Float32Array(decorN * 3);
    const p = decorTmp;
    for (let i = 0; i < decorN; i++) {
      const ph = decorPhase[i], amp = decorAmp[i];
      p[i * 3] = decorBase[i * 3] + Math.sin(state.t * 0.9 + ph) * amp;
      p[i * 3 + 1] = decorBase[i * 3 + 1] + Math.cos(state.t * 0.7 + ph * 1.3) * amp * 0.8;
      p[i * 3 + 2] = decorBase[i * 3 + 2] + Math.sin(state.t * 0.5 + ph) * 0.01;
    }
    gl.bindVertexArray(decorVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, decorPosBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, p);      // 预分配 + 增量上传
    gl.bindVertexArray(decorVAO);                 // 属性指针已在 buildDecor 中设好
    gl.useProgram(progTree);
    gl.uniform1f(UT.uDisperse, 0);
    gl.uniform1f(UT.uHeart, 0);
    gl.uniform1f(UT.uEmblem, 0);
    gl.uniform1f(UT.uSize, 0.0105);
    gl.uniform1f(UT.uAlpha, state.heart * 0.25);
    gl.uniform1f(UT.uBuild, 1);
    gl.uniform1f(UT.uReflect, 0);
    gl.drawArrays(gl.POINTS, 0, decorN);
    gl.bindVertexArray(null);
  }

  /* ---------------- 主循环 ---------------- */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.clearColor(0, 0, 0, 1);

  let qAvg = 0.016, qFrames = 0, qLowered = false;
  function loop(now) {
    const dtRaw = (now - last) / 1000;
    const dt = Math.min(0.05, dtRaw);
    // 掉帧自适应：连续偏慢就降内部分辨率（只降一次）
    if (!qLowered && dtRaw > 0.002) {
      qAvg = qAvg * 0.96 + dtRaw * 0.04;
      if (++qFrames > 120 && qAvg > 0.024) {
        qLowered = true;
        cvs.dataset.lowQ = '1';
        resize();
      }
    }
    last = now;
    if (window.__pause) { requestAnimationFrame(loop); return; }
    if (window.__glLost) { requestAnimationFrame(loop); return; }
    idle += dt;
    render(dt);
    requestAnimationFrame(loop);
  }

  rebuildGeometry();
  requestAnimationFrame(loop);

  // 供外部检查
  window.__tree = {
    state, gl, onClick,
    get stage() { return stage; },
    get stageT() { return +stageT.toFixed(2); },
    doDouble() { toggleDisperse(); },
    startDissolve, setStage, STAGE,
    get emblem() { return +state.emblem.toFixed(2); },
    get decorN() { return decorN; },
    get personalIdx() { return personalIdx; },
    get count() { return geo.count; },
    get theme() { return THEMES[themeIdx].name; },
    paintRed() {
      window.__pause = true;
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, W, H);
      gl.clearColor(1, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      window.__pause = false;
      return 'ok';
    },
    compositeOnce() {
      render(0.016);
      return 'ok';
    },
    dbg() {
      const px = new Uint8Array(4), px2 = new Uint8Array(4), px3 = new Uint8Array(4);
      gl.bindFramebuffer(gl.FRAMEBUFFER, rtScene.fb);
      const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
      gl.readPixels(W >> 1, H >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      gl.readPixels(20, 20, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px2);
      const errScene = gl.getError();
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.readPixels(W >> 1, H >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px3);
      const out = {
        centerScene: Array.from(px), cornerScene: Array.from(px2), screen: Array.from(px3),
        errScene, w: W, h: H, fbStatus: st,
        vp: Array.from(vp).map(function (v) { return +v.toFixed(3); }),
        glErr: gl.getError()
      };
      return out;
    }
  };
})();

</script>

      'rgba(210,255,250,.95), rgba(140,240,230,.35) 45%, rgba(90,220,210,0) 70%',
      'rgba(255,238,246,.95), rgba(255,190,215,.35) 45%, rgba(255,150,190,0) 70%'
    ];

    function tint() {
      var T = window.__tree;
      if (!T) return;

      for (var k = 0; k < nodes.length; k++) {
        nodes[k].style.background = 'radial-gradient(circle, ' + stops + ')';

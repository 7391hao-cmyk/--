  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#05070f; overflow:hidden; }
  body { font-family:"Microsoft YaHei", system-ui, sans-serif; color:#e6eefc; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #gl:active { cursor:grabbing; }
  #ui {
    position:fixed; left:0; right:0; bottom:0; padding:0 4vw 3.2vh;
    text-align:center; pointer-events:none; transition:opacity .5s ease;
    background:linear-gradient(180deg, rgba(5,7,15,0) 0%, rgba(5,7,15,.55) 62%, rgba(5,7,15,.82) 100%);
  }
  h1 {
    margin:0; font-family:'CinzelX', Georgia, serif; font-weight:700;
    font-size:clamp(20px, 3.4vw, 46px); letter-spacing:.14em; line-height:1.1;
    background:linear-gradient(180deg,#fff6e4 0%, #f0d5a2 58%, #d8b478 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,226,178,.30));
  }
  .rule { width:min(26vw, 300px); height:1px; margin:10px auto 8px; position:relative;
          background:linear-gradient(90deg, transparent, rgba(255,226,178,.6), transparent); }
  .rule::after { content:''; position:absolute; left:50%; top:-2.5px; width:6px; height:6px;
                 transform:translateX(-50%) rotate(45deg); border:1px solid rgba(255,226,178,.85); }
  .sub { margin:0; font-size:clamp(12px, 1.35vw, 19px); letter-spacing:.16em; color:#dbe6f8;
         text-shadow:0 0 22px rgba(150,200,255,.45); }
  .sub .name { font-family:'ScriptX', cursive; font-size:1.6em; letter-spacing:.02em; color:#f6e3bb; }
  .hint { margin:8px 0 0; font-size:11px; letter-spacing:.08em; color:#61728f; }
  /* 散开后浮现的个性化层 */
  #personal {
    position:fixed; inset:0; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; transition:opacity .9s ease; pointer-events:none;
    padding:0 5vw 20vh;
  }
  #personal.on { opacity:1; }
  #personal.text { align-items:center; padding-bottom:0; }
  #personal .card { max-width:none; }
  #personal .card { text-align:center; max-width:min(72vw, 660px); }
  #personal .kicker {
    font-size:clamp(9px, 0.85vw, 12px); letter-spacing:.42em; color:#8ea3c2;
    text-transform:uppercase; margin-bottom:.9em;
  }
  #personal h2 {
    margin:0; font-family:'CinzelX', Georgia, serif; font-weight:700;
    font-size:clamp(19px, 2.9vw, 38px); letter-spacing:.1em; line-height:1.25;
    background:linear-gradient(180deg,#fff8ea 0%, #f2d9a8 60%, #dcb87a 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 24px rgba(255,226,178,.35));
  }
  #personal h2.bless {
    font-family:'LitiX', 'STLiti', '华文隶书', serif; font-weight:400;
    font-size:clamp(30px, 5.4vw, 76px); letter-spacing:.10em; line-height:1.35;
    background:linear-gradient(180deg,#fffaf0 0%, #f7e3bb 55%, #ddb87f 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 34px rgba(255,226,178,.42));
  }
  #personal p.bless-sub {
    margin:.9em 0 0; font-family:'STZhongsong','华文中宋','Songti SC',serif;
    font-size:clamp(13px, 1.45vw, 20px); letter-spacing:.30em; color:#e2dcf0;
    opacity:.9;
  }
  #personal p {
    margin:.75em 0 0; font-size:clamp(12px, 1.3vw, 17px); letter-spacing:.18em;
    color:#dbe7f8; text-shadow:0 0 20px rgba(150,200,255,.4);
  }
  #personal .photo-ph {
    width:min(46vw, 320px); height:min(28vh, 210px); margin:0 auto;
    border:1px dashed rgba(190,215,255,.34); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    color:#6c7f9e; font-size:12px; letter-spacing:.14em; line-height:1.8;
  }
  #personal img {
    max-width:min(52vw, 380px); max-height:44vh; border-radius:12px;
    box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(180,205,255,.12);
  }
  /* 爱心阶段：照片居中在爱心内部 */
  #personal.heart { align-items:center; padding-bottom:0; }
  #personal.heart .card { transform:translateY(-0.5vh); }
  #personal .hp {
    width:min(18.5vw, 202px); aspect-ratio:4/5; border-radius:12px; overflow:hidden;
    position:relative;
    box-shadow:0 18px 55px rgba(0,0,0,.55), 0 0 60px rgba(255,190,190,.22);
    display:flex; align-items:center; justify-content:center;
    background:rgba(120,150,200,.06);
    border:1px dashed rgba(255,205,215,.42);
  }
  #personal .hp img.ph {
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .62s ease;
  }
  #personal .hp img.ph.on { opacity:1; }
  #personal .hp .photo-ph { width:100%; height:100%; border:0; background:none;
    display:flex; flex-direction:column; gap:6px; align-items:center; justify-content:center; }
  #personal .hp .photo-ph span { font-size:9.5px; color:#6f82a0; }
  #personal .cap { margin-top:10px; font-size:11px; letter-spacing:.24em; color:#c9b6c8; }
  #personal .slots { display:flex; gap:16px; justify-content:center; margin-top:22px; }
  #personal .slot {
    width:min(19vw, 150px); height:min(17vh, 104px); border-radius:10px;
    border:1px dashed rgba(198,220,255,.46); background:rgba(140,172,225,.10);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    color:#9db1cd; font-size:10.5px; letter-spacing:.14em;
  }
  #personal .slot img { width:100%; height:100%; object-fit:cover; }
  .card-in { animation: cardIn .8s cubic-bezier(.22,.8,.3,1); }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(16px) scale(.985); filter:blur(3px); }
    to { opacity:1; transform:none; filter:none; }
  }
  /* ============ 通用版：中心主句 + 四周飘字 ============ */
  #personal.text .card { position:relative; width:100vw; height:100vh; max-width:none; }
  #personal .bless-center {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; width:min(64vw, 700px); z-index:3;
  }
  #personal .bless { font-size:clamp(44px, 6.2vw, 92px); }
  #personal .bless-center .bless-sub { font-size:clamp(10px, 1vw, 15px); letter-spacing:.34em; opacity:.9; }
  #personal .field { position:absolute; inset:0; z-index:1; transition:opacity .7s ease, filter .7s ease; }

  #personal .bl {
    position:absolute; width:auto; max-width:min(21vw, 248px); text-align:center;
    transform:translate(-50%,-50%) translate(var(--dx, 0px), var(--dy, 0px)) rotate(var(--rot, 0deg)) scale(.55);
    opacity:0;
    transition:opacity 2.6s cubic-bezier(.2,.08,.25,1), transform 2.2s cubic-bezier(.18,.72,.24,1);
    animation:floaty 10s ease-in-out infinite alternate;
  }
  #personal .bl.in {
    opacity:var(--op, 1);
    transform:translate(-50%,-50%) translate(0px, 0px) rotate(var(--rot, 0deg)) scale(1);
  }
  @keyframes floaty { from { translate:0 0; } to { translate:0 -6px; } }

  #personal .bl b {
    display:block; font-weight:400; letter-spacing:.12em; line-height:1.42;
    font-size:calc(clamp(10.5px, 1.06vw, 15.5px) * var(--fs, 1));
    white-space:nowrap;
  }
  #personal .bl span {
    display:block; margin-top:.42em; font-family:'STZhongsong','Songti SC',serif;
    font-size:calc(clamp(8px, .7vw, 10.5px) * var(--fs, 1)); letter-spacing:.16em; opacity:.72; color:#93a7c4;
  }

  #personal .f1 b, #personal .f4 b {
    font-family:'LitiX','STLiti',serif;
    background:linear-gradient(180deg,#fffaf0 0%, #f5dfb4 55%, #dcb87c 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 12px rgba(255,220,160,.38));
  }
  #personal .f2 b, #personal .f5 b {
    font-family:'XingX','STXingka','行楷',serif;
    color:#fff6e9; font-size:calc(clamp(11px, 1.14vw, 16.5px) * var(--fs, 1));
    text-shadow:0 0 14px rgba(255,232,190,.45);
  }
  #personal .f3 b, #personal .f6 b {
    font-family:'ZhongX','STZhongsong','SimSun',serif;
    color:#eaf1ff; letter-spacing:.18em;
    text-shadow:0 0 13px rgba(160,196,255,.42), 0 0 28px rgba(90,150,255,.14);
  }

  #personal.toheart .bless-center { animation:centerOut 1.0s cubic-bezier(.35,0,.2,1) forwards; }
  @keyframes centerOut { to { opacity:0; transform:translate(-50%,-50%) scale(.42); filter:blur(6px); } }
  #personal .heart-overlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:4; pointer-events:none;
  }
  #personal .heart-overlay .hp { opacity:0; animation:photoIn 1.05s cubic-bezier(.22,.8,.3,1) .18s forwards; }
  @keyframes photoIn {
    from { opacity:0; transform:scale(.5); filter:blur(12px); }
    to { opacity:1; transform:scale(1); filter:none; }
  }

  #personal .hp.empty {
    border:none; background:none; box-shadow:none; backdrop-filter:none;
    display:flex; align-items:center; justify-content:center;
    background-image:radial-gradient(circle at 50% 45%, rgba(255,226,178,.09), rgba(0,0,0,0) 62%);
    background-color:transparent;
  }
  #personal .hp.empty::before, #personal .hp.empty::after { display:none; }
  #personal.heart .cap { display:none; }
  #personal .hp.pulse { animation:heartPulse .62s cubic-bezier(.2,.8,.3,1); }
  @keyframes heartPulse {
    0% { transform:scale(1) translateY(var(--py, 0%)); }
    35% { transform:scale(1.06) translateY(var(--py, 0%)); }
    100% { transform:scale(1) translateY(var(--py, 0%)); }
  }
  #personal .hp.empty .hpText {
    font-family:'LitiX','STLiti',serif; font-size:clamp(18px, 2.0vw, 26px);
    letter-spacing:.28em; text-indent:.28em;
    background:linear-gradient(180deg,#fffaf0,#f2d9a8 60%,#dcb87c);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,220,160,.35));
  }

  @media (max-width: 640px) {
    #personal .bl { max-width:min(64vw, 230px); }
    #personal .bl b {
      font-size:calc(clamp(9.5px, 3vw, 13px) * var(--fs, 1));
      letter-spacing:.04em; white-space:normal;
    }
    #personal .bl span { font-size:9px; letter-spacing:.1em; }
    #personal .bless { font-size:clamp(34px, 11vw, 56px); }
  }
  #themeName { display:none;
    position:fixed; left:50%; top:4vh; transform:translateX(-50%);
    font-size:13px; letter-spacing:.3em; color:#e9d7ae; opacity:0; transition:opacity .45s;
    text-shadow:0 0 18px rgba(255,220,160,.55); pointer-events:none;
  }
  #nogl { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
          flex-direction:column; gap:12px; font-size:14px; color:#9fb2ce; }
  /* 背景点缀：主体之外的小光点，缩小画面时不至于太空 */
  #motes {
    position:absolute; inset:0; pointer-events:none; z-index:0;
    opacity:.62; transition:opacity 1.4s ease;
  }
  body.textstage #motes { opacity:1 !important; }
  #motes i {
    position:absolute; display:block; border-radius:50%;
    background:radial-gradient(circle, rgba(255,236,205,.95), rgba(255,214,160,.35) 45%, rgba(255,200,140,0) 70%);
    animation:moteFloat var(--d, 14s) ease-in-out infinite alternate;
    opacity:var(--o, .5);
  }
  @keyframes moteFloat {
    from { translate:0 0; opacity:calc(var(--o, .5) * .55); }
    to { translate:0 -14px; opacity:var(--o, .5); }
  }
  /* 点击涟漪 */
  body > i {
    position:fixed; width:8px; height:8px; margin:-4px 0 0 -4px; pointer-events:none; z-index:70;
    border:1px solid rgba(255,226,178,.65); border-radius:50%;
    animation:rippleUp .95s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rippleUp {
    from { transform:scale(.4); opacity:.85; }
    to { transform:scale(9); opacity:0; }
  }
  /* 指针光尘 */
  body > u {
    position:fixed; width:3px; height:3px; margin:-1.5px 0 0 -1.5px; pointer-events:none; z-index:69;
    border-radius:50%; background:radial-gradient(circle, rgba(255,240,214,.95), rgba(255,208,150,0) 70%);
    animation:dustFade var(--ds, .8s) ease-out forwards;
  }
  @keyframes dustFade {
    from { transform:scale(1); opacity:.9; }
    to { transform:scale(.2) translateY(8px); opacity:0; }
  }
  #ui { transform-origin:50% 100%; transition:opacity 1.2s ease, translate 1.2s ease; }
  body.textstage #ui { opacity:.16; translate:0 14px; }
  /* 照片对齐：X/Y 都用运行时投影结果 */
  #personal.heart .card { transform: translate(calc(var(--hpX, 0px)), calc(var(--hpY, 0px))); will-change: transform; }
  #personal.heart .hp { width: min(16.5vw, 220px); margin-top: 0; }
  /* 只用 opacity + transform（不重栅格化，避免卡顿）*/
  #personal.heart .hp, #personal .heart-overlay .hp {
    opacity: 0;
    animation: photoRise 1.5s cubic-bezier(.16,.72,.22,1) .15s forwards;
    will-change: transform, opacity; backface-visibility: hidden;
  }
  @keyframes photoRise {
    0% { opacity: 0; transform: translateY(64px) scale(.90); }
    55% { opacity: .9; }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  #personal .hp img.ph { transition: opacity .9s ease; }
  #personal { transform-origin:50% 50%; }
  /* 常驻飘雪 */\n  #snow { position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden; }\n  #snow i {\n    position:absolute; top:-6%; display:block; border-radius:50%;\n    background:radial-gradient(circle, rgba(255,255,255,.95), rgba(220,235,255,.25) 55%, rgba(200,220,255,0) 72%);\n    animation:snowFall var(--sd, 18s) linear infinite;\n    opacity:var(--so, .45);\n  }\n  @keyframes snowFall {\n    from { translate:0 0; }\n    to { translate:var(--sx, 20px) 115vh; }\n  }\n  /* 爱心阶段：周围柔和环境光 */\n  #personal.heart::before {\n    content:''; position:absolute; left:50%; top:46%; width:70vmin; height:70vmin;\n    transform:translate(-50%,-50%); pointer-events:none;\n    background:radial-gradient(circle, rgba(255,226,178,.14), rgba(255,200,150,.05) 45%, rgba(0,0,0,0) 72%);\n    animation:heartAmbient 2.2s ease-out forwards;\n  }\n  @keyframes heartAmbient { from { opacity:0; transform:translate(-50%,-50%) scale(.82); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } }\n  /* 爱心外圈漂浮光点 */\n  #heartMotes { position:absolute; inset:0; pointer-events:none; z-index:2; opacity:0; transition:opacity 1.6s ease; }\n  #personal.heart #heartMotes { opacity:1; }\n  #heartMotes i {\n    position:absolute; display:block; border-radius:50%;\n    background:radial-gradient(circle, rgba(255,240,214,.95), rgba(255,208,150,.30) 50%, rgba(255,190,130,0) 72%);\n    animation:heartMote var(--hd, 9s) ease-in-out infinite alternate;\n    opacity:var(--ho, .5);\n  }\n  @keyframes heartMote {\n    from { translate:0 0; opacity:calc(var(--ho, .5) * .45); }\n    to { translate:0 -16px; opacity:var(--ho, .5); }\n  }\n  /* 文案阶段雪变慢，避免分神 */\n  body.textstage #snow i { animation-duration:calc(var(--sd, 18s) * 1.9); opacity:calc(var(--so, .45) * .7); }\n  /* 首屏提示：第一次打开时出现，几秒后淡出 */\n  #firstHint {\n    position:fixed; left:50%; bottom:16vh; transform:translateX(-50%);\n    z-index:60; pointer-events:none; text-align:center;\n    font-family:'STZhongsong','Songti SC',serif; font-size:clamp(11px,1.05vw,14px);\n    letter-spacing:.32em; color:rgba(240,232,214,.9);\n    text-shadow:0 0 18px rgba(255,226,178,.35);\n    animation:firstHintIn .9s ease both;\n  }\n  #firstHint.out { animation:firstHintOut .9s ease forwards; }\n  @keyframes firstHintIn { from { opacity:0; translate:0 10px; } to { opacity:1; translate:0 0; } }\n  @keyframes firstHintOut { to { opacity:0; translate:0 -8px; } }\n  /* 切换形态 / 配色时的名称闪现 */\n  #formName {\n    position:fixed; right:4vw; top:9vh; z-index:60; pointer-events:none;\n    font-family:'LitiX','STLiti',serif; font-size:clamp(13px,1.3vw,18px);\n    letter-spacing:.3em; color:rgba(255,240,214,.92);\n    text-shadow:0 0 16px rgba(255,220,160,.45);\n    opacity:0; translate:0 6px; transition:opacity .45s ease, translate .45s ease;\n  }\n  #formName.show { opacity:1; translate:0 0; }\n  /* 移动端：竖屏排版与触控优化 */\n  @media (max-width: 640px) {\n    #ui h1 { font-size:clamp(30px, 11.5vw, 56px); letter-spacing:.06em; }\n    #ui .sub { font-size:clamp(9px, 3vw, 12px); letter-spacing:.16em; }\n    #ui .hint { font-size:10px; letter-spacing:.06em; opacity:.75; }\n    #formName { top:6vh; right:6vw; }\n    #motes i { width:2px !important; height:2px !important; }\n  }\n</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <h1>MERRY CHRISTMAS</h1>
  <div class="rule"></div>
  <p class="sub">愿这束光，替我说一句晚安</p>
  <p class="hint">拖拽旋转 · 滚轮缩放 · 双击让树散开 · 散开时单击进入爱心 · C 配色 · 1-4 形态 · R 录制</p>
</div>
<div id="snow"></div>
<div id="heartMotes"></div>
<div id="motes"></div>
<div id="personal"><div class="card card-in"></div></div>
<div id="themeName"></div>
<div id="nogl"><b>你的浏览器不支持 WebGL2</b><span>请用 Chrome / Edge / Safari 最新版打开</span></div>
<script>
/* ============================================================
   极光圣诞树 · WebGL 交互版
   - 12k 光点，GPU 绘制，加法混合
   - 拖拽旋转 / 滚轮缩放 / 点击凝聚形状 / 1-4 形态 / C 配色 / G 散开
   - 单文件：无外部依赖（字体由占位符注入）
   ============================================================ */
(function () {
  'use strict';

  const cvs = document.getElementById('gl');
  const gl = cvs.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false });
  if (!gl) {
    document.getElementById('nogl').style.display = 'flex';
    return;
  }

  /* ---------------- 调色板（对应 python 版 4 套） ---------------- */
  const THEMES = [
    { name: '月白墨蓝', flows: [[0.62, 0.80, 1.00], [0.86, 0.92, 1.00], [0.55, 0.70, 0.95]],
      orn: [[1.00, 0.86, 0.55], [0.90, 0.96, 1.00], [1.00, 0.55, 0.62], [0.70, 1.00, 0.86]],
      sky: [0.020, 0.032, 0.062], glow: [0.20, 0.34, 0.60], star: [1.0, 0.96, 0.86] },
    { name: '香槟金雾', flows: [[1.00, 0.86, 0.62], [1.00, 0.94, 0.80], [0.95, 0.75, 0.50]],
      orn: [[1.00, 0.80, 0.42], [1.00, 0.92, 0.72], [0.95, 0.55, 0.40], [0.85, 0.95, 0.70]],
      sky: [0.018, 0.026, 0.048], glow: [0.30, 0.34, 0.48], star: [1.0, 0.95, 0.86] },
    { name: '极夜青金', flows: [[0.45, 0.95, 0.92], [0.80, 1.00, 0.98], [0.30, 0.75, 0.80]],
      orn: [[0.55, 1.00, 0.92], [0.90, 1.00, 1.00], [1.00, 0.75, 0.45], [0.65, 0.85, 1.00]],
      sky: [0.014, 0.030, 0.038], glow: [0.12, 0.38, 0.42], star: [0.90, 1.0, 0.98] },
    { name: '樱雪', flows: [[1.00, 0.78, 0.86], [1.00, 0.92, 0.96], [0.86, 0.68, 0.92]],
      orn: [[1.00, 0.72, 0.82], [1.00, 0.95, 0.98], [0.85, 0.95, 1.00], [1.00, 0.85, 0.60]],
      sky: [0.032, 0.020, 0.034], glow: [0.42, 0.22, 0.38], star: [1.0, 0.94, 0.97] }
  ];
  let themeIdx = 1;   // 默认香槟金

  /* ---------------- 常量 ---------------- */
  const H0 = -1.15, H1 = 1.30;            // 树高
  const TIERS = 6;
  const CAM_DIST = 4.35;

  /* ---------------- 小工具 ---------------- */
  const rnd = (function () {
    let s = 1234567;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  })();

  function mat4Perspective(out, fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
    out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
    out[8] = 0; out[9] = 0; out[10] = (far + near) * nf; out[11] = -1;
    out[12] = 0; out[13] = 0; out[14] = 2 * far * near * nf; out[15] = 0;
    return out;
  }
  function mat4LookAt(out, eye, center, up) {
    let z0 = eye[0] - center[0], z1 = eye[1] - center[1], z2 = eye[2] - center[2];
    let l = 1 / Math.hypot(z0, z1, z2); z0 *= l; z1 *= l; z2 *= l;
    let x0 = up[1] * z2 - up[2] * z1, x1 = up[2] * z0 - up[0] * z2, x2 = up[0] * z1 - up[1] * z0;
    l = Math.hypot(x0, x1, x2); l = l ? 1 / l : 0; x0 *= l; x1 *= l; x2 *= l;
    const y0 = z1 * x2 - z2 * x1, y1 = z2 * x0 - z0 * x2, y2 = z0 * x1 - z1 * x0;
    out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
    out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
    out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
    out[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
    out[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
    out[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
    out[15] = 1;
    return out;
  }
  function mat4Mul(out, a, b) {
    for (let i = 0; i < 4; i++) {
      const ai0 = a[i], ai1 = a[i + 4], ai2 = a[i + 8], ai3 = a[i + 12];
      out[i] = ai0 * b[0] + ai1 * b[1] + ai2 * b[2] + ai3 * b[3];
      out[i + 4] = ai0 * b[4] + ai1 * b[5] + ai2 * b[6] + ai3 * b[7];
      out[i + 8] = ai0 * b[8] + ai1 * b[9] + ai2 * b[10] + ai3 * b[11];
      out[i + 12] = ai0 * b[12] + ai1 * b[13] + ai2 * b[14] + ai3 * b[15];
    }
    return out;
  }

  /* ---------------- 几何：四种形态 ---------------- */
  function buildCascade() {
    const nFil = 62, nSeg = 190;
    const pos = [], meta = [], col = [];
    const th = THEMES[themeIdx];
    for (let i = 0; i < nFil; i++) {
      const ph = rnd() * Math.PI * 2;
      const rBase = 0.26 + 0.80 * Math.pow(rnd(), 0.75);
      const aBase = rnd() * Math.PI * 2;
      const c = th.flows[i % th.flows.length];
      for (let k = 0; k < nSeg; k++) {
        const u = k / (nSeg - 1);
        const tf = (u * TIERS) % 1;
        const tierMul = 0.64 + 0.48 * tf;
        let r = (0.055 + rBase * Math.pow(u, 1.58)) * tierMul *
                (1 + 0.10 * Math.sin(3.4 * u * Math.PI + ph));
        r *= 1 - 0.16 * Math.pow(u, 3) * Math.cos(ph);
        if (i % 9 === 0) r *= 1 + 0.20 * u * u;
        const ang = aBase + 0.85 * u * (1 - 0.5 * u) + 0.30 * Math.sin(u * 2.6 + ph);
        const y = H1 - (H1 - H0) * u;
        if (u < 0.16 && (i % 3) !== 0) continue;        // 顶部抽稀，避免堆成白团
        pos.push(r * Math.cos(ang), y + 0.02 * Math.sin(u * 7 + ph), r * Math.sin(ang));
        meta.push(u, i, rnd());
        col.push(c[0], c[1], c[2]);
      }
    }
    // 树尖星芒：换成"一颗星"作为顶部焦点
    {
      const tipY = H1 + 0.05;
      const sc = th.orn[0];
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        for (let k = 0; k < 40; k++) {
          const t = (k + 1) / 40;
          const rr = 0.105 * t;
          pos.push(Math.cos(a) * rr, tipY + Math.sin(a) * rr, 0);
          meta.push(1, 2000 + i, rnd());
          col.push(sc[0] * 0.55, sc[1] * 0.55, sc[2] * 0.55);
        }
      }
      for (let k = 0; k < 40; k++) {
        const a = rnd() * Math.PI * 2;
        const rr = Math.pow(rnd(), 1.6) * 0.040;
        pos.push(Math.cos(a) * rr, tipY + Math.sin(a) * rr, 0);
        meta.push(1, 2000, rnd());
        col.push(1.0, 0.96, 0.86);
      }
      for (let k = 0; k < 110; k++) {          // 从星芒向下洒出的淡光带
        const t = k / 109;
        const yy = tipY - 0.05 - t * 0.62;
        const rr = Math.pow(rnd(), 1.4) * 0.028 * (1 - t * 0.7);
        const a = rnd() * Math.PI * 2;
        const fade = 1 - t;
        pos.push(Math.cos(a) * rr, yy, Math.sin(a) * rr);
        meta.push(1, 2000, rnd());
        col.push(1.0 * fade, 0.93 * fade, 0.80 * fade);
      }
    }

    // 每层底缘的光弧
    for (let t = 0; t < TIERS; t++) {
      const u = (t + 1) / TIERS;
      const rr = (0.055 + 0.86 * Math.pow(u, 1.45)) * 1.12;
      const y = H1 - (H1 - H0) * u;
      const m = 150;
      const c = th.orn[t % th.orn.length];
      for (let k = 0; k < m; k++) {
        const a = (k / m) * Math.PI * 2 + t * 0.55;
        pos.push(rr * Math.cos(a), y + 0.012 * Math.sin(a * 3), rr * Math.sin(a));
        meta.push(u, 1000 + t, 0.5);
        col.push(c[0] * 0.70, c[1] * 0.70, c[2] * 0.70);
      }
    }
    // 装饰光珠
    for (let i = 0; i < 200; i++) {
      const u = Math.pow(rnd(), 0.8);
      const tf = (u * TIERS) % 1;
      const tierMul = 0.64 + 0.48 * tf;
      const r = (0.022 + (0.35 + 0.6 * rnd()) * Math.pow(u, 1.45)) * tierMul;
      const a = rnd() * Math.PI * 2;
      const y = H1 - (H1 - H0) * u;
      pos.push(r * Math.cos(a), y + 0.01, r * Math.sin(a));
      const c = th.orn[i % th.orn.length];
      meta.push(u, 2000 + i, 1.0);
      col.push(c[0], c[1], c[2]);
    }
    return { pos: new Float32Array(pos), meta: new Float32Array(meta), col: new Float32Array(col), count: pos.length / 3 };
  }

  function buildHelix() {
    const nFil = 34, nSeg = 240;
    const pos = [], meta = [], col = [];
    const th = THEMES[themeIdx];
    for (let i = 0; i < nFil; i++) {
      const off = (i / nFil) * Math.PI * 2;
      const c = th.flows[i % th.flows.length];
      for (let k = 0; k < nSeg; k++) {
        const u = k / (nSeg - 1);
        const r = (0.10 + 0.78 * Math.pow(u, 1.12)) * (1 + 0.035 * Math.sin(u * 26 + off));
        const a = off + u * Math.PI * 9;   // 螺距更大，读作优雅的双螺旋
        const y = H1 - (H1 - H0) * u;
        pos.push(r * Math.cos(a), y, r * Math.sin(a));
        meta.push(u, i, rnd());
        col.push(c[0] * 0.94, c[1] * 0.98, c[2] * 1.06);   // 冷金，读作"优雅版"
      }
    }
    return { pos: new Float32Array(pos), meta: new Float32Array(meta), col: new Float32Array(col), count: pos.length / 3 };
  }

  function buildArcs() {
    const nRing = 30, nArc = 260;
    const pos = [], meta = [], col = [];
    const th = THEMES[themeIdx];
    for (let i = 0; i < nRing; i++) {
      const u = (i + 1) / nRing;
      const r = (0.06 + 0.92 * Math.pow(u, 1.30));
      const y = H1 - (H1 - H0) * u;
      const c = th.flows[i % th.flows.length];
      const sway = 0.06 * Math.sin(i * 1.7);
      for (let k = 0; k < nArc; k++) {
        const a = (k / nArc) * Math.PI * 2;
        // 环面起伏更明显，读作"光环树"而不是一堆同心圆
        col.push(c[0] * 1.08, c[1] * 1.02, c[2] * 0.94);   // arcs 偏亮暖
        const ripple = 0.075 * Math.sin(a * 3 + i * 0.9) * (0.4 + 0.6 * u);
        pos.push(r * Math.cos(a) * (1 + 0.05 * Math.sin(a * 2 + i)),
                 y + sway * Math.sin(a * 2) + ripple,
                 r * Math.sin(a) * (1 + 0.05 * Math.cos(a * 2 + i)));
        meta.push(u, i, rnd());
        col.push(c[0], c[1], c[2]);
      }
    }
    return { pos: new Float32Array(pos), meta: new Float32Array(meta), col: new Float32Array(col), count: pos.length / 3 };
  }

  function buildRibbons() {
    const nRib = 40, nSeg = 170;
    const pos = [], meta = [], col = [];
    const th = THEMES[themeIdx];
    for (let i = 0; i < nRib; i++) {
      const a0 = (i / nRib) * Math.PI * 2;
      const w = 0.03 + 0.07 * rnd();
      const c = th.flows[i % th.flows.length];
      for (let k = 0; k < nSeg; k++) {
        const u = k / (nSeg - 1);
        const r = (0.05 + 0.88 * Math.pow(u, 1.20));
        // 带宽随高度收窄、摆动更柔，读作"飘带"而不是布条
        const ww = w * (1.35 - 0.75 * u);
        const a = a0 + Math.sin(u * 3.2 + i * 0.7) * ww + 0.02 * Math.sin(u * 11 + i);
        const y = H1 - (H1 - H0) * u + 0.022 * Math.sin(u * 7 + i * 1.3);
        pos.push(r * Math.cos(a), y, r * Math.sin(a));
        meta.push(u, i, rnd());
        col.push(c[0], c[1], c[2]);
      }
    }
    return { pos: new Float32Array(pos), meta: new Float32Array(meta), col: new Float32Array(col), count: pos.length / 3 };
  }

  function shapeSnowEmblem() {
    const o = [];
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      seg(0, 0, Math.cos(a) * 0.90, Math.sin(a) * 0.90, 44, o);
      const bx = Math.cos(a) * 0.52, by = Math.sin(a) * 0.52;
      seg(bx, by, bx + Math.cos(a + 0.9) * 0.28, by + Math.sin(a + 0.9) * 0.28, 18, o);
      seg(bx, by, bx + Math.cos(a - 0.9) * 0.28, by + Math.sin(a - 0.9) * 0.28, 18, o);
    }
    return o;
  }

  function shapeHeartEmblem() {
    const o = [];
    for (let i = 0; i < 300; i++) {
      const t = (i / 300) * Math.PI * 2;
      const X = 16 * Math.pow(Math.sin(t), 3);
      const Y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      o.push([X * 0.058, Y * 0.058]);
    }
    return o;
  }

  const FORMS = [buildCascade, buildHelix, buildArcs, buildRibbons];
  let formIdx = 0;
  let geo = null;

  function rebuildGeometry() {
    const oldGeo = geo;
    geo = FORMS[formIdx]();
    if (oldGeo) {
      for (const k of ['vbo', 'sbo', 'mbo', 'cbo', 'hbo', 'ebo']) {
        if (oldGeo[k]) { gl.deleteBuffer(oldGeo[k]); oldGeo[k] = null; }
      }
    }
    // 散开态：球壳随机
    const n = geo.count, sc = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2, b = Math.acos(2 * rnd() - 1);
      const rr = 1.1 + 1.5 * Math.pow(rnd(), 0.6);
      sc[i * 3] = Math.sin(b) * Math.cos(a) * rr;
      sc[i * 3 + 1] = Math.cos(b) * rr * 0.8 + 0.05;
      sc[i * 3 + 2] = Math.sin(b) * Math.sin(a) * rr;
    }
    geo.scatter = sc;

    // 爱心目标：2D 心形曲线 + 厚度，让粒子有体积感
    // 爱心：空心描边（粒子几乎都落在轮廓上），并整体上下翻转
    const hx = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const th = rnd() * Math.PI * 2;
      const edge = 0.880 + rnd() * 0.120;          // 轮廓带加宽，避免糊成实线
      const X = 16 * Math.pow(Math.sin(th), 3);
      const Y = 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th);
      const wob = 0.05 * (rnd() - 0.5);
      // 额外抖动：分散尖角（心尖/上凹）处的粒子堆积，避免出现亮条
      const jx = (rnd() - 0.5) * 0.045;
      const jy = (rnd() - 0.5) * 0.035;
      hx[i * 3] = X * 0.0865 * edge * 1.13 + wob * 0.02 + jx;
      hx[i * 3 + 1] = Y * 0.0865 * edge * 0.94 + 0.40 + jy;
      hx[i * 3 + 2] = (rnd() - 0.5) * 0.26;          // 厚度更均匀，减少同深度叠加
    }
    geo.heart = hx;

    // 同一批粒子分成三组，分别汇聚成 梨 / 鱼 / 星（世界坐标）
    const EM_POS = [
      [-1.02, 0.16, 0.42],   // 梨
      [0.00, 0.20, 0.40],    // 鱼
      [1.02, 0.18, 0.38]     // 星
    ];

  function seg(ax, ay, bx, by, n, out) {
    for (let i = 0; i < n; i++) {

      out.push([ax + (bx - ax) * t, ay + (by - ay) * t]);
    }

  function poly(pts, n, out, closed) {
    for (let i = 0; i < pts.length - 1; i++) seg(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], n, out);
    if (closed) seg(pts[pts.length - 1][0], pts[pts.length - 1][1], pts[0][0], pts[0][1], n, out);
  }

    a0 = a0 === undefined ? 0 : a0; a1 = a1 === undefined ? Math.PI * 2 : a1;
    for (let i = 0; i < n; i++) {
      const a = a0 + (a1 - a0) * (i / (n - 1));
      out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
  }

    if (fieldTimer) { clearInterval(fieldTimer); fieldTimer = null; }
    fieldIdx = 0;
    const host = personalEl.querySelector('.field');
    if (!host) return;

    const W = window.innerWidth, H = window.innerHeight;
    const items = [];

    // ① 先全部创建（不可见），用于真实测量尺寸
    for (let i = 0; i < SLOTS.length; i++) {
      const slot = SLOTS[i];
      const it = BAG[i % BAG.length];
      const el = document.createElement('div');
      el.className = 'bl ' + slot.cls;
      el.style.left = slot.x + '%';
      el.style.top = slot.y + '%';
      el.style.setProperty('--rot', slot.rot + 'deg');
      el.style.setProperty('--fs', slot.sc);
      el.style.setProperty('--op', slot.op);
      el.style.animationDuration = slot.dur + 's';
      el.style.opacity = '0';
      el.innerHTML = '<b>' + it.t + '</b>' + (slot.single ? '' : '<span>' + it.b + '</span>');
      host.appendChild(el);
      items.push({ el: el, slot: slot, w: el.offsetWidth || 120, h: el.offsetHeight || 40 });
    }

    // ② 网格占位：从构造上避免重叠（宁少不乱）
    const cols = Math.max(4, Math.round(W / 236));
    const rows = Math.max(6, Math.round((H * 0.78) / 72));
    const cellW = W / cols, cellH = (H * 0.78) / rows;
    // 实测主句（圣诞快乐 + 副句）的包围盒，按它挖空
    let keep = { l: W * 0.36, r: W * 0.64, t: H * 0.36, b: H * 0.56 };
    const bc = personalEl.querySelector('.bless-center');
    if (bc) {
      const rr = bc.getBoundingClientRect();
      if (rr.width > 10) {
        keep = { l: rr.left - 30, r: rr.right + 30, t: rr.top - 22, b: rr.bottom + 22 };
      }
    }
    const cells = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cx = (c + 0.5) * cellW;
        const cy = H * 0.06 + (r + 0.5) * cellH;
        // 与主句包围盒相交的格子直接跳过
        if (cx + cellW / 2 > keep.l && cx - cellW / 2 < keep.r &&
            cy + cellH / 2 > keep.t && cy - cellH / 2 < keep.b) continue;
        cells.push({ x: cx, y: cy, used: false });
      }
    }
    // 宽的优先占位，避免大块文案无处可放
    const wide = items.slice().sort(function (a, b) { return b.w - a.w; });
    const placed = [];
    for (const rec of wide) {
      if (rec.w + 12 > cellW) continue;                 // 一格放不下就放弃（宁少不乱）
      const cand = cells.filter(function (c) { return !c.used; })
                        .sort(function () { return Math.random() - 0.5; });
      const cell = cand[0];
      if (!cell) continue;
      cell.used = true;
      rec.slot.x = (cell.x + (Math.random() - 0.5) * Math.min(24, cellW - rec.w - 18)) / W * 100;
      rec.slot.y = (cell.y + (Math.random() - 0.5) * Math.min(18, cellH - rec.h - 12)) / H * 100;
      rec.el.style.left = rec.slot.x.toFixed(2) + '%';
      rec.el.style.top = rec.slot.y.toFixed(2) + '%';
      rec.el.style.setProperty('--dx', ((50 - rec.slot.x) / 100 * W).toFixed(0) + 'px');
      rec.el.style.setProperty('--dy', ((46 - rec.slot.y) / 100 * H).toFixed(0) + 'px');
      placed.push(rec);
    }
    // 没占到位的一律移除
    for (const rec of items) {
      if (placed.indexOf(rec) < 0 && rec.el.parentNode) rec.el.parentNode.removeChild(rec.el);
    }
    const live = placed;

    // ③ 完全随机顺序，一条条从中心飞出去
    const order = live.map(function (_, k) { return k; });
    for (let k = order.length - 1; k > 0; k--) {
      const r = Math.floor(Math.random() * (k + 1));
      const t = order[k]; order[k] = order[r]; order[r] = t;
    }

    fieldTimer = setInterval(function () {
      if (stage !== STAGE.TEXT) { clearInterval(fieldTimer); fieldTimer = null; return; }
      if (fieldIdx >= order.length) { clearInterval(fieldTimer); fieldTimer = null; return; }
      const rec = live[order[fieldIdx]];
      fieldIdx++;
      void rec.el.offsetWidth;          // 强制回流：保证"从中心飞出"的起点被渲染过
      rec.el.style.opacity = '';        // 去掉占位时的内联 0，交给 .in 接管
      rec.el.classList.add('in');
    }, 165);
  }

  const STAGE = { TREE: 0, SYMBOL: 1, TEXT: 2, PHOTO: 3, HEART: 4 };

  let stage = STAGE.TREE;
  let stageT = 0;
  let blessIdx = 0;
  let photoIdx = 0, finaleStarted = false;
  const personalEl = document.getElementById('personal');
  const uiEl = document.getElementById('ui');

  let heartBuilt = false;
  let heartPending = false;
  let heartTimer = null, heartTimer2 = null;

  function beginHeartTransition() {
    if (heartPending) return;
    heartPending = true;
    photoIdx = 0;
    state.heartWanted = true;
    personalEl.classList.add('toheart');

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight * 0.47;
    // 心形轮廓（屏幕空间近似）：返回给定角度上最近的轮廓点
    function heartOutlineAt(theta) {
      const sx = Math.min(window.innerWidth, window.innerHeight) * 0.31;
      const sy = sx * 0.92;
      let bx = cx, by = cy, bd = 1e9;
      for (let i = 0; i < 120; i++) {
        const tt = (i / 120) * Math.PI * 2;
        const X = 16 * Math.pow(Math.sin(tt), 3);
        const Y = 13 * Math.cos(tt) - 5 * Math.cos(2 * tt) - 2 * Math.cos(3 * tt) - Math.cos(4 * tt);
        const px = cx + X * sx / 16;
        const py = cy - Y * sy / 16;
        let d = Math.abs(Math.atan2(py - cy, px - cx) - theta);
        if (d > Math.PI) d = Math.PI * 2 - d;
        if (d < bd) { bd = d; bx = px; by = py; }
      }
      return [bx, by];
    }

    // 第一段：文案原地消散（由内向外错开，读了先散、看了后散）
    const items = personalEl.querySelectorAll('.field .bl');
    for (let i = 0; i < items.length; i++) {
      const el = items[i];
      const r = el.getBoundingClientRect();
      const ex = r.left + r.width / 2, ey = r.top + r.height / 2;
      const dist = Math.hypot(ex - cx, ey - cy) / (Math.min(window.innerWidth, window.innerHeight) * 0.5);
      const delay = Math.min(0.45, dist * 0.42);
      const dur = 0.72;
      el.style.transition = 'opacity ' + dur + 's ease ' + delay.toFixed(2) + 's, ' +
                            'transform ' + dur + 's ease ' + delay.toFixed(2) + 's, ' +
                            'filter ' + dur + 's ease ' + delay.toFixed(2) + 's';
      el.style.opacity = '0';
      el.style.transform = 'translate(-50%,-50%) scale(.90) rotate(0deg)';
      el.style.filter = 'blur(2.5px)';
    }


    // 第二段：文案散得差不多了，粒子开始慢慢聚成爱心
    heartTimer = setTimeout(function () {
      heartTimer = null;
      if (stage !== STAGE.TEXT) { heartPending = false; state.heartWanted = false; return; }
      state.heartWanted = true;          // 让着色器提前开始凝聚
      // 文案已散尽：立刻停掉星云的 37 个动画并延后回收节点
      const fld = personalEl.querySelector('.field');
      if (fld) {
        fld.style.display = 'none';
        const kids = Array.prototype.slice.call(fld.children);
        const drop = function () {
          for (let i = 0; i < kids.length; i++) {
            if (kids[i].parentNode) kids[i].parentNode.removeChild(kids[i]);
          }
        };
        if (window.requestIdleCallback) requestIdleCallback(drop, { timeout: 1200 });
        else setTimeout(drop, 700);
      }
    }, 850);

    // 第三段：等粒子确实聚成形（≥85%）再亮出中心，慢设备也不会"没成形就切"
    const t0 = Date.now();
    heartTimer2 = setInterval(function () {
      const elapsed = Date.now() - t0;
      if (stage !== STAGE.TEXT) {
        clearInterval(heartTimer2);
        heartTimer2 = null;
        heartPending = false;
        state.heartWanted = false;
        return;
      }
      if (state.heart > 0.85 || (elapsed > 2800 && state.heart > 0.5) || elapsed > 6500) {
        clearInterval(heartTimer2);
        heartTimer2 = null;
        personalEl.classList.remove('toheart');
      const fld2 = personalEl.querySelector('.field');
      if (fld2) fld2.style.display = 'none';   // 文案已散完，停止其动画
        setStage(STAGE.HEART);
        heartPending = false;
      }
    }, 90);
  }
  let photoLayer = 0;          // 0 / 1 两张图层轮换

  function buildHeartFrame() {
    const card = personalEl.querySelector('.card');
    const hasPhoto = PHOTOS.some(function (p) { return p && p.src; });
    card.innerHTML =
      (hasPhoto
        ? '<div class="hp yzy"><img class="ph" alt=""><img class="ph" alt=""></div>'
        : '<div class="hp empty"><span class="hpText">圣诞快乐</span></div>') +
      '<p class="cap"></p>';
    heartBuilt = true;
    photoLayer = 0;
    // 先把第一张塞进图层 0
    const imgs = card.querySelectorAll('img.ph');
    const first = PHOTOS[photoIdx % PHOTOS.length];
    if (first && first.src) { imgs[0].src = first.src; imgs[0].classList.add('on'); }
    card.querySelector('.cap').textContent = (first && first.caption) || '';
    // 先以透明初态渲染一帧，再启动上浮动画 —— 否则首帧会"直接出现"
    const hp0 = card.querySelector('.hp');
    if (hp0) {
      hp0.style.animation = 'none';
      hp0.style.opacity = '0';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          hp0.style.animation = '';
          hp0.style.opacity = '';
        });
      });
    }
    setSideCaption(first && first.caption);
  }

  // 预解码：把 9 张照片提前解好，切换时不再主线程解码
  setTimeout(function () {
    try {
      PHOTOS.forEach(function (pp) {
        if (!pp || !pp.src) return;
        const im = new Image();
        im.decoding = 'async';
        im.src = pp.src;
        if (im.decode) im.decode().catch(function () {});
      });
    } catch (e) {}
  }, 300);

  // 爱心两侧的竖排文字（body 级，避免被祖先 transform 影响定位）
  let sideNameEl = null, sideCapEl = null;
  function ensureSideTags(show) {
    if (!sideNameEl) {
      sideNameEl = document.createElement('span');
      sideNameEl.id = 'sideName';
      personalEl.appendChild(sideNameEl);
      sideCapEl = document.createElement('span');
      sideCapEl.id = 'sideCap';
      personalEl.appendChild(sideCapEl);
    }
    const cls = show ? 'on' : '';
    sideNameEl.className = cls;
    sideCapEl.className = cls;
  }
  function setSideCaption(txt) {
    if (sideCapEl) sideCapEl.textContent = txt || '';
  }

  function startFinale() {
    if (finaleStarted) return;
    finaleStarted = true;
    const card = personalEl.querySelector('.card');
    const hp = card && card.querySelector('.hp');
    if (hp) {
      hp.style.animation = 'none';        // 先关掉 photoRise（它的 forwards 会压掉内联透明度）
      hp.style.transition = 'opacity 1.2s ease, transform 1.2s ease';
      hp.style.opacity = '0';
      hp.style.transform = 'scale(.94)';
      setTimeout(function () { hp.style.visibility = 'hidden'; }, 1150);
    }
    // 终章挂在 #personal 上，避免被 card 的内容宽度挤成竖排
    if (!personalEl.querySelector('.finale')) {
      const fin2 = document.createElement('div');
      fin2.className = 'finale';
      fin2.innerHTML = '<h2>圣诞快乐，紫怡</h2>' +
        '<p><span class="l1">愿灯常亮</span><i>·</i><span class="l2">愿你常安</span></p>';
      personalEl.appendChild(fin2);
    }
    // 终章期间两侧说明淡出，避免和中央大字打架
    // 关掉 sideIn 动画，否则动画的 forwards 会压掉内联 opacity
    if (sideNameEl) { sideNameEl.style.animation = 'none'; sideNameEl.style.opacity = '0'; }
    if (sideCapEl) { sideCapEl.style.animation = 'none'; sideCapEl.style.opacity = '0'; }
  }

  function clearFinale() {
    finaleStarted = false;
    const fin3 = personalEl.querySelector('.finale');
    if (fin3 && fin3.parentNode) fin3.parentNode.removeChild(fin3);
    if (sideNameEl) { sideNameEl.style.animation = ''; sideNameEl.style.opacity = ''; }
    if (sideCapEl) { sideCapEl.style.animation = ''; sideCapEl.style.opacity = ''; }
  }

  function switchPhoto(idx, instant) {
    const card = personalEl.querySelector('.card');
    if (!card) return;
    if (!heartBuilt) buildHeartFrame();
    const imgs = card.querySelectorAll('img.ph');
    if (!imgs.length) return;
    const it = PHOTOS[idx % PHOTOS.length];
    const next = 1 - photoLayer;
    if (it && it.src) {
      imgs[next].src = it.src;
      imgs[next].classList.add('on');
      imgs[photoLayer].classList.remove('on');
    }
    photoLayer = next;
    card.querySelector('.cap').textContent = (it && it.caption) || '';
    setSideCaption(it && it.caption);
  }

  function stagePaint() {
    const card = personalEl.querySelector('.card');
    let html = '';
    if (stage === STAGE.SYMBOL) {
      html = '';                       // 这一阶段只要图像，不要文字
    } else if (stage === STAGE.TEXT) {
      html = '<div class="bless-center">' +
               '<h2 class="bless">' + BLESSINGS[0].t + '</h2>' +
               '<p class="bless-sub">' + BLESSINGS[0].b + '</p>' +
             '</div>' +
             '<div class="field"></div>';
    }
    if (stage === STAGE.HEART) {
      ensureSideTags(true);
      // 星云容器立即隐藏（停止 37 个无限动画），节点稍后回收
      const fld = card.querySelector('.field');
      if (fld && fld.style.display !== 'none') {
        fld.style.display = 'none';
        const kids = Array.prototype.slice.call(fld.children);
        const drop = function () {
          for (let i = 0; i < kids.length; i++) {
            if (kids[i].parentNode) kids[i].parentNode.removeChild(kids[i]);
          }
        };
        if (window.requestIdleCallback) requestIdleCallback(drop, { timeout: 1500 });
        else setTimeout(drop, 900);
      }
      personalEl.classList.add('on');
      personalEl.classList.add('heart');
      personalEl.classList.remove('text');
      if (!heartBuilt) {
        buildHeartFrame();
        const hp0 = personalEl.querySelector('.hp');
        if (hp0 && state.photoY) hp0.style.transform = 'translateY(' + state.photoY.toFixed(2) + '%)';
        // 爱心阶段不再叠 card-in（与 photoRise 叠加会显得卡一下）
        card.classList.remove('card-in');
      }
      return;
    }
    heartBuilt = false;
    if (finaleStarted) clearFinale();
    ensureSideTags(false);
    card.innerHTML = html;
    card.classList.remove('card-in');
    void card.offsetWidth;
    card.classList.add('card-in');
    personalEl.classList.toggle('heart', false);
    personalEl.classList.toggle('text', stage === STAGE.TEXT || stage === STAGE.SYMBOL);
    personalEl.classList.toggle('on', stage !== STAGE.TREE);
  }

  function setStage(next) {
    stage = next;
    stageT = 0;
    document.body.classList.toggle('textstage', next === STAGE.TEXT);
    const moteHost = document.getElementById('motes');
    if (moteHost) moteHost.style.opacity = (next === STAGE.TEXT) ? '1' : '0.62';
    stagePaint();
    if (stage === STAGE.TEXT) {
      if (fieldTimer) { clearInterval(fieldTimer); fieldTimer = null; }
      fieldIdx = 0;
      const wait = state.disperse >= 0.999 ? 700 : 1600;   // 粒子没散净就多等
      setTimeout(startBlessField, wait);
    } else if (fieldTimer) {
      clearInterval(fieldTimer);
      fieldTimer = null;
    }
  }

  function startDissolve() {
    state.phase = 1;
    // 树散开的同时，点出来的图案也一起消散
    for (const g of state.glyphs) g.fading = true;
    if (state.glyphs.length) { state.glyphs.length = 0; }   // 树炸开的同一刻清掉图案
    setStage(STAGE.SYMBOL);
    flashMsg('树散开了');
  }

  function restoreTree() {
    state.heartWanted = false;
    heartPending = false;
    if (heartTimer) { clearTimeout(heartTimer); heartTimer = null; }
    personalEl.classList.remove('leaving');
    state.phase = 3;
    setStage(STAGE.TREE);
    flashMsg('重新凝聚');
  }
  function nextPersonal() {
    personalIdx = (personalIdx + 1) % PERSONAL.length;
    paintPersonal();
  }

  /* ---------------- 着色器 ---------------- */
  const VS_TREE = `#version 300 es
  precision highp float;
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aScatter;
  layout(location=2) in vec3 aMeta;
  layout(location=3) in vec3 aCol;
  layout(location=4) in vec3 aHeart;
  layout(location=5) in vec3 aEmblem;
  uniform mat4 uVP;
  uniform float uDisperse, uHeart, uEmblem, uTime, uSize, uProj, uAlpha, uMaxPx, uBuild, uReflect;
  out vec3 vCol; out float vA;
  void main() {
    vec3 p = mix(aPos, aScatter, uDisperse);
    p = mix(p, aEmblem, uEmblem);
    p = mix(p, aHeart, uHeart);
    // 倒影：沿树底镜像并压扁
    float reflFade = 1.0;
    if (uReflect > 0.5) {
      float below = p.y - (-1.15);
      p.y = -1.15 - below * 0.19;
      reflFade = 0.22 * exp(-max(0.0, -below) * 0.9);
    }
    // 开场生长：每颗星按高度依次从树底升起并淡入
    float hN = clamp((p.y + 1.15) / 2.45, 0.0, 1.0);
    vec3 hTint = mix(vec3(0.94, 0.86, 0.72), vec3(1.16, 1.06, 0.90), smoothstep(0.02, 0.98, hN));
    float th = hN * 0.72 + fract(aMeta.z * 13.17) * 0.28;
    float grow = clamp((uBuild * 1.30 - th) / 0.30, 0.0, 1.0);
    grow = grow * grow * (3.0 - 2.0 * grow);
    p.y = mix(p.y - 0.75 - th * 0.35, p.y, grow);
    vec4 clip = uVP * vec4(p, 1.0);
    gl_Position = clip;
    float isOrn = step(1500.0, aMeta.y);
    float flow = 0.5 + 0.5 * sin(aMeta.x * 44.0 - uTime * 2.8 + aMeta.y * 0.35 + aMeta.z * 6.283);
    float tw = 0.55 + 0.45 * sin(uTime * 3.2 + aMeta.z * 40.0);
    float b = mix(0.30 + 0.95 * flow * flow, 0.75 + 0.85 * tw, isOrn);
    b *= mix(1.0, 0.55, smoothstep(3.2, 5.6, clip.w));   // 越远越暗，出现纵深
    b *= max(grow, 0.0015);                              // 未就位的星不可见
    b *= mix(1.0, 0.40, smoothstep(0.68, 1.0, hN));       // 顶部压亮，避免过曝成白团
    b *= mix(1.0, 0.72, uDisperse) * (1.0 + 0.02 * uHeart) * (1.0 - 0.58 * uEmblem);
    vCol = aCol * b * 1.35 * hTint * mix(1.0, reflFade, uReflect);
    vA = uAlpha;
    float sz = uSize * (0.85 + 0.55 * isOrn) * (1.0 + 0.5 * uDisperse) * uProj / max(0.001, clip.w);
    gl_PointSize = clamp(sz, 1.6, max(uMaxPx, 2.2));
  }`;

  const VS_SPRITE = `#version 300 es
  precision highp float;
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aCol;
  layout(location=2) in float aSize;
  uniform vec2 uRes;
  out vec3 vCol; out float vA;
  void main() {
    vec2 ndc = vec2(aPos.x / uRes.x * 2.0 - 1.0, 1.0 - aPos.y / uRes.y * 2.0);
    gl_Position = vec4(ndc, 0.0, 1.0);
    gl_PointSize = aSize;
    vCol = aCol; vA = aPos.z;
  }`;

  // uniform 位置缓存（避免逐帧查询）
  const UT = {}, UD = {}, UB = {}, UC = {}, US = {}, UG = {};
  function cacheUniforms() {
    for (const n of ['uVP', 'uDisperse', 'uHeart', 'uEmblem', 'uTime', 'uSize', 'uProj', 'uAlpha', 'uMaxPx', 'uBuild', 'uReflect']) {
      UT[n] = gl.getUniformLocation(progTree, n);
    }
    for (const n of ['uRes', 'uSky', 'uGlow', 'uStar', 'uTime']) {
      UG[n] = gl.getUniformLocation(progBG, n);
    }
    for (const n of ['uTex', 'uTexel', 'uThresh']) {
      UD[n] = gl.getUniformLocation(progDown, n);
    }
    for (const n of ['uTex', 'uDir']) {
      UB[n] = gl.getUniformLocation(progBlur, n);
    }
    for (const n of ['uScene', 'uBloom', 'uBloom2', 'uBloomAmt', 'uBloom2Amt']) {
      UC[n] = gl.getUniformLocation(progComp, n);
    }
    US.uRes = gl.getUniformLocation(progSprite, 'uRes');
  }

  const FS_POINT = `#version 300 es
  precision highp float;
  in vec3 vCol; in float vA;
  out vec4 frag;
  void main() {
    vec2 d = gl_PointCoord - 0.5;
    float r2 = dot(d, d) * 4.0;
    float a = exp(-r2 * 3.4);
    if (a < 0.004) discard;
    frag = vec4(vCol * a * vA, 1.0);
  }`;

  const FS_BG = `#version 300 es
  precision highp float;
  uniform vec2 uRes;
  uniform vec3 uSky, uGlow, uStar;
  uniform float uTime;
  out vec4 frag;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

  // 平滑值噪声 + 三倍频，用于极光带
  float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i), b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }
  float fbm(vec2 p) {
    float v = 0.0, amp = 0.6;
    for (int k = 0; k < 3; k++) { v += amp * vnoise(p); p *= 2.05; amp *= 0.5; }
    return v;
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    float aspect = uRes.x / uRes.y;

    // 基础天空：下亮上暗
    vec3 col = mix(uSky * 1.25, uSky * 0.55, uv.y);

    // 极光带：两条缓慢流动的横向光带（低强度，只做氛围）
    float a1 = fbm(vec2(uv.x * 2.6 + uTime * 0.012, uv.y * 1.5 - uTime * 0.008));
    float band1 = smoothstep(0.62, 0.86, a1) * smoothstep(0.42, 0.70, uv.y) * smoothstep(1.02, 0.66, uv.y);
    float a2 = fbm(vec2(uv.x * 1.7 - uTime * 0.009, uv.y * 2.2 + uTime * 0.011 + 7.3));
    float band2 = smoothstep(0.66, 0.90, a2) * smoothstep(0.30, 0.58, uv.y) * smoothstep(0.92, 0.56, uv.y);
    col += uGlow * (band1 * 0.34 + band2 * 0.26) * 0.26;

    // 树后主光
    vec2 c = (uv - vec2(0.5, 0.52)) * vec2(aspect, 1.0);
    col += uGlow * 0.26 * exp(-dot(c, c) * 3.2);
    // 地面反光
    vec2 f = (uv - vec2(0.5, 0.06)) * vec2(aspect * 1.4, 3.0);
    col += uGlow * 0.07 * exp(-dot(f, f) * 2.2);
    // 树底光池
    vec2 g = (uv - vec2(0.5, 0.02)) * vec2(aspect * 2.6, 7.5);
    col += uGlow * 0.13 * exp(-dot(g, g) * 1.6);

    // ---- 近层星尘（细密，3px 网格）----
    vec2 gp = floor(gl_FragCoord.xy / 3.0);
    float h = hash(gp);
    if (h > 0.9985) {
      float tw = 0.55 + 0.45 * sin(uTime * 2.0 + h * 90.0);
      vec2 lp = fract(gl_FragCoord.xy / 3.0) - 0.5;
      float core = exp(-dot(lp, lp) * 5.0);
      col += uStar * (0.35 + 0.5 * tw) * core * smoothstep(0.05, 0.55, uv.y);
    }

    // ---- 远层亮星（稀疏、更大、缓慢视差）----
    vec2 far = gl_FragCoord.xy + vec2(uTime * 1.6, uTime * 0.9);
    vec2 gp2 = floor(far / 7.0);
    float h2 = hash(gp2 + 31.7);
    if (h2 > 0.99865) {
      float tw2 = 0.6 + 0.4 * sin(uTime * 1.3 + h2 * 210.0);
      vec2 lp2 = fract(far / 7.0) - 0.5;
      float core2 = exp(-dot(lp2, lp2) * 4.0);
      col += uStar * (0.5 + 0.7 * tw2) * core2 * smoothstep(0.0, 0.5, uv.y) * 1.15;
    }

    // ---- 地平线剪影：起伏的暗色山影，给画面景深 ----
    float ridge = 0.105
                + 0.030 * sin(uv.x * 5.3 + 1.2)
                + 0.018 * sin(uv.x * 11.7 - 0.6)
                + 0.010 * sin(uv.x * 23.1 + 2.4);
    float sil = smoothstep(ridge + 0.004, ridge - 0.02, uv.y);
    col *= mix(1.0, 0.28, sil);
    // 山脊上沿的极淡高光，勾出轮廓
    float rim = smoothstep(ridge + 0.012, ridge + 0.001, uv.y) * smoothstep(ridge - 0.001, ridge + 0.006, uv.y);
    col += uGlow * rim * 0.10;

    // ---- 偶发流星：约每 22 秒一颗，斜向划过 ----
    float mt = floor(uTime / 22.0);
    float mseed = hash(vec2(mt, 7.77));
    float mlocal = uTime - mt * 22.0 - 3.0 - mseed * 6.0;   // 3~9 秒之间出现
    if (mseed > 0.45 && mlocal > 0.0 && mlocal < 1.5) {
      float prog = mlocal / 1.5;
      vec2 start = vec2(0.12 + mseed * 0.7, 0.86 - mseed * 0.18);
      vec2 dir = normalize(vec2(0.85, -0.52));
      vec2 head = start + dir * prog * 0.55;
      vec2 rel = (uv - head) * vec2(aspect, 1.0);
      float perp = abs(rel.x * (-dir.y) + rel.y * dir.x);
      float along = rel.x * dir.x + rel.y * dir.y;
      float tail = smoothstep(0.0, -0.16, along) * smoothstep(-0.22, -0.02, along);
      float glow = exp(-perp * perp * 520.0) * tail;
      col += uStar * glow * (0.55 * (1.0 - prog) + 0.12);
    }

    frag = vec4(col, 1.0);
  }`;

  const FS_DOWN = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 frag;
  uniform sampler2D uTex; uniform vec2 uTexel; uniform float uThresh;
  void main() {
    vec3 c = vec3(0.0);
    c += texture(uTex, vUv + uTexel * vec2(-1.0, -1.0)).rgb;
    c += texture(uTex, vUv + uTexel * vec2( 1.0, -1.0)).rgb;
    c += texture(uTex, vUv + uTexel * vec2(-1.0,  1.0)).rgb;
    c += texture(uTex, vUv + uTexel * vec2( 1.0,  1.0)).rgb;
    c *= 0.25;
    float l = max(c.r, max(c.g, c.b));
    c *= smoothstep(uThresh, uThresh + 0.35, l) * 1.6;
    frag = vec4(c, 1.0);
  }`;

  const FS_BLUR = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 frag;
  uniform sampler2D uTex; uniform vec2 uDir;
  void main() {
    vec3 s = texture(uTex, vUv).rgb * 0.2270;
    s += texture(uTex, vUv + uDir * 1.3846).rgb * 0.3162;
    s += texture(uTex, vUv - uDir * 1.3846).rgb * 0.3162;
    s += texture(uTex, vUv + uDir * 3.2307).rgb * 0.0702;
    s += texture(uTex, vUv - uDir * 3.2307).rgb * 0.0702;
    frag = vec4(s, 1.0);
  }`;

  const FS_COMP = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 frag;
  uniform sampler2D uScene; uniform sampler2D uBloom; uniform sampler2D uBloom2;
  uniform float uTime; uniform float uBloomAmt; uniform float uBloom2Amt;
  void main() {
    vec3 s = texture(uScene, vUv).rgb;
    vec3 b = texture(uBloom, vUv).rgb;
    vec3 b2 = texture(uBloom2, vUv).rgb;
    vec3 c = s + b * uBloomAmt + b2 * uBloom2Amt;
    c = vec3(1.0) - exp(-c * 1.25);
    c = pow(c, vec3(0.92));
    float vig = smoothstep(0.42, 1.05, length((vUv - 0.5) * vec2(1.15, 1.0)));
    c *= mix(1.0, 0.84, vig);                 // 极轻暗角，边缘压暗 16%
    vec2 dq = vUv * vec2(1920.0, 1080.0) + vec2(uTime * 17.0, uTime * 23.0);
    float dh = fract(sin(dot(dq, vec2(12.9898, 78.233))) * 43758.5453);
    c += (dh - 0.5) / 255.0;                  // 抖动：打散 8bit 色阶，暗部更细腻
    frag = vec4(c, 1.0);
  }`;

  function compile(vsSrc, fsSrc) {
    function sh(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
      }
      return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  let progTree, progSprite, progBG, progDown, progBlur, progComp;
  try {
    progTree = compile(VS_TREE, FS_POINT);
    progSprite = compile(VS_SPRITE, FS_POINT);
    progBG = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_BG);
    progDown = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_DOWN);
    progBlur = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_BLUR);
    progComp = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_COMP);
  } catch (err) {
    console.error('shader init failed', err);
    var fb = document.getElementById('nogl');
    if (fb) { fb.style.display = 'flex'; }
    return;
  }

  // 小屏 / 高 DPR 时压低点精灵上限，减少填充率
  const maxPointPx = (window.innerWidth < 760 || (window.devicePixelRatio || 1) > 1.5) ? 14.0 : 20.0;
  cacheUniforms();
  // 两个共用 FS_POINT 的程序都要设一次，否则未初始化的 uniform 会让 clamp 变成未定义行为
  gl.useProgram(progTree); gl.uniform1f(UT.uMaxPx, maxPointPx);
  gl.useProgram(progSprite); gl.uniform1f(US.uMaxPx, maxPointPx);

  /* ---------------- 全屏四边形 ---------------- */
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const quadVAO = gl.createVertexArray();
  const treeVAO = gl.createVertexArray();
  gl.bindVertexArray(quadVAO);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  /* ---------------- FBO ---------------- */
  const FLOAT_RT = !!gl.getExtension('EXT_color_buffer_float');
  const RT_FMT = FLOAT_RT ? gl.RGBA16F : gl.RGBA8;
  const RT_TYPE = FLOAT_RT ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

  function makeFBO(w, h, filter) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, RT_FMT, w, h, 0, gl.RGBA, RT_TYPE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fb, tex, w, h };
  }
  let rtScene = null, rtA = null, rtB = null, rtC = null, rtD = null;
  let W = 1, H = 1;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const scaleQ = (cvs.dataset && cvs.dataset.lowQ === '1') ? 0.72 : 0.9;
    const nw = Math.max(2, Math.floor(window.innerWidth * dpr * scaleQ));
    const nh = Math.max(2, Math.floor(window.innerHeight * dpr * scaleQ));
    if (nw === W && nh === H && rtScene && rtScene.w === W) return;   // 尺寸没变就不重建
    W = nw; H = nh;
    cvs.width = W; cvs.height = H;
    cvs.style.width = window.innerWidth + 'px';
    cvs.style.height = window.innerHeight + 'px';
    if (rtScene) { gl.deleteTexture(rtScene.tex); gl.deleteFramebuffer(rtScene.fb); }
    if (rtA) { gl.deleteTexture(rtA.tex); gl.deleteFramebuffer(rtA.fb); }
    if (rtB) { gl.deleteTexture(rtB.tex); gl.deleteFramebuffer(rtB.fb); }
    rtScene = makeFBO(W, H, gl.LINEAR);
    rtA = makeFBO(Math.max(2, W >> 2), Math.max(2, H >> 2), gl.LINEAR);
    rtB = makeFBO(Math.max(2, W >> 2), Math.max(2, H >> 2), gl.LINEAR);
    if (rtC) { gl.deleteTexture(rtC.tex); gl.deleteFramebuffer(rtC.fb); }
    if (rtD) { gl.deleteTexture(rtD.tex); gl.deleteFramebuffer(rtD.fb); }
    rtC = makeFBO(Math.max(2, W >> 3), Math.max(2, H >> 3), gl.LINEAR);
    rtD = makeFBO(Math.max(2, W >> 3), Math.max(2, H >> 3), gl.LINEAR);
  }
  window.addEventListener('resize', resize);

  // 上下文丢失兜底：暂停渲染并提示手动刷新（不做自动 reload —— 某些显卡会反复
  // 触发 lost/restored，自动重载会表现为整页不停闪烁）
  function showGLLost() {
    window.__glLost = true;
    const fb = document.getElementById('nogl');
    if (fb && fb.style.display !== 'flex') {
      fb.style.display = 'flex';
      fb.innerHTML = '<div style="text-align:center"><h2>画面已暂停</h2>' +
                     '<p>显卡上下文被重置，点击任意处刷新即可恢复</p></div>';
      fb.addEventListener('click', function () { location.reload(); }, { once: true });
    }
  }
  cvs.addEventListener('webglcontextlost', function (e) { e.preventDefault(); showGLLost(); }, false);
  cvs.addEventListener('webglcontextrestored', function () {
    // 保持暂停：旧 program / VAO / 纹理已失效，等用户手动刷新，避免闪烁
  }, false);

  // DPR 变化（跨屏拖动、浏览器缩放）时重建渲染目标
  let lastDpr = Math.min(window.devicePixelRatio || 1, 2);
  const bgTmp = new Float32Array(3);
  let lastZoomCss = '';
  resize();

  /* ---------------- 状态 ---------------- */
  const state = {
    yaw: 0.4, pitch: -0.06, zoom: 1,
    t: 0, disperse: 0, phase: 0, timer: 90, heart: 0, emblem: 0, heartWanted: false, build: 0, photoY: 0,
    alpha: 0, snow: true, text: true,
    glyphs: [], sparks: [], snowPts: []
  };

  // 雪花
  for (let i = 0; i < 220; i++) {
    state.snowPts.push({
      x: Math.random() * 2000, y: Math.random() * 1200,
      vy: 18 + Math.random() * 40, vx: -8 + Math.random() * 16,
      s: 1.4 + Math.random() * 2.6, ph: Math.random() * 6.28
    });
  }

  /* ---------------- 交互 ---------------- */
  let dragging = false, moved = 0, lastX = 0, lastY = 0, idle = 0, spinVel = 0;

  cvs.addEventListener('pointerdown', (e) => {
    dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
    spawnRipple(e.clientX, e.clientY);
    cvs.setPointerCapture(e.pointerId);
  });
  // 双指捏合缩放（移动端）
  const touches = new Map();
  let pinchStart = 0, pinchZoom = 1;
  cvs.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'touch') return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) {
      const it = Array.from(touches.values());
      pinchStart = Math.hypot(it[0].x - it[1].x, it[0].y - it[1].y);
      pinchZoom = state.zoom;
      dragging = false;
    }
  });
  cvs.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'touch' || !touches.has(e.pointerId)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2 && pinchStart > 0) {
      const it = Array.from(touches.values());
      const d = Math.hypot(it[0].x - it[1].x, it[0].y - it[1].y);
      state.zoom = Math.max(0.6, Math.min(1.9, pinchZoom * (d / pinchStart)));
    }
  });
  ['pointerup', 'pointercancel'].forEach(function (evt) {
    cvs.addEventListener(evt, function (e) { touches.delete(e.pointerId); if (touches.size < 2) pinchStart = 0; });
  });

  cvs.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse' && !dragging) spawnDust(e.clientX, e.clientY);
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    state.yaw += dx * 0.006;
    spinVel = dx * 0.006;
    state.pitch = Math.max(-0.9, Math.min(0.55, state.pitch + dy * 0.004));
    idle = 0;
  });
  let tapTimer = null, lastTapT = 0, lastTapX = 0, lastTapY = 0;
  function fireSingle(x, y) {
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapTimer = null; onClick(x, y); }, 300);
  }

  // 桌面：用浏览器原生 dblclick（按系统双击速度判定，比手写时间窗可靠）
  cvs.addEventListener('dblclick', (e) => {
    e.preventDefault();
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
    toggleDisperse(e.clientX, e.clientY);
  });

  cvs.addEventListener('pointerup', (e) => {
    dragging = false;
    if (moved >= 10) return;
    if (e.pointerType === 'touch') {          // 触摸端：手写双击判定
      const now = performance.now();
      const isDouble = (now - lastTapT) < 340 &&
                       Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 40;
      lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
      if (isDouble) {
        if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
        toggleDisperse(e.clientX, e.clientY);
        return;
      }
    }
    fireSingle(e.clientX, e.clientY);
  });
  ['pointercancel', 'lostpointercapture'].forEach(function (evt) {
    cvs.addEventListener(evt, function () { dragging = false; moved = 0; });
  });

  cvs.addEventListener('wheel', (e) => {
    e.preventDefault();
    // 爱心阶段：滚轮上下微调照片位置（不再缩放，避免照片跑出爱心）
    if (stage === STAGE.HEART) {
      e.preventDefault();
      state.photoY = Math.max(-10, Math.min(10, (state.photoY || 0) - e.deltaY * 0.01));
      const hp = personalEl.querySelector('.hp');
      if (hp) hp.style.transform = 'translateY(' + state.photoY.toFixed(2) + '%)';
      return;
    }
    state.zoom = Math.max(0.6, Math.min(1.9, state.zoom * (e.deltaY > 0 ? 0.94 : 1.06)));
  }, { passive: false });

  function toggleDisperse(x, y) {
    if (stage === STAGE.TREE) {
      startDissolve();
      if (x !== undefined) { spawnSpark(x, y); spawnSpark(x, y); }
    } else {
      restoreTree();
    }
  }

  function onClick(x, y) {
    if (stage === STAGE.TEXT) {         // 文案 -> 爱心：文字汇入轮廓，中间大字变成照片
      if (!heartPending) beginHeartTransition();
      for (let i = 0; i < 2; i++) spawnSpark(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 30);
      return;
    }
    if (stage === STAGE.HEART) {        // 爱心中单击：换一张照片，并重置自动计时
      if (finaleStarted) { clearFinale(); restoreTree(); return; }
      photoIdx = (photoIdx + 1) % PHOTOS.length;
      if (PHOTOS.length > 1 && photoIdx === 0) { startFinale(); return; }
      switchPhoto(photoIdx);
      stageT = 0;                       // 点击后重新数 6 秒
      return;
    }
    if (stage === STAGE.SYMBOL) return;
    // 洗牌袋：一轮内不重复，避免连续抽到同一种图案
    if (!glyphBag.length) {
      glyphBag = GLYPH_ORDER.slice();
      for (let i = glyphBag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = glyphBag[i]; glyphBag[i] = glyphBag[j]; glyphBag[j] = t;
      }
    }
    const kind = glyphBag.pop();
    spawnGlyph(kind, x, y);
    spawnSpark(x, y);
  }

  function spawnSpark(x, y) {
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 120;
      state.sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, s: 2 + Math.random() * 3 });
    }
  }

  function spawnGlyph(kind, x, y) {
    const base = SHAPES[kind]();
    const scale = Math.min(window.innerWidth, window.innerHeight) * 0.17;
    const n = base.length;
    const target = new Float32Array(n * 3);
    const start = new Float32Array(n * 3);
    const col = new Float32Array(n * 3);
    const th = THEMES[themeIdx];
    const c = th.orn[0];
    const c2 = th.star;
    for (let i = 0; i < n; i++) {
      target[i * 3] = x + base[i][0] * scale;
      target[i * 3 + 1] = y + base[i][1] * scale;
      target[i * 3 + 2] = 1;
      const a = Math.random() * Math.PI * 2, rr = 120 + Math.random() * 420;
      start[i * 3] = x + Math.cos(a) * rr;
      start[i * 3 + 1] = y + Math.sin(a) * rr;
      start[i * 3 + 2] = 0;
      const mixv = (i / n);
      col[i * 3] = c[0] * (1 - mixv) + c2[0] * mixv;
      col[i * 3 + 1] = c[1] * (1 - mixv) + c2[1] * mixv;
      col[i * 3 + 2] = c[2] * (1 - mixv) + c2[2] * mixv;
    }
    state.glyphs.push({ kind, t: 0, dur: 5.6, n, target, start, col, cx: x, cy: y, scale });
    if (state.glyphs.length > 8) state.glyphs.shift();
  }

  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;      // 不抢浏览器快捷键
    const k = e.key.toLowerCase();
    if (k === 'c') { themeIdx = (themeIdx + 1) % THEMES.length; rebuildGeometry(); flashName(THEMES[themeIdx].name); }
    else if (k >= '1' && k <= '4') { formIdx = parseInt(k) - 1; rebuildGeometry(); flashName(FORM_NAMES[formIdx]); }
    else if (k === 'r') { toggleRecord(); }
    else if (k === 'g') { toggleDisperse(); }
    else if (k === 's') { state.snow = !state.snow; }
    else if (k === 't') {
      state.text = !state.text;
      document.getElementById('ui').style.opacity = state.text ? '1' : '0';
    } else if (k === 'f') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });

  // ---- 页内录制：按 R 开始/结束，录的是整个标签页（含 DOM 文案）----
  let rec = null, recChunks = [];
  async function toggleRecord() {
    if (rec && rec.state === 'recording') { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 30 }, audio: false, preferCurrentTab: true
      });
      recChunks = [];
      rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
      rec.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
      rec.onstop = function () {
        stream.getTracks().forEach(function (t) { t.stop(); });
        const blob = new Blob(recChunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '圣诞树.webm';
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
        flashName('已保存 webm');
      };
      rec.start();
      flashName('录制中 · 再按 R 结束');
      setTimeout(function () { if (rec && rec.state === 'recording') rec.stop(); }, 30000);
    } catch (err) {
      flashName('已取消录制');
    }
  }

  const FORM_NAMES = ['光瀑', '双螺旋', '光环', '飘带'];
  let nameTimer = 0;
  function flashMsg(_txt) { /* 顶部提示已按要求移除 */ }
  let dustAt = 0;
  function spawnDust(x, y) {
    const now = performance.now();
    if (now - dustAt < 45) return;          // 节流
    dustAt = now;
    const el = document.createElement('u');
    el.style.left = (x + (Math.random() - 0.5) * 10) + 'px';
    el.style.top = (y + (Math.random() - 0.5) * 10) + 'px';
    el.style.setProperty('--ds', (0.6 + Math.random() * 0.7).toFixed(2) + 's');
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1400);
  }

  function spawnRipple(x, y) {

    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1100);
  }

  function flashName(txt) {

  }

  /* ---------------- 尺寸与投影 ---------------- */
  const proj = new Float32Array(16), view = new Float32Array(16), vp = new Float32Array(16);

  function updateCamera() {
    const aspect = W / H;
    const dist = CAM_DIST / state.zoom;
    const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    const eye = [
      Math.sin(state.yaw) * dist * cp,
      0.12 + sp * dist,
      Math.cos(state.yaw) * dist * cp

      sky: [0.014, 0.030, 0.038], glow: [0.12, 0.38, 0.42], star: [0.90, 1.0, 0.98] },
    { name: '樱雪', flows: [[1.00, 0.78, 0.86], [1.00, 0.92, 0.96], [0.86, 0.68, 0.92]],
      orn: [[1.00, 0.72, 0.82], [1.00, 0.95, 0.98], [0.85, 0.95, 1.00], [1.00, 0.85, 0.60]],
      sky: [0.032, 0.020, 0.034], glow: [0.42, 0.22, 0.38], star: [1.0, 0.94, 0.97] }
  ];
  let themeIdx = 1;   // 默认香槟金

  /* ---------------- 常量 ---------------- */
  const H0 = -1.15, H1 = 1.30;            // 树高
  const TIERS = 6;
  const CAM_DIST = 4.35;

  /* ---------------- 小工具 ---------------- */
  const rnd = (function () {
    let s = 1234567;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  })();

  function mat4Perspective(out, fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
    out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
    out[8] = 0; out[9] = 0; out[10] = (far + near) * nf; out[11] = -1;
    out[12] = 0; out[13] = 0; out[14] = 2 * far * near * nf; out[15] = 0;
    return out;
  }
  function mat4LookAt(out, eye, center, up) {
    let z0 = eye[0] - center[0], z1 = eye[1] - center[1], z2 = eye[2] - center[2];
    let l = 1 / Math.hypot(z0, z1, z2); z0 *= l; z1 *= l; z2 *= l;
    let x0 = up[1] * z2 - up[2] * z1, x1 = up[2] * z0 - up[0] * z2, x2 = up[0] * z1 - up[1] * z0;
    l = Math.hypot(x0, x1, x2); l = l ? 1 / l : 0; x0 *= l; x1 *= l; x2 *= l;
    const y0 = z1 * x2 - z2 * x1, y1 = z2 * x0 - z0 * x2, y2 = z0 * x1 - z1 * x0;
    out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
    out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
    out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
    out[12] = -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]);
    out[13] = -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]);
    out[14] = -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]);
    out[15] = 1;
    return out;
  }
  function mat4Mul(out, a, b) {
    for (let i = 0; i < 4; i++) {
      const ai0 = a[i], ai1 = a[i + 4], ai2 = a[i + 8], ai3 = a[i + 12];
      out[i] = ai0 * b[0] + ai1 * b[1] + ai2 * b[2] + ai3 * b[3];
      out[i + 4] = ai0 * b[4] + ai1 * b[5] + ai2 * b[6] + ai3 * b[7];
      out[i + 8] = ai0 * b[8] + ai1 * b[9] + ai2 * b[10] + ai3 * b[11];
      out[i + 12] = ai0 * b[12] + ai1 * b[13] + ai2 * b[14] + ai3 * b[15];
    }
    return out;
  }

  /* ---------------- 几何：四种形态 ---------------- */
  function buildCascade() {
    const nFil = 62, nSeg = 190;
    const pos = [], meta = [], col = [];
    const th = THEMES[themeIdx];
    for (let i = 0; i < nFil; i++) {
      const ph = rnd() * Math.PI * 2;
      const rBase = 0.26 + 0.80 * Math.pow(rnd(), 0.75);
      const aBase = rnd() * Math.PI * 2;
      const c = th.flows[i % th.flows.length];
      for (let k = 0; k < nSeg; k++) {
        const u = k / (nSeg - 1);
        const tf = (u * TIERS) % 1;
        const tierMul = 0.64 + 0.48 * tf;
        let r = (0.022 + rBase * Math.pow(u, 1.45)) * tierMul *
                (1 + 0.10 * Math.sin(3.4 * u * Math.PI + ph));
        r *= 1 - 0.16 * Math.pow(u, 3) * Math.cos(ph);
        if (i % 9 === 0) r *= 1 + 0.20 * u * u;
        const ang = aBase + 0.85 * u * (1 - 0.5 * u) + 0.30 * Math.sin(u * 2.6 + ph);
        const y = H1 - (H1 - H0) * u;
        pos.push(r * Math.cos(ang), y + 0.02 * Math.sin(u * 7 + ph), r * Math.sin(ang));
        meta.push(u, i, rnd());
        col.push(c[0], c[1], c[2]);
      }
    }
    // 每层底缘的光弧
    for (let t = 0; t < TIERS; t++) {
      const u = (t + 1) / TIERS;
      const rr = (0.022 + 0.86 * Math.pow(u, 1.45)) * 1.08;
      const y = H1 - (H1 - H0) * u;
      const m = 150;
      const c = th.orn[t % th.orn.length];
      for (let k = 0; k < m; k++) {
        const a = (k / m) * Math.PI * 2 + t * 0.55;
        pos.push(rr * Math.cos(a), y + 0.012 * Math.sin(a * 3), rr * Math.sin(a));
        meta.push(u, 1000 + t, 0.5);
        col.push(c[0] * 0.55, c[1] * 0.55, c[2] * 0.55);
      }
    }
    // 装饰光珠
    for (let i = 0; i < 200; i++) {
      const u = Math.pow(rnd(), 0.8);
      const tf = (u * TIERS) % 1;
      const tierMul = 0.64 + 0.48 * tf;
      const r = (0.022 + (0.35 + 0.6 * rnd()) * Math.pow(u, 1.45)) * tierMul;
      const a = rnd() * Math.PI * 2;
      const y = H1 - (H1 - H0) * u;
      pos.push(r * Math.cos(a), y + 0.01, r * Math.sin(a));
      const c = th.orn[i % th.orn.length];
      meta.push(u, 2000 + i, 1.0);
      col.push(c[0], c[1], c[2]);
    }
    return { pos: new Float32Array(pos), meta: new Float32Array(meta), col: new Float32Array(col), count: pos.length / 3 };
  }

  function buildHelix() {
    const nFil = 34, nSeg = 240;
    const pos = [], meta = [], col = [];
    const th = THEMES[themeIdx];
    for (let i = 0; i < nFil; i++) {
      const off = (i / nFil) * Math.PI * 2;
      const c = th.flows[i % th.flows.length];
      for (let k = 0; k < nSeg; k++) {
        const u = k / (nSeg - 1);
        const r = (0.10 + 0.80 * Math.pow(u, 1.15)) * (1 + 0.05 * Math.sin(u * 20 + off));
        const a = off + u * Math.PI * 6;
        const y = H1 - (H1 - H0) * u;
        pos.push(r * Math.cos(a), y, r * Math.sin(a));
        meta.push(u, i, rnd());
        col.push(c[0], c[1], c[2]);
      }
    }
    return { pos: new Float32Array(pos), meta: new Float32Array(meta), col: new Float32Array(col), count: pos.length / 3 };
  }

  function buildArcs() {
    const nRing = 30, nArc = 260;
    const pos = [], meta = [], col = [];
    const th = THEMES[themeIdx];
    for (let i = 0; i < nRing; i++) {
      const u = (i + 1) / nRing;
      const r = (0.06 + 0.92 * Math.pow(u, 1.30));
      const y = H1 - (H1 - H0) * u;
      const c = th.flows[i % th.flows.length];
      const sway = 0.06 * Math.sin(i * 1.7);
      for (let k = 0; k < nArc; k++) {
        const a = (k / nArc) * Math.PI * 2;
        pos.push(r * Math.cos(a), y + sway * Math.sin(a * 2), r * Math.sin(a));
        meta.push(u, i, rnd());
        col.push(c[0], c[1], c[2]);
      }
    }
    return { pos: new Float32Array(pos), meta: new Float32Array(meta), col: new Float32Array(col), count: pos.length / 3 };
  }

  function buildRibbons() {
    const nRib = 40, nSeg = 170;
    const pos = [], meta = [], col = [];
    const th = THEMES[themeIdx];
    for (let i = 0; i < nRib; i++) {
      const a0 = (i / nRib) * Math.PI * 2;
      const w = 0.04 + 0.10 * rnd();
      const c = th.flows[i % th.flows.length];
      for (let k = 0; k < nSeg; k++) {
        const u = k / (nSeg - 1);
        const r = (0.05 + 0.88 * Math.pow(u, 1.20));
        const a = a0 + Math.sin(u * 5 + i) * w;
        const y = H1 - (H1 - H0) * u + 0.03 * Math.sin(u * 9 + i);
        pos.push(r * Math.cos(a), y, r * Math.sin(a));
        meta.push(u, i, rnd());
        col.push(c[0], c[1], c[2]);
      }
    }
    return { pos: new Float32Array(pos), meta: new Float32Array(meta), col: new Float32Array(col), count: pos.length / 3 };
  }

  function shapeSnowEmblem() {
    const o = [];
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      seg(0, 0, Math.cos(a) * 0.90, Math.sin(a) * 0.90, 44, o);
      const bx = Math.cos(a) * 0.52, by = Math.sin(a) * 0.52;
      seg(bx, by, bx + Math.cos(a + 0.9) * 0.28, by + Math.sin(a + 0.9) * 0.28, 18, o);
      seg(bx, by, bx + Math.cos(a - 0.9) * 0.28, by + Math.sin(a - 0.9) * 0.28, 18, o);
    }
    return o;
  }

  function shapeHeartEmblem() {
    const o = [];
    for (let i = 0; i < 300; i++) {
      const t = (i / 300) * Math.PI * 2;
      const X = 16 * Math.pow(Math.sin(t), 3);
      const Y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      o.push([X * 0.058, Y * 0.058]);
    }
    return o;
  }

  const FORMS = [buildCascade, buildHelix, buildArcs, buildRibbons];
  let formIdx = 0;
  let geo = null;

  function rebuildGeometry() {
    const oldGeo = geo;
    geo = FORMS[formIdx]();
    if (oldGeo) {
      for (const k of ['vbo', 'sbo', 'mbo', 'cbo', 'hbo', 'ebo']) {
        if (oldGeo[k]) { gl.deleteBuffer(oldGeo[k]); oldGeo[k] = null; }
      }
    }
    // 散开态：球壳随机
    const n = geo.count, sc = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2, b = Math.acos(2 * rnd() - 1);
      const rr = 1.1 + 1.5 * Math.pow(rnd(), 0.6);
      sc[i * 3] = Math.sin(b) * Math.cos(a) * rr;
      sc[i * 3 + 1] = Math.cos(b) * rr * 0.8 + 0.05;
      sc[i * 3 + 2] = Math.sin(b) * Math.sin(a) * rr;
    }
    geo.scatter = sc;

    // 爱心目标：2D 心形曲线 + 厚度，让粒子有体积感
    // 爱心：空心描边（粒子几乎都落在轮廓上），并整体上下翻转
    const hx = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const th = rnd() * Math.PI * 2;
      const edge = 0.880 + rnd() * 0.120;          // 轮廓带加宽，避免糊成实线
      const X = 16 * Math.pow(Math.sin(th), 3);
      const Y = 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th);
      const wob = 0.05 * (rnd() - 0.5);
      // 额外抖动：分散尖角（心尖/上凹）处的粒子堆积，避免出现亮条
      const jx = (rnd() - 0.5) * 0.045;
      const jy = (rnd() - 0.5) * 0.035;
      hx[i * 3] = X * 0.0865 * edge * 1.13 + wob * 0.02 + jx;
      hx[i * 3 + 1] = Y * 0.0865 * edge * 0.94 + 0.40 + jy;
      hx[i * 3 + 2] = (rnd() - 0.5) * 0.26;          // 厚度更均匀，减少同深度叠加
    }
    geo.heart = hx;

    // 同一批粒子分成三组，分别汇聚成 梨 / 鱼 / 星（世界坐标）
    const EM_POS = [
      [-1.02, 0.16, 0.42],   // 梨
      [0.00, 0.20, 0.40],    // 鱼
      [1.02, 0.18, 0.38]     // 星
    ];
    const shp = [shapeStarEmblem(), shapeSnowEmblem(), shapeHeartEmblem()];
    const em = new Float32Array(n * 3);
    const lens = shp.map(a => a.length);
    for (let i = 0; i < n; i++) {
      const g = i % 3;
      const k = Math.floor(i / 3) % lens[g];
      const pt = shp[g][k];
      const c = EM_POS[g];
      const jx = (rnd() - 0.5) * 0.016;
      const jy = (rnd() - 0.5) * 0.016;
      em[i * 3] = c[0] + pt[0] * 0.52 + jx;
      em[i * 3 + 1] = c[1] + pt[1] * 0.52 + jy;
      em[i * 3 + 2] = c[2] + (rnd() - 0.5) * 0.06;
    }
    geo.emblem = em;
    buildDecor();

    geo.vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.vbo);
    gl.bufferData(gl.ARRAY_BUFFER, geo.pos, gl.STATIC_DRAW);
    geo.sbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.sbo);
    gl.bufferData(gl.ARRAY_BUFFER, geo.scatter, gl.STATIC_DRAW);
    geo.mbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.mbo);
    gl.bufferData(gl.ARRAY_BUFFER, geo.meta, gl.STATIC_DRAW);
    geo.cbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.cbo);
    gl.bufferData(gl.ARRAY_BUFFER, geo.col, gl.STATIC_DRAW);
    geo.hbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.hbo);
    gl.bufferData(gl.ARRAY_BUFFER, geo.heart, gl.STATIC_DRAW);
    geo.ebo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.ebo);
    gl.bufferData(gl.ARRAY_BUFFER, geo.emblem, gl.STATIC_DRAW);
  }

  /* ---------------- 形状（屏幕空间） ---------------- */
  function seg(ax, ay, bx, by, n, out) {
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      out.push([ax + (bx - ax) * t, ay + (by - ay) * t]);
    }
  }
  function poly(pts, n, out, closed) {
    for (let i = 0; i < pts.length - 1; i++) seg(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], n, out);
    if (closed) seg(pts[pts.length - 1][0], pts[pts.length - 1][1], pts[0][0], pts[0][1], n, out);
  }
  function circlePts(cx, cy, r, n, out, a0, a1) {
    a0 = a0 === undefined ? 0 : a0; a1 = a1 === undefined ? Math.PI * 2 : a1;
    for (let i = 0; i < n; i++) {
      const a = a0 + (a1 - a0) * (i / (n - 1));
      out.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
  }

  const SHAPES = {
    star() {
      const o = [];
      const R = 0.85, r = 0.34, pts = [];
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5;
        const rr = i % 2 === 0 ? R : r;
        pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
      }
      poly(pts, 60, o, true);
      seg(0, -1.15, 0, 1.15, 70, o); seg(-1.15, 0, 1.15, 0, 70, o);
      seg(-0.6, -0.6, 0.6, 0.6, 40, o); seg(0.6, -0.6, -0.6, 0.6, 40, o);
      return o;
    },
    gift() {
      const o = [];
      poly([[-0.72, 0.18], [0.72, 0.18], [0.72, 0.72], [-0.72, 0.72]], 70, o, true);
      poly([[-0.80, -0.62], [0.80, -0.62], [0.80, 0.18], [-0.80, 0.18]], 70, o, true);
      seg(0, -0.62, 0, 0.72, 80, o);
      seg(-0.8, 0.02, 0.8, 0.02, 60, o);
      circlePts(-0.24, 0.86, 0.20, 60, o, 0, Math.PI); circlePts(0.24, 0.86, 0.20, 60, o, 0, Math.PI);
      return o;
    },
    snow() {
      const o = [];
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        seg(0, 0, Math.cos(a) * 0.95, Math.sin(a) * 0.95, 55, o);
        const bx = Math.cos(a) * 0.55, by = Math.sin(a) * 0.55;
        seg(bx, by, bx + Math.cos(a + 0.9) * 0.30, by + Math.sin(a + 0.9) * 0.30, 26, o);
        seg(bx, by, bx + Math.cos(a - 0.9) * 0.30, by + Math.sin(a - 0.9) * 0.30, 26, o);
      }
      circlePts(0, 0, 0.16, 40, o);
      return o;
    },
    heart() {
      const o = [];
      for (let i = 0; i < 300; i++) {
        const t = (i / 300) * Math.PI * 2;
        const x = 0.06 * (16 * Math.pow(Math.sin(t), 3));
        const y = -0.06 * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        o.push([x, y * -1]);
      }
      return o;
    },
    bell() {
      const o = [];
      for (let i = 0; i <= 60; i++) {
        const t = i / 60;
        const x = -0.62 + 1.24 * t;
        const y = 0.42 - 0.42 * Math.sin(Math.PI * t) * 1.15;
        o.push([x, -y]);
      }
      seg(-0.62, -0.42, 0.62, -0.42, 60, o);
      circlePts(0, 0.62, 0.10, 40, o);
      circlePts(0, -0.55, 0.11, 40, o);
      return o;
    },
    santa() {
      const o = [];
      poly([[-0.55, 0.20], [-0.10, -0.62], [0.36, 0.20]], 60, o, true);
      circlePts(0, 0.30, 0.26, 60, o);
      circlePts(-0.10, -0.62, 0.10, 40, o);
      for (let i = 0; i < 40; i++) {
        const a = Math.PI * (0.08 + 0.84 * (i / 39));
        o.push([Math.cos(a) * 0.30, 0.58 + Math.sin(a) * 0.30]);
      }
      seg(-0.30, 0.62, 0.30, 0.62, 40, o);
      return o;
    }
  };

  const GLYPH_ORDER = ['star', 'snow', 'gift', 'santa', 'heart', 'bell'];

  /* ---------------- 梨 / 鱼 / 星 —— 对应 L · Y · X ---------------- */
  function shapePear() {
    const o = [];
    for (let i = 0; i < 220; i++) {
      const th = (i / 220) * Math.PI * 2;
      const r = 0.44 + 0.22 * Math.cos(th) - 0.11 * Math.cos(2 * th);
      o.push([Math.sin(th) * r * 0.90, Math.cos(th) * r * 1.02 - 0.08]);
    }
    seg(0.00, 0.52, 0.02, 0.80, 22, o);                       // 果梗
    for (let i = 0; i < 44; i++) {                            // 叶子：向右上方翘起
      const u = i / 43;
      o.push([0.01 + 0.36 * u, 0.78 + 0.16 * Math.sin(Math.PI * u)]);
    }
    for (let i = 0; i < 44; i++) {
      const u = i / 43;
      o.push([0.01 + 0.36 * u, 0.78 + 0.16 * Math.sin(Math.PI * u) - 0.11 * Math.sin(Math.PI * u)]);
    }
    return o;
  }

  function shapeFish() {
    const o = [];
    for (let i = 0; i < 170; i++) {                 // 身体
      const th = (i / 170) * Math.PI * 2;
      o.push([Math.cos(th) * 0.62, Math.sin(th) * 0.34]);
    }
    seg(-0.56, 0.00, -0.96, 0.30, 30, o);           // 尾巴
    seg(-0.96, 0.30, -0.96, -0.30, 30, o);
    seg(-0.96, -0.30, -0.56, 0.00, 30, o);
    for (let i = 0; i < 34; i++) {                  // 背鳍
      const u = i / 33;
      o.push([-0.10 + 0.34 * u, -0.32 - 0.20 * Math.sin(Math.PI * u)]);
    }
    circlePts(0.34, -0.08, 0.055, 26, o);           // 眼睛
    return o;
  }

  function shapeStarEmblem() {
    const o = [], pts = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 === 0 ? 0.86 : 0.34;
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    poly(pts, 60, o, true);
    return o;
  }


  /* ---------------- 个性化层（树散开后显示，单击切换） ----------------
     type: 'text' | 'photo'
     照片：把图片转成 base64（data:image/jpeg;base64,...）填到 src 即可，
           留空则显示一块占位框。 */
  /* ---------------- 双击炸开后的四段式 ----------------
     0 树 · 1 符号（梨/鱼/星）· 2 文案自动轮播 · 3 照片轮播 · 4 粒子爱心
     照片：把 base64 填进 PHOTOS 即可，留空显示占位框。 */
  const PHOTOS = [
    { src: '', caption: '照片位 ①' },
    { src: '', caption: '照片位 ②' },
    { src: '', caption: '照片位 ③' }
  ];

  // 预加载：图片提前解码，切换时不会白一下
  const PHOTO_CACHE = PHOTOS.map(function (it) {
    if (!it || !it.src) return null;

  const BLESSINGS = [

  // 随机撒点：中心留白、避开底部标题，位置/角度/字号/透明度各自抖动
  const SLOTS = (function () {
    const out = [];
    const TARGET = window.innerWidth < 640 ? 10 : 20;   // 与文案池同数，不重复
    let guard = 0;
    while (out.length < TARGET && guard < 4000) {
      guard++;
      const x = 8 + Math.random() * 82;
      const y = 8 + Math.random() * 72;
      if (Math.abs(x - 50) < 15 && Math.abs(y - 46) < 12) continue;   // 中心留给主句
      if (y > 80) continue;                                          // 避开底部固定文案
      let tooClose = false;
      for (const o of out) {
        if (Math.hypot((o.x - x) * 1.55, o.y - y) < 9.0) { tooClose = true; break; }
      }
      if (tooClose) continue;
      out.push({
        x: x, y: y,
        cls: 'f' + (1 + Math.floor(Math.random() * 6)),
        single: Math.random() < 0.34,
        rot: (Math.random() * 14 - 7).toFixed(2),
        sc: (0.78 + Math.random() * 0.5).toFixed(2),
        op: (0.55 + Math.random() * 0.42).toFixed(2),
        dur: (6 + Math.random() * 7).toFixed(1)
      });
    }
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  })();

  // 文案袋子：只打散一轮，保证 20 条互不相同
  const BAG = (function () {
    const all = POOL.slice();
    for (let i = all.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = all[i]; all[i] = all[j]; all[j] = t;
    }
    return all;
  })();

  let fieldTimer = null, fieldIdx = 0;

  function startBlessField() {
    if (fieldTimer) { clearInterval(fieldTimer); fieldTimer = null; }
    fieldIdx = 0;
    fieldTimer = setInterval(function () {
      if (stage !== STAGE.TEXT) { clearInterval(fieldTimer); fieldTimer = null; return; }
      const host = personalEl.querySelector('.field');
      if (!host) { clearInterval(fieldTimer); fieldTimer = null; return; }
      if (fieldIdx >= SLOTS.length) { clearInterval(fieldTimer); fieldTimer = null; return; }
      const slot = SLOTS[fieldIdx];
      const it = BAG[fieldIdx % BAG.length];
      const el = document.createElement('div');
      el.className = 'bl ' + slot.cls;
      el.style.left = slot.x + '%';
      el.style.top = slot.y + '%';
      el.style.setProperty('--rot', slot.rot + 'deg');
      el.style.setProperty('--fs', slot.sc);
      el.style.setProperty('--op', slot.op);
      el.style.animationDuration = slot.dur + 's';
      el.innerHTML = '<b>' + it.t + '</b>' + (slot.single ? '' : '<span>' + it.b + '</span>');
      host.appendChild(el);
      requestAnimationFrame(function () { el.classList.add('in'); });
      fieldIdx++;
    }, 120);
  }

  const STAGE = { TREE: 0, SYMBOL: 1, TEXT: 2, PHOTO: 3, HEART: 4 };

  let stage = STAGE.TREE;
  let stageT = 0;
  let blessIdx = 0;
  let photoIdx = 0;
  const personalEl = document.getElementById('personal');

  let heartBuilt = false;
  let heartPending = false;
  let heartTimer = null;

  function beginHeartTransition() {
    if (heartPending) return;
    heartPending = true;
    photoIdx = 0;
    state.heartWanted = true;
    personalEl.classList.add('toheart');

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight * 0.47;
    const hr = Math.min(window.innerWidth, window.innerHeight) * 0.30;

    const items = personalEl.querySelectorAll('.field .bl');
    for (let i = 0; i < items.length; i++) {
      const el = items[i];
      const r = el.getBoundingClientRect();
      const ex = r.left + r.width / 2, ey = r.top + r.height / 2;
      const dx = cx - ex, dy = cy - ey;
      const dist = Math.hypot(dx, dy) || 1;
      const k = Math.max(0, (dist - hr) / dist);
      const dur = (0.85 + (i % 5) * 0.07).toFixed(2);
      el.style.transition = 'transform ' + dur + 's cubic-bezier(.35,0,.2,1), opacity ' +
                            dur + 's ease, filter ' + dur + 's ease';
      el.style.transform = 'translate(-50%,-50%) translate(' + (dx * k).toFixed(0) + 'px,' +
                           (dy * k).toFixed(0) + 'px) scale(.30) rotate(0deg)';
      el.style.opacity = '0';
      el.style.filter = 'blur(2.5px)';
    }

    const ov = document.createElement('div');
    ov.className = 'heart-overlay';
    const first = PHOTOS[photoIdx % PHOTOS.length];
    ov.innerHTML = '<div class="hp">' +
      (first && first.src ? '<img class="ph on" src="' + first.src + '" alt="">' : '') +
      '</div>';
    personalEl.appendChild(ov);

    heartTimer = setTimeout(function () {
      heartTimer = null;
      if (stage !== STAGE.TEXT) { heartPending = false; return; }
      personalEl.classList.remove('toheart');
      if (ov.parentNode) ov.parentNode.removeChild(ov);
      setStage(STAGE.HEART);
      heartPending = false;
    }, 1020);
  }
  let photoLayer = 0;          // 0 / 1 两张图层轮换

  function buildHeartFrame() {
    const card = personalEl.querySelector('.card');
    const hasPhoto = PHOTOS.some(function (p) { return p && p.src; });
    card.innerHTML =
      (hasPhoto
        ? '<div class="hp"><img class="ph" alt=""><img class="ph" alt=""></div>'
        : '<div class="hp empty"><span class="hpText">圣诞快乐</span></div>') +
      '<p class="cap"></p>';
    heartBuilt = true;
    photoLayer = 0;
    // 先把第一张塞进图层 0
    const imgs = card.querySelectorAll('img.ph');
    const first = PHOTOS[photoIdx % PHOTOS.length];
    if (first && first.src) { imgs[0].src = first.src; imgs[0].classList.add('on'); }
    card.querySelector('.cap').textContent = (first && first.caption) || '';
  }

  function switchPhoto(idx, instant) {
    const card = personalEl.querySelector('.card');
    if (!card) return;
    if (!heartBuilt) buildHeartFrame();
    const imgs = card.querySelectorAll('img.ph');
    if (!imgs.length) return;
    const it = PHOTOS[idx % PHOTOS.length];
    const next = 1 - photoLayer;
    if (it && it.src) {
      imgs[next].src = it.src;
      imgs[next].classList.add('on');
      imgs[photoLayer].classList.remove('on');
    }
    photoLayer = next;
    card.querySelector('.cap').textContent = (it && it.caption) || '';
  }

  function stagePaint() {
    const card = personalEl.querySelector('.card');
    let html = '';
    if (stage === STAGE.SYMBOL) {
      html = '';                       // 这一阶段只要图像，不要文字
    } else if (stage === STAGE.TEXT) {
      html = '<div class="bless-center">' +
               '<h2 class="bless">' + BLESSINGS[0].t + '</h2>' +
               '<p class="bless-sub">' + BLESSINGS[0].b + '</p>' +
             '</div>' +
             '<div class="field"></div>';
    }
    if (stage === STAGE.HEART) {
      personalEl.classList.add('on');
      personalEl.classList.add('heart');
      personalEl.classList.remove('text');
      if (!heartBuilt) {
        buildHeartFrame();
        card.classList.remove('card-in');
        void card.offsetWidth;
        card.classList.add('card-in');
      }
      return;
    }
    heartBuilt = false;
    card.innerHTML = html;
    card.classList.remove('card-in');
    void card.offsetWidth;
    card.classList.add('card-in');
    personalEl.classList.toggle('heart', false);
    personalEl.classList.toggle('text', stage === STAGE.TEXT || stage === STAGE.SYMBOL);
    personalEl.classList.toggle('on', stage !== STAGE.TREE);
  }

  function setStage(next) {
    stage = next;
    stageT = 0;
    stagePaint();
    if (stage === STAGE.TEXT) {
      if (fieldTimer) { clearInterval(fieldTimer); fieldTimer = null; }
      fieldIdx = 0;
      setTimeout(startBlessField, 240);
    } else if (fieldTimer) {
      clearInterval(fieldTimer);
      fieldTimer = null;
    }
  }

  function startDissolve() {
    state.phase = 1;
    setStage(STAGE.SYMBOL);
    flashMsg('树散开了');
  }

  function restoreTree() {
    state.heartWanted = false;
    heartPending = false;
    if (heartTimer) { clearTimeout(heartTimer); heartTimer = null; }
    personalEl.classList.remove('leaving');
    state.phase = 3;
    setStage(STAGE.TREE);
    flashMsg('重新凝聚');
  }
  function nextPersonal() {
    personalIdx = (personalIdx + 1) % PERSONAL.length;
    paintPersonal();
  }

  /* ---------------- 着色器 ---------------- */
  const VS_TREE = `#version 300 es
  precision highp float;
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aScatter;
  layout(location=2) in vec3 aMeta;
  layout(location=3) in vec3 aCol;
  layout(location=4) in vec3 aHeart;
  layout(location=5) in vec3 aEmblem;
  uniform mat4 uVP;
  uniform float uDisperse, uHeart, uEmblem, uTime, uSize, uProj, uAlpha, uMaxPx;
  out vec3 vCol; out float vA;
  void main() {
    vec3 p = mix(aPos, aScatter, uDisperse);
    p = mix(p, aEmblem, uEmblem);
    p = mix(p, aHeart, uHeart);
    vec4 clip = uVP * vec4(p, 1.0);
    gl_Position = clip;
    float isOrn = step(1500.0, aMeta.y);
    float flow = 0.5 + 0.5 * sin(aMeta.x * 44.0 - uTime * 2.8 + aMeta.y * 0.35 + aMeta.z * 6.283);
    float tw = 0.55 + 0.45 * sin(uTime * 3.2 + aMeta.z * 40.0);
    float b = mix(0.30 + 0.95 * flow * flow, 0.75 + 0.85 * tw, isOrn);
    b *= mix(1.0, 0.55, smoothstep(3.2, 5.6, clip.w));   // 越远越暗，出现纵深
    b *= mix(1.0, 0.72, uDisperse) * (1.0 + 0.12 * uHeart) * (1.0 - 0.58 * uEmblem);
    vCol = aCol * b * 1.35;
    vA = uAlpha;
    float sz = uSize * (0.85 + 0.55 * isOrn) * (1.0 + 0.5 * uDisperse) * uProj / max(0.001, clip.w);
    gl_PointSize = clamp(sz, 1.6, max(uMaxPx, 2.2));
  }`;

  const VS_SPRITE = `#version 300 es
  precision highp float;
  layout(location=0) in vec3 aPos;
  layout(location=1) in vec3 aCol;
  layout(location=2) in float aSize;
  uniform vec2 uRes;
  out vec3 vCol; out float vA;
  void main() {
    vec2 ndc = vec2(aPos.x / uRes.x * 2.0 - 1.0, 1.0 - aPos.y / uRes.y * 2.0);
    gl_Position = vec4(ndc, 0.0, 1.0);
    gl_PointSize = aSize;
    vCol = aCol; vA = aPos.z;
  }`;

  // uniform 位置缓存（避免逐帧查询）
  const UT = {}, UD = {}, UB = {}, UC = {}, US = {}, UG = {};
  function cacheUniforms() {
    for (const n of ['uVP', 'uDisperse', 'uHeart', 'uEmblem', 'uTime', 'uSize', 'uProj', 'uAlpha', 'uMaxPx']) {
      UT[n] = gl.getUniformLocation(progTree, n);
    }
    for (const n of ['uRes', 'uSky', 'uGlow', 'uStar', 'uTime']) {
      UG[n] = gl.getUniformLocation(progBG, n);
    }
    for (const n of ['uTex', 'uTexel', 'uThresh']) {
      UD[n] = gl.getUniformLocation(progDown, n);
    }
    for (const n of ['uTex', 'uDir']) {
      UB[n] = gl.getUniformLocation(progBlur, n);
    }
    for (const n of ['uScene', 'uBloom', 'uBloomAmt']) {
      UC[n] = gl.getUniformLocation(progComp, n);
    }
    US.uRes = gl.getUniformLocation(progSprite, 'uRes');
  }

  const FS_POINT = `#version 300 es
  precision highp float;
  in vec3 vCol; in float vA;
  out vec4 frag;
  void main() {
    vec2 d = gl_PointCoord - 0.5;
    float r2 = dot(d, d) * 4.0;
    float a = exp(-r2 * 3.4);
    if (a < 0.004) discard;
    frag = vec4(vCol * a * vA, 1.0);
  }`;

  const FS_BG = `#version 300 es
  precision highp float;
  uniform vec2 uRes;
  uniform vec3 uSky, uGlow, uStar;
  uniform float uTime;
  out vec4 frag;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  void main() {
    vec2 uv = gl_FragCoord.xy / uRes;
    vec3 col = mix(uSky * 1.25, uSky * 0.55, uv.y);
    // 树后主光
    vec2 c = (uv - vec2(0.5, 0.52)) * vec2(uRes.x / uRes.y, 1.0);
    col += uGlow * 0.26 * exp(-dot(c, c) * 3.2);
    // 地面反光
    vec2 f = (uv - vec2(0.5, 0.06)) * vec2(uRes.x / uRes.y * 1.4, 3.0);
    col += uGlow * 0.07 * exp(-dot(f, f) * 2.2);
    // 星尘
    vec2 gp = floor(gl_FragCoord.xy / 3.0);
    float h = hash(gp);
    if (h > 0.9985) {
      float tw = 0.55 + 0.45 * sin(uTime * 2.0 + h * 90.0);
      vec2 lp = fract(gl_FragCoord.xy / 3.0) - 0.5;
      float core = exp(-dot(lp, lp) * 5.0);
      col += uStar * (0.35 + 0.5 * tw) * core * smoothstep(0.05, 0.55, uv.y);
    }
    frag = vec4(col, 1.0);
  }`;

  const FS_DOWN = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 frag;
  uniform sampler2D uTex; uniform vec2 uTexel; uniform float uThresh;
  void main() {
    vec3 c = vec3(0.0);
    c += texture(uTex, vUv + uTexel * vec2(-1.0, -1.0)).rgb;
    c += texture(uTex, vUv + uTexel * vec2( 1.0, -1.0)).rgb;
    c += texture(uTex, vUv + uTexel * vec2(-1.0,  1.0)).rgb;
    c += texture(uTex, vUv + uTexel * vec2( 1.0,  1.0)).rgb;
    c *= 0.25;
    float l = max(c.r, max(c.g, c.b));
    c *= smoothstep(uThresh, uThresh + 0.35, l) * 1.6;
    frag = vec4(c, 1.0);
  }`;

  const FS_BLUR = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 frag;
  uniform sampler2D uTex; uniform vec2 uDir;
  void main() {
    vec3 s = texture(uTex, vUv).rgb * 0.2270;
    s += texture(uTex, vUv + uDir * 1.3846).rgb * 0.3162;
    s += texture(uTex, vUv - uDir * 1.3846).rgb * 0.3162;
    s += texture(uTex, vUv + uDir * 3.2307).rgb * 0.0702;
    s += texture(uTex, vUv - uDir * 3.2307).rgb * 0.0702;
    frag = vec4(s, 1.0);
  }`;

  const FS_COMP = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 frag;
  uniform sampler2D uScene; uniform sampler2D uBloom; uniform float uTime; uniform float uBloomAmt;
  void main() {
    vec3 s = texture(uScene, vUv).rgb;
    vec3 b = texture(uBloom, vUv).rgb;
    vec3 c = s + b * uBloomAmt;
    c = vec3(1.0) - exp(-c * 1.25);
    frag = vec4(pow(c, vec3(0.92)), 1.0);
  }`;

  function compile(vsSrc, fsSrc) {
    function sh(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
      }
      return s;
    }
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  let progTree, progSprite, progBG, progDown, progBlur, progComp;
  try {
    progTree = compile(VS_TREE, FS_POINT);
    progSprite = compile(VS_SPRITE, FS_POINT);
    progBG = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_BG);
    progDown = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_DOWN);
    progBlur = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_BLUR);
    progComp = compile(`#version 300 es
    precision highp float;
    layout(location=0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`, FS_COMP);
  } catch (err) {
    console.error('shader init failed', err);
    var fb = document.getElementById('nogl');
    if (fb) { fb.style.display = 'flex'; }
    return;
  }

  // 小屏 / 高 DPR 时压低点精灵上限，减少填充率
  const maxPointPx = (window.innerWidth < 760 || (window.devicePixelRatio || 1) > 1.5) ? 14.0 : 20.0;
  cacheUniforms();
  // 两个共用 FS_POINT 的程序都要设一次，否则未初始化的 uniform 会让 clamp 变成未定义行为
  gl.useProgram(progTree); gl.uniform1f(UT.uMaxPx, maxPointPx);
  gl.useProgram(progSprite); gl.uniform1f(US.uMaxPx, maxPointPx);

  /* ---------------- 全屏四边形 ---------------- */
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const quadVAO = gl.createVertexArray();
  const treeVAO = gl.createVertexArray();
  gl.bindVertexArray(quadVAO);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  /* ---------------- FBO ---------------- */
  const FLOAT_RT = !!gl.getExtension('EXT_color_buffer_float');
  const RT_FMT = FLOAT_RT ? gl.RGBA16F : gl.RGBA8;
  const RT_TYPE = FLOAT_RT ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

  function makeFBO(w, h, filter) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, RT_FMT, w, h, 0, gl.RGBA, RT_TYPE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { fb, tex, w, h };
  }
  let rtScene = null, rtA = null, rtB = null;
  let W = 1, H = 1;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const nw = Math.max(2, Math.floor(window.innerWidth * dpr * 0.9));
    const nh = Math.max(2, Math.floor(window.innerHeight * dpr * 0.9));
    if (nw === W && nh === H && rtScene && rtScene.w === W) return;   // 尺寸没变就不重建
    W = nw; H = nh;
    cvs.width = W; cvs.height = H;
    cvs.style.width = window.innerWidth + 'px';
    cvs.style.height = window.innerHeight + 'px';
    if (rtScene) { gl.deleteTexture(rtScene.tex); gl.deleteFramebuffer(rtScene.fb); }
    if (rtA) { gl.deleteTexture(rtA.tex); gl.deleteFramebuffer(rtA.fb); }
    if (rtB) { gl.deleteTexture(rtB.tex); gl.deleteFramebuffer(rtB.fb); }
    rtScene = makeFBO(W, H, gl.LINEAR);
    rtA = makeFBO(Math.max(2, W >> 2), Math.max(2, H >> 2), gl.LINEAR);
    rtB = makeFBO(Math.max(2, W >> 2), Math.max(2, H >> 2), gl.LINEAR);

  window.addEventListener('resize', resize);

  // 上下文丢失兜底：暂停渲染并提示手动刷新（不做自动 reload —— 某些显卡会反复

  function showGLLost() {
    window.__glLost = true;
    const fb = document.getElementById('nogl');
    if (fb && fb.style.display !== 'flex') {
      fb.style.display = 'flex';
      fb.innerHTML = '<div style="text-align:center"><h2>画面已暂停</h2>' +
                     '<p>显卡上下文被重置，点击任意处刷新即可恢复</p></div>';

  cvs.addEventListener('webglcontextlost', function (e) { e.preventDefault(); showGLLost(); }, false);
  cvs.addEventListener('webglcontextrestored', function () {

  }, false);

  // DPR 变化（跨屏拖动、浏览器缩放）时重建渲染目标

  resize();

  /* ---------------- 状态 ---------------- */
  const state = {
    yaw: 0.4, pitch: -0.06, zoom: 1,
    t: 0, disperse: 0, phase: 0, timer: 90, heart: 0, emblem: 0, heartWanted: false,
    alpha: 0, snow: true, text: true,
    glyphs: [], sparks: [], snowPts: []
  };

  // 雪花
  for (let i = 0; i < 220; i++) {
    state.snowPts.push({
      x: Math.random() * 2000, y: Math.random() * 1200,
      vy: 18 + Math.random() * 40, vx: -8 + Math.random() * 16,
      s: 1.4 + Math.random() * 2.6, ph: Math.random() * 6.28

  }

  /* ---------------- 交互 ---------------- */
  let dragging = false, moved = 0, lastX = 0, lastY = 0, idle = 0;

  cvs.addEventListener('pointerdown', (e) => {

  cvs.addEventListener('pointermove', (e) => {
    if (!dragging) return;

    lastX = e.clientX; lastY = e.clientY;

    state.yaw += dx * 0.006;
    state.pitch = Math.max(-0.9, Math.min(0.55, state.pitch + dy * 0.004));
    idle = 0;
  });
  let tapTimer = null, lastTapT = 0, lastTapX = 0, lastTapY = 0;
  function fireSingle(x, y) {

  }

  // 桌面：用浏览器原生 dblclick（按系统双击速度判定，比手写时间窗可靠）
  cvs.addEventListener('dblclick', (e) => {

      lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;

  });

  cvs.addEventListener('wheel', (e) => {

  }, { passive: false });

  function toggleDisperse(x, y) {
    if (stage === STAGE.TREE) {

    } else {

    }
  }

  function onClick(x, y) {
    if (stage === STAGE.TEXT) {         // 文案 -> 爱心：文字汇入轮廓，中间大字变成照片
      if (!heartPending) beginHeartTransition();
      spawnSpark(x, y);
      return;
    }
    if (stage === STAGE.HEART) {        // 爱心中单击：换一张照片，并重置自动计时

    }

    const kinds = GLYPH_ORDER;          // 成形时：凝聚光形

    spawnGlyph(kind, x, y);
    spawnSpark(x, y);
  }

  function spawnSpark(x, y) {
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 120;
      state.sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, s: 2 + Math.random() * 3 });
    }
  }

  function spawnGlyph(kind, x, y) {
    const base = SHAPES[kind]();
    const scale = Math.min(window.innerWidth, window.innerHeight) * 0.17;
    const n = base.length;
    const target = new Float32Array(n * 3);
    const start = new Float32Array(n * 3);
    const col = new Float32Array(n * 3);
    const th = THEMES[themeIdx];
    const c = th.orn[0];
    const c2 = th.star;
    for (let i = 0; i < n; i++) {
      target[i * 3] = x + base[i][0] * scale;
      target[i * 3 + 1] = y + base[i][1] * scale;
      target[i * 3 + 2] = 1;
      const a = Math.random() * Math.PI * 2, rr = 120 + Math.random() * 420;
      start[i * 3] = x + Math.cos(a) * rr;
      start[i * 3 + 1] = y + Math.sin(a) * rr;

      col[i * 3 + 1] = c[1] * (1 - mixv) + c2[1] * mixv;

    if (state.glyphs.length > 4) state.glyphs.shift();
  }

  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;      // 不抢浏览器快捷键
    const k = e.key.toLowerCase();
    if (k === 'c') { themeIdx = (themeIdx + 1) % THEMES.length; rebuildGeometry(); flashName(); }
    else if (k >= '1' && k <= '4') { formIdx = parseInt(k) - 1; rebuildGeometry(); flashName(); }
    else if (k === 'g') { toggleDisperse(); }
    else if (k === 's') { state.snow = !state.snow; }
    else if (k === 't') {
      state.text = !state.text;
      document.getElementById('ui').style.opacity = state.text ? '1' : '0';
    } else if (k === 'f') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });

  let nameTimer = 0;
  function flashMsg(_txt) { /* 顶部提示已按要求移除 */ }
  function flashName() { /* 同上 */ }

  /* ---------------- 尺寸与投影 ---------------- */
  const proj = new Float32Array(16), view = new Float32Array(16), vp = new Float32Array(16);

  function updateCamera() {
    const aspect = W / H;
    const dist = CAM_DIST / state.zoom;
    const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    const eye = [
      Math.sin(state.yaw) * dist * cp,
      0.12 + sp * dist,
      Math.cos(state.yaw) * dist * cp
    ];
    mat4Perspective(proj, 45 * Math.PI / 180, aspect, 0.1, 100);
    mat4LookAt(view, eye, [0, 0.02, 0], [0, 1, 0]);
    mat4Mul(vp, proj, view);
    return dist;
  }

  /* ---------------- 渲染 ---------------- */
  let last = performance.now();


  function render(dt) {
    const dprNow = Math.min(window.devicePixelRatio || 1, 2);
    if (Math.abs(dprNow - lastDpr) > 0.01) { lastDpr = dprNow; resize(); }
    state.t += dt;

    // 散开 / 凝聚：0 成形等待 · 1 散开中 · 2 散开停留 · 3 凝聚中
    if (state.phase === 0) {
      if (!dragging && idle > 3) state.timer -= dt;      // 正在看/拖拽时暂停倒计时
      if (state.timer <= 0) startDissolve();
    } else if (state.phase === 1) {
      state.disperse = Math.min(1, state.disperse + dt * 0.55);
      if (state.disperse >= 1) { state.phase = 2; state.timer = 30; }
    } else if (state.phase === 2) {
      // 停留期间按阶段推进（不再自动收回，交给流程 / 双击）
    } else {
      state.disperse = Math.max(0, state.disperse - dt * 0.45);
      if (state.disperse <= 0) { state.phase = 0; state.timer = 70 + Math.random() * 40; }
    }

    // 阶段推进
    stageT += dt;
    if (stage === STAGE.SYMBOL && stageT > 4.4) {
      setStage(STAGE.TEXT);
    }

    // 粒子形态：散开量 + 爱心权重
    const wantHeart = (stage === STAGE.HEART || state.heartWanted) ? 1 : 0;
    state.heart += (wantHeart - state.heart) * Math.min(1, dt * 1.7);
    if (state.heart < 0.001) state.heart = 0;

    // 梨/鱼/星：由同一批星粒子汇聚（符号阶段 1，其余 0）
    const wantEmblem = (stage === STAGE.SYMBOL && state.disperse > 0.9) ? 1 : 0;
    state.emblem += (wantEmblem - state.emblem) * Math.min(1, dt * 1.5);
    if (state.emblem < 0.001) state.emblem = 0;

    state.alpha = Math.min(1, state.alpha + dt * 0.6);
    if (idle > 2.5 && !dragging && stage === STAGE.TREE) state.yaw += dt * 0.12;
    // 进入符号/爱心阶段时把镜头缓缓转正，让图案正面朝人
    if ((stage === STAGE.SYMBOL || stage === STAGE.HEART) && !dragging && stageT < 2.2) {
      const k = Math.min(1, dt * 2.4);
      state.yaw += (0 - state.yaw) * k;
      state.pitch += (0 - state.pitch) * k;
    }

    gl.bindFramebuffer(gl.FRAMEBUFFER, rtScene.fb);
    gl.viewport(0, 0, W, H);
    gl.disable(gl.BLEND);

    // 背景
    gl.useProgram(progBG);
    const th = THEMES[themeIdx];
    gl.uniform2f(UG.uRes, W, H);
    gl.uniform3fv(UG.uSky, th.sky);
    gl.uniform3fv(UG.uGlow, th.glow);
    gl.uniform3fv(UG.uStar, th.star);
    gl.uniform1f(UG.uTime, state.t);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    const dist = updateCamera();
    gl.useProgram(progTree);

    gl.uniform1f(UT.uDisperse, state.disperse);
    gl.uniform1f(UT.uTime, state.t);
    gl.uniform1f(UT.uSize, 0.0340);
    gl.uniform1f(UT.uProj, H * 0.62);
    gl.uniform1f(UT.uAlpha, state.alpha);
    gl.uniform1f(UT.uMaxPx, maxPointPx);
    gl.uniform1f(UT.uHeart, state.heart);
    gl.uniform1f(UT.uEmblem, state.emblem);

    gl.bindVertexArray(treeVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.vbo);
    gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.sbo);
    gl.enableVertexAttribArray(aSc); gl.vertexAttribPointer(aSc, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.mbo);
    gl.enableVertexAttribArray(aMt); gl.vertexAttribPointer(aMt, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.cbo);
    gl.enableVertexAttribArray(aCo); gl.vertexAttribPointer(aCo, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.hbo);
    gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, geo.ebo);
    gl.enableVertexAttribArray(5); gl.vertexAttribPointer(5, 3, gl.FLOAT, false, 0, 0);

    // ---- Bloom ----
    // 降采样 + 阈值

    gl.activeTexture(gl.TEXTURE0);

    gl.uniform2f(UD.uTexel, 1 / W, 1 / H);
    gl.uniform1f(UD.uThresh, 0.48);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.bindFramebuffer(gl.FRAMEBUFFER, rtB.fb);
    gl.viewport(0, 0, rtB.w, rtB.h);
    gl.useProgram(progBlur);
    gl.bindVertexArray(quadVAO);
    gl.bindTexture(gl.TEXTURE_2D, rtA.tex);
    gl.uniform1i(UB.uTex, 0);
    gl.uniform2f(UB.uDir, 1.6 / rtA.w, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // 纵向模糊 -> rtA
    gl.bindFramebuffer(gl.FRAMEBUFFER, rtA.fb);
    gl.bindVertexArray(quadVAO);
    gl.bindTexture(gl.TEXTURE_2D, rtB.tex);
    gl.uniform2f(UB.uDir, 0, 1.6 / rtB.h);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);

    gl.useProgram(progComp);
    gl.bindVertexArray(quadVAO);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, rtScene.tex);
    gl.uniform1i(UC.uScene, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, rtA.tex);
    gl.uniform1i(UC.uBloom, 1);
    gl.uniform1f(UC.uBloomAmt, 1.25);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    if (nameTimer > 0) {

      if (nameTimer <= 0) document.getElementById('themeName').style.opacity = '0';
    }
  }

  // 屏幕空间点集的通用绘制
  const scratch = { pos: new Float32Array(4096 * 3), col: new Float32Array(4096 * 3), size: new Float32Array(4096) };
  let spriteVAO = null, spritePosBuf = null, spriteColBuf = null, spriteSizeBuf = null;
  function ensureSpriteVAO() {
    if (spriteVAO) return;

    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);

  function uploadAndDraw(n) {
    ensureSpriteVAO();
    gl.bindVertexArray(spriteVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, spritePosBuf);
    gl.bufferData(gl.ARRAY_BUFFER, scratch.pos.subarray(0, n * 3), gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, spriteColBuf);
    gl.bufferData(gl.ARRAY_BUFFER, scratch.col.subarray(0, n * 3), gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, spriteSizeBuf);
    gl.bufferData(gl.ARRAY_BUFFER, scratch.size.subarray(0, n), gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.POINTS, 0, n);
    gl.bindVertexArray(null);
  }

  function drawScreenPoints(dt) {
    if (!state.snow) return;
    const scale = W / window.innerWidth;
    const th = THEMES[themeIdx];
    let n = 0;
    for (const s of state.snowPts) {
      s.y += s.vy * dt;
      s.x += (s.vx + Math.sin(state.t * 1.3 + s.ph) * 12) * dt;
      if (s.y > window.innerHeight + 20) { s.y = -20; s.x = Math.random() * window.innerWidth; }
      if (s.x < -20) s.x = window.innerWidth + 20;
      if (s.x > window.innerWidth + 20) s.x = -20;
      if (n >= 4096) break;
      scratch.pos[n * 3] = s.x * scale;
      scratch.pos[n * 3 + 1] = s.y * scale;
      scratch.pos[n * 3 + 2] = 0.55;
      scratch.col[n * 3] = th.star[0] * 0.75;
      scratch.col[n * 3 + 1] = th.star[1] * 0.78;
      scratch.col[n * 3 + 2] = th.star[2] * 0.85;
      scratch.size[n] = s.s * scale * 0.9;
      n++;
    }
    if (n) uploadAndDraw(n);
  }

  function drawGlyphs(dt) {
    const scale = W / window.innerWidth;
    const th = THEMES[themeIdx];
    ensureSpriteVAO();
    for (let gi = state.glyphs.length - 1; gi >= 0; gi--) {
      const g = state.glyphs[gi];
      g.t += dt;
      const p = g.t / g.dur;
      if (p > 1) {
        state.glyphs.splice(gi, 1);
        continue;
      }
      let k;
      if (p < 0.18) k = easeOutCubic(p / 0.18);
      else if (p < 0.72) k = 1;
      else k = 1 - easeInCubic((p - 0.72) / 0.28);
      if (!g.arr) g.arr = new Float32Array(g.n * 3);
      if (!g.cols) g.cols = new Float32Array(g.n * 3);
      if (!g.sizes) g.sizes = new Float32Array(g.n);
      const arr = g.arr;
      for (let i = 0; i < g.n; i++) {
        const j = i * 3;
        const sx = g.start[j], sy = g.start[j + 1];
        const tx = g.target[j], ty = g.target[j + 1];
        arr[j] = (sx + (tx - sx) * k) * scale;
        arr[j + 1] = (sy + (ty - sy) * k) * scale;
        arr[j + 2] = (p < 0.18) ? (0.25 + 0.75 * k) : (p > 0.72 ? Math.max(0.15, 1 - (p - 0.72) / 0.28) : 1.0);
      }
      for (let i = 0; i < g.n; i++) {
        const m = i / g.n;
        g.cols[i * 3] = th.orn[0][0] * (1 - m) + th.star[0] * m;
        g.cols[i * 3 + 1] = th.orn[0][1] * (1 - m) + th.star[1] * m;
        g.cols[i * 3 + 2] = th.orn[0][2] * (1 - m) + th.star[2] * m;
        g.sizes[i] = 3.4 * scale;
      }
      gl.bindVertexArray(spriteVAO);
      gl.bindBuffer(gl.ARRAY_BUFFER, spritePosBuf);
      gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, spriteColBuf);
      gl.bufferData(gl.ARRAY_BUFFER, g.cols, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, spriteSizeBuf);
      gl.bufferData(gl.ARRAY_BUFFER, g.sizes, gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.POINTS, 0, g.n);
      gl.bindVertexArray(null);
    }
  }

  function drawSparks(dt) {
    if (!state.sparks.length) return;
    const scale = W / window.innerWidth;
    const th = THEMES[themeIdx];
    let n = 0;
    for (let i = state.sparks.length - 1; i >= 0; i--) {
      const s = state.sparks[i];
      s.life -= dt * 1.8;
      if (s.life <= 0) { state.sparks.splice(i, 1); continue; }
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vx *= 0.96; s.vy = s.vy * 0.96 + 40 * dt;
      if (n >= 4096) break;
      scratch.pos[n * 3] = s.x * scale;
      scratch.pos[n * 3 + 1] = s.y * scale;
      scratch.pos[n * 3 + 2] = s.life;
      scratch.col[n * 3] = th.star[0];
      scratch.col[n * 3 + 1] = th.star[1];
      scratch.col[n * 3 + 2] = th.star[2];
      scratch.size[n] = s.s * scale * (0.6 + 0.6 * s.life);
      n++;
    }
    if (n) uploadAndDraw(n);
  }

  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInCubic(x) { return x * x * x; }

  /* ---------------- 爱心内部的粒子装饰 ---------------- */
  const HEART_SC = 0.0865, HEART_OFFY = 0.40;
  let decorN = 0, decorBase = null, decorPhase = null, decorAmp = null;
  let decorVAO = null, decorPosBuf = null, decorColBuf = null, decorMetaBuf = null;

  function buildDecor() {
    const th = THEMES[themeIdx];
    const cols = [th.star, th.orn[0], th.orn[1], th.orn[2], th.orn[3] || th.star];
    const pts = [];
    let guard = 0;
    while (pts.length < 560 && guard < 40000) {
      guard++;
      const t = rnd() * Math.PI * 2;
      const f = 0.10 + Math.pow(rnd(), 0.55) * 0.86;
      const X = 16 * Math.pow(Math.sin(t), 3) * f * 1.13 * HEART_SC;
      const Y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
                * f * 0.94 * HEART_SC + HEART_OFFY;
      // 避开中间的照片区域
      if (Math.abs(X) < 0.31 && Math.abs(Y - HEART_OFFY) < 0.35) continue;
      const c = cols[Math.floor(rnd() * cols.length)];
      pts.push([X, Y, (rnd() - 0.5) * 0.10, rnd() * 6.283,
                0.010 + rnd() * 0.026, c, rnd() < 0.30 ? 1 : 0]);
      // 少量四角星芒
      if (rnd() < 0.07) {
        const d = 0.024 + rnd() * 0.01;
        for (const o of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          pts.push([X + o[0] * d, Y + o[1] * d, 0, rnd() * 6.283, 0.004, c, 1]);
        }
      }
    }
    // 爱心外侧：稀疏光晕（浓度明显低于爱心边缘）
    let outer = 0;
    while (outer < 170 && guard < 80000) {
      guard++;
      const t = rnd() * Math.PI * 2;
      const f = 1.06 + Math.pow(rnd(), 1.6) * 0.62;
      const X = 16 * Math.pow(Math.sin(t), 3) * f * 1.13 * HEART_SC;
      const Y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
                * f * 0.94 * HEART_SC + HEART_OFFY;
      const c = cols[Math.floor(rnd() * cols.length)];
      pts.push([X, Y, (rnd() - 0.5) * 0.5, rnd() * 6.283,
                0.014 + rnd() * 0.030, [c[0] * 0.62, c[1] * 0.62, c[2] * 0.68], 0]);
      outer++;
    }
    // 再远一点：零星漂浮
    for (let i = 0; i < 60; i++) {
      const a = rnd() * Math.PI * 2, rr = 0.55 + Math.pow(rnd(), 0.7) * 0.85;
      const X = Math.cos(a) * rr;
      const Y = Math.sin(a) * rr * 0.8 + HEART_OFFY;
      const c = cols[Math.floor(rnd() * cols.length)];
      pts.push([X, Y, (rnd() - 0.5) * 0.8, rnd() * 6.283,
                0.020 + rnd() * 0.040, [c[0] * 0.5, c[1] * 0.5, c[2] * 0.56], 0]);
    }

    decorN = pts.length;
    decorBase = new Float32Array(decorN * 3);
    decorPhase = new Float32Array(decorN);
    decorAmp = new Float32Array(decorN);
    const col = new Float32Array(decorN * 3);
    const meta = new Float32Array(decorN * 3);
    for (let i = 0; i < decorN; i++) {
      const q = pts[i];
      decorBase[i * 3] = q[0];
      decorBase[i * 3 + 1] = q[1];
      decorBase[i * 3 + 2] = q[2];
      decorPhase[i] = q[3];
      decorAmp[i] = q[4];
      const warm = 0.35;   // 往暖白靠，避免红绿杂色
      col[i * 3] = Math.min(255, (q[5][0] * (1 - warm) + 255 * warm) * 0.30);
      col[i * 3 + 1] = Math.min(255, (q[5][1] * (1 - warm) + 244 * warm) * 0.30);
      col[i * 3 + 2] = Math.min(255, (q[5][2] * (1 - warm) + 214 * warm) * 0.30);
      meta[i * 3] = rnd();                    // u
      meta[i * 3 + 1] = q[6] ? 2000 : i;      // strand（>=1500 视为装饰珠）
      meta[i * 3 + 2] = rnd();                // rnd
    }
    if (!decorVAO) {
      decorVAO = gl.createVertexArray();
      decorPosBuf = gl.createBuffer();
      decorColBuf = gl.createBuffer();
      decorMetaBuf = gl.createBuffer();
    }
    gl.bindVertexArray(decorVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, decorPosBuf);
    gl.bufferData(gl.ARRAY_BUFFER, decorBase, gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, decorColBuf);
    gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, decorMetaBuf);
    gl.bufferData(gl.ARRAY_BUFFER, meta, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
  }

  const decorPos = () => decorVAO && decorBase;

  let decorTmp = null;
  function drawDecor() {
    if (!decorVAO || decorN === 0 || state.heart < 0.04) return;
    if (!decorTmp || decorTmp.length !== decorN * 3) decorTmp = new Float32Array(decorN * 3);
    const p = decorTmp;
    for (let i = 0; i < decorN; i++) {
      const ph = decorPhase[i], amp = decorAmp[i];
      p[i * 3] = decorBase[i * 3] + Math.sin(state.t * 0.9 + ph) * amp;
      p[i * 3 + 1] = decorBase[i * 3 + 1] + Math.cos(state.t * 0.7 + ph * 1.3) * amp * 0.8;
      p[i * 3 + 2] = decorBase[i * 3 + 2] + Math.sin(state.t * 0.5 + ph) * 0.01;
    }
    gl.bindVertexArray(decorVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, decorPosBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, p);      // 预分配 + 增量上传
    gl.bindVertexArray(decorVAO);                 // 属性指针已在 buildDecor 中设好
    gl.useProgram(progTree);
    gl.uniform1f(UT.uDisperse, 0);
    gl.uniform1f(UT.uHeart, 0);
    gl.uniform1f(UT.uEmblem, 0);
    gl.uniform1f(UT.uSize, 0.0105);
    gl.uniform1f(UT.uAlpha, state.heart * 0.25);
    gl.drawArrays(gl.POINTS, 0, decorN);
    gl.bindVertexArray(null);
  }

  /* ---------------- 主循环 ---------------- */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.clearColor(0, 0, 0, 1);

  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (window.__pause) { requestAnimationFrame(loop); return; }
    if (window.__glLost) { requestAnimationFrame(loop); return; }
    idle += dt;
    render(dt);
    requestAnimationFrame(loop);
  }

  rebuildGeometry();
  requestAnimationFrame(loop);

  // 供外部检查
  window.__tree = {
    state, gl, onClick,
    get stage() { return stage; },
    get stageT() { return +stageT.toFixed(2); },
    doDouble() { toggleDisperse(); },
    startDissolve, setStage, STAGE,
    get emblem() { return +state.emblem.toFixed(2); },
    get decorN() { return decorN; },
    get personalIdx() { return personalIdx; },
    get count() { return geo.count; },
    get theme() { return THEMES[themeIdx].name; },
    paintRed() {
      window.__pause = true;
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, W, H);
      gl.clearColor(1, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      window.__pause = false;
      return 'ok';
    },
    compositeOnce() {
      render(0.016);
      return 'ok';
    },
    dbg() {
      const px = new Uint8Array(4), px2 = new Uint8Array(4), px3 = new Uint8Array(4);
      gl.bindFramebuffer(gl.FRAMEBUFFER, rtScene.fb);
      const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
      gl.readPixels(W >> 1, H >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      gl.readPixels(20, 20, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px2);
      const errScene = gl.getError();
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.readPixels(W >> 1, H >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px3);
      const out = {
        centerScene: Array.from(px), cornerScene: Array.from(px2), screen: Array.from(px3),
        errScene, w: W, h: H, fbStatus: st,
        vp: Array.from(vp).map(function (v) { return +v.toFixed(3); }),
        glErr: gl.getError()
      };
      return out;
    }
  };
})();

</script>

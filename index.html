<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111540">
  <link rel="icon" href="data:,">
  <title>圣诞星愿夜 · YJL</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10143b; }
    body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
    #scene { display: block; width: 100vw; height: 100vh; cursor: pointer; touch-action: manipulation; }
    .hud {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      color: rgba(222, 243, 255, .78); font-size: 12px; letter-spacing: .08em;
      pointer-events: none; text-align: center; text-shadow: 0 1px 6px #080b24;
      white-space: normal; max-width: calc(100vw - 28px);
    }
    .badge {
      position: fixed; right: 18px; top: 16px; padding: 8px 12px; border-radius: 999px;
      color: rgba(255,255,255,.8); background: rgba(26, 32, 93, .45);
      border: 1px solid rgba(170, 228, 255, .24); font-size: 11px; letter-spacing: .06em;
      backdrop-filter: blur(8px); pointer-events: none;
    }
  </style>
  <style>
    @media (max-width: 600px) {
      .badge { top: 10px; right: 10px; font-size: 9px; padding: 6px 9px; }
      .hud { bottom: max(10px, env(safe-area-inset-bottom)); font-size: 10px; letter-spacing: .03em; }
    }
  </style>
</head>
<body>
<canvas id="scene" aria-label="可点击的圣诞星愿夜动画"></canvas>
<div class="badge">MERRY CHRISTMAS</div>
<div class="hud">点击礼物收下祝福 · 点击树或雪人触发惊喜 · Space 暂停 · F 全屏</div>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const TAU = Math.PI * 2;
  const custom = {
    greeting: "愿冬日星光，收藏所有美好",
    blessing: "愿你被星光拥抱，所愿皆成真",
    subtitle: "MAY YOUR NIGHT SPARKLE"
  };
  const yjlWishes = [
    "YJL，愿你新的一年平安喜乐，万事顺遂。",
    "YJL，愿你的努力都有回响，梦想都慢慢实现。",
    "YJL，愿你每天都有好心情，身边常有温暖相伴。",
    "YJL，新的一年愿你勇敢奔赴热爱，继续闪闪发光。",
    "YJL，愿所有等待都有结果，所有付出皆有收获。",
    "YJL，愿你被好运偏爱，被快乐围绕，未来一路生花。",
    "YJL，愿你所遇皆温柔，所行皆坦途，所盼皆如愿。",
    "YJL，愿新的一年健康顺心，快乐加倍！"
  ];
  let width = 1180, height = 760, dpr = Math.min(2, window.devicePixelRatio || 1);
  let t = 0, last = performance.now(), paused = false, mouseX = .5, mouseY = .5;
  let spin = 0, revealClock = 4, nextEvent = 5.5;
  const stars = Array.from({ length: 72 }, (_, i) => ({
    x: Math.random(), y: .04 + Math.random() * .64, r: 1 + Math.random() * 2.5,
    phase: Math.random() * TAU, speed: .5 + Math.random() * 1.7, hue: [.52, .58, .82, .12][i % 4]
  }));
  const snow = Array.from({ length: 120 }, () => ({
    x: Math.random(), y: Math.random(), r: 1 + Math.random() * 3.2,
    speed: 18 + Math.random() * 52, sway: .5 + Math.random() * 1.5, phase: Math.random() * TAU
  }));
  const orbits = Array.from({ length: 20 }, () => ({
    a: Math.random() * TAU, radius: 120 + Math.random() * 190, y: -180 + Math.random() * 300,
    speed: -.35 + Math.random() * .7, phase: Math.random() * TAU, size: 2 + Math.random() * 3.5,
    hue: .48 + Math.random() * .4
  }));
  const effects = [];
  const wishPopups = [];
  let lastWishIndex = -1;
  window.__christmasScene = {
    get paused() { return paused; },
    get effectCount() { return effects.length; },
    get activeWishes() { return wishPopups.map(item => item.text); },
    get wishOptions() { return yjlWishes.slice(); },
    get shootingTrajectories() {
      return effects.filter(effect => effect.kind === "shooting").map(
        ({ angle, startX, startY, endX, endY, dx, dy }) => ({ angle, startX, startY, endX, endY, dx, dy })
      );
    }
  };

  function resize() {
    const rect = canvas.getBoundingClientRect();
    width = Math.max(320, rect.width); height = Math.max(240, rect.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.floor(width * dpr); canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function smooth(v) { v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }
  function color(h, s, v, a = 1) {
    h = ((h % 1) + 1) % 1; const i = Math.floor(h * 6), f = h * 6 - i;
    const q = v * (1 - s), p = v * (1 - f * s), q2 = v * (1 - (1 - f) * s);
    const rgb = [[v,q2,q],[p,v,q],[q,v,q2],[q,p,v],[q2,q,p],[v,q,p]][i % 6];
    return `rgba(${rgb.map(n => Math.round(n * 255)).join(",")},${a})`;
  }
  function withAlpha(c, a) {
    if (c.startsWith("rgba(")) return c.replace(/rgba\(([^)]+),[^)]+\)/, `rgba($1,${a})`);
    if (c.startsWith("rgb(")) return c.replace("rgb(", "rgba(").replace(")", `,${a})`);
    return c;
  }
  function glow(x, y, r, c, a = .35) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, withAlpha(c, a));
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  function starPath(x, y, outer, inner, n = 5, rot = -Math.PI / 2) {
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 ? inner : outer, a = rot + i * Math.PI / n;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }
  function textWithOutline(text, x, y, size, fill, align = "center", font = "\"STHupo\",\"Microsoft YaHei\",sans-serif") {
    ctx.save(); ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = "top";
    ctx.lineJoin = "round"; ctx.lineWidth = Math.max(3, size * .18); ctx.strokeStyle = "rgba(37,25,91,.96)";
    ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y); ctx.restore();
  }
  function resetContext() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
  }
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, height);
    g.addColorStop(0, "#111540"); g.addColorStop(.55, "#35347b"); g.addColorStop(1, "#14183c");
    ctx.fillStyle = g; ctx.fillRect(0, 0, width, height);
    const moonX = width * .83, moonY = height * .18;
    glow(moonX, moonY, 112, "rgb(164,220,255)", .3);
    ctx.fillStyle = "#e8f8ff"; ctx.beginPath(); ctx.arc(moonX, moonY, 27, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(145,183,232,.4)"; ctx.beginPath(); ctx.arc(moonX - 8, moonY - 6, 4, 0, TAU); ctx.fill();
    for (const s of stars) {
      const p = (Math.sin(t * s.speed + s.phase) + 1) / 2;
      const x = s.x * width + (mouseX - .5) * 18, y = s.y * height + (mouseY - .5) * 8;
      ctx.fillStyle = color(s.hue + t * .004, .34, .7 + p * .3, .85);
      ctx.beginPath(); ctx.arc(x, y, s.r * (.8 + p * .5), 0, TAU); ctx.fill();
      if (s.r > 2.3 && p > .86) {
        ctx.strokeStyle = "rgba(235,250,255,.7)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x - 6, y); ctx.lineTo(x + 6, y); ctx.moveTo(x, y - 6); ctx.lineTo(x, y + 6); ctx.stroke();
      }
    }
    for (let band = 0; band < 2; band++) {
      ctx.strokeStyle = color(.48 + band * .14 + t * .008, .55, 1, .14);
      ctx.lineWidth = 18; ctx.beginPath();
      for (let x = -40; x <= width + 40; x += 18) {
        const y = height * (.22 + band * .07) + Math.sin(x * .008 + t * .18 + band) * 16;
        x === -40 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    const horizon = height * .76;
    ctx.fillStyle = "#161b4d"; ctx.beginPath(); ctx.moveTo(0, horizon);
    for (let x = -80; x < width + 100; x += 70) {
      ctx.lineTo(x + 35, horizon - 40 - Math.sin(x * .027) * 30); ctx.lineTo(x + 85, horizon);
    }
    ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.fill();
  }
  function updateWorld(dt) {
    spin += dt * .42; revealClock = Math.min(4, revealClock + dt); nextEvent -= dt;
    for (const s of snow) { s.y += s.speed * dt / height; s.x += Math.sin(t * s.sway + s.phase) * .000035 * dt * 60; if (s.y > 1.04) { s.y = -.04; s.x = Math.random(); } }
    for (const p of orbits) p.a += p.speed * dt;
    for (const e of effects) e.age += dt;
    while (effects.length && effects[0].age > effects[0].duration) effects.shift();
    for (const popup of wishPopups) popup.age += dt;
    while (wishPopups.length && wishPopups[0].age > wishPopups[0].duration) wishPopups.shift();
    if (nextEvent <= 0) { addEffect("shooting", width * .18, height * .2); nextEvent = 7 + Math.random() * 6; }
  }
  function treeAlpha() {
    const p = clamp(revealClock / 3.8, 0, 1), out = 1.15 / 3.8, hold = .48 / 3.8;
    if (p < out) return 1 - .975 * smooth(p / out);
    if (p < out + hold) return .025;
    return .025 + .975 * smooth((p - out - hold) / (1 - out - hold));
  }
  function drawFlow(cx, cy, scale) {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 2; i++) {
      const rx = (132 + i * 54 + Math.sin(t * .9 + i) * 13) * scale, ry = rx * .34;
      ctx.strokeStyle = color(.53 + i * .16 + t * .018, .52, 1, .28); ctx.lineWidth = 2.5 * scale;
      ctx.beginPath(); ctx.ellipse(cx, cy + 26 * scale, rx, ry, 0, .08 * Math.PI, .92 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(cx, cy + 26 * scale, rx, ry, 0, 1.08 * Math.PI, 1.92 * Math.PI); ctx.stroke();
    }
    for (const p of orbits) {
      const a = p.a + Math.sin(t * .25 + p.phase) * .12, r = p.radius * scale;
      const x = cx + Math.cos(a) * r * (.83 + .17 * Math.cos(a)), y = cy + p.y * scale + Math.sin(a) * r * .06;
      const pulse = (Math.sin(t * 2 + p.phase) + 1) / 2, rr = p.size * scale * (.8 + pulse * .3);
      glow(x, y, Math.max(7, rr * 5), color(p.hue + t * .012, .45, .95), .22);
      ctx.fillStyle = color(p.hue + t * .012, .45, .95, .85); ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.beginPath(); ctx.arc(x - rr * .3, y - rr * .3, Math.max(1, rr * .28), 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  function drawTree(cx, cy, scale) {
    ctx.save(); ctx.globalAlpha = treeAlpha();
    const tilt = (mouseX - .5) * 28, layers = [[-224,-100,82,.43],[-158,-4,145,.46],[-88,82,206,.49]];
    for (const [top, bottom, radius, hue] of layers) {
      const topY = cy + top * scale, bottomY = cy + bottom * scale, half = radius * scale;
      const base = color(hue + t * .01, .76, .72);
      ctx.fillStyle = base; ctx.beginPath(); ctx.moveTo(cx + tilt * .08 * scale, topY); ctx.lineTo(cx - half, bottomY); ctx.lineTo(cx + half, bottomY); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(10,20,42,.32)"; ctx.beginPath(); ctx.moveTo(cx + tilt * .08 * scale, topY); ctx.lineTo(cx-half, bottomY); ctx.lineTo(cx-half*.16, bottomY); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(86,255,221,.78)"; ctx.lineWidth = 2 * scale; ctx.stroke();
    }
    const trunkW = 50 * scale, trunkH = 92 * scale;
    ctx.fillStyle = "#9c5e7d"; ctx.fillRect(cx - trunkW / 2, cy + 52 * scale, trunkW, trunkH);
    ctx.fillStyle = "#f3a5bf"; ctx.fillRect(cx - 6 * scale, cy + 52 * scale, 4 * scale, trunkH);
    const ornaments = 52;
    for (let i = 0; i < ornaments; i++) {
      const layer = i % 3, vertical = [-210,-150,-82][layer] + (i * 17 % [100,145,160][layer]);
      const radius = [58, 84, 125][layer] + (i * 29 % [24,58,78][layer]);
      const a = spin * (1 + layer * .08) + i * 2.17;
      const depth = Math.sin(a), perspective = .83 + .17 * Math.cos(a);
      const x = cx + Math.cos(a) * radius * scale * perspective, y = cy + vertical * scale + Math.sin(a) * radius * scale * .06;
      const pulse = (Math.sin(t * 2.3 + i * 1.7) + 1) / 2, rr = (3.2 + (i % 4)) * scale * (.78 + .22 * (depth + 1));
      const c = [color(.52,.45,.95), color(.84,.48,1), color(.10,.42,1), color(.96,.35,1)][i % 4];
      glow(x, y, Math.max(8, rr * 4), c, .16 + pulse * .2);
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.beginPath(); ctx.arc(x - rr*.3, y - rr*.3, Math.max(1, rr*.3), 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = "#ffd77c"; ctx.lineWidth = 2.3 * scale; ctx.beginPath();
    for (let i = 0; i < 42; i++) { const v = -194 + i * 6.4, r = 57 + (v+215)*.66, a = spin*.9 + t*1.1 + i*.34, x = cx + Math.cos(a)*r*scale, y = cy+v*scale + Math.sin(a)*r*scale*.06; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
    ctx.stroke();
    const starY = cy - 246 * scale, pulse = 1 + .13 * Math.sin(t * 1.6);
    glow(cx, starY, 56 * scale, "rgb(137,241,255)", .3); ctx.fillStyle = "#e0fbff"; starPath(cx, starY, 24*scale*pulse, 10*scale); ctx.fill();
    ctx.restore();
  }
  function drawSnowman(cx, cy, scale) {
    const x = cx + 318 * scale, y = cy + 72 * scale; glow(x, y - 58*scale, 45*scale, "rgb(94,229,255)", .25);
    ctx.fillStyle = "#d9f7ff"; ctx.beginPath(); ctx.arc(x,y,44*scale,0,TAU); ctx.fill(); ctx.beginPath(); ctx.arc(x,y-58*scale,32*scale,0,TAU); ctx.fill();
    ctx.fillStyle = "#101633"; ctx.beginPath(); ctx.arc(x-10*scale,y-65*scale,4*scale,0,TAU); ctx.arc(x+10*scale,y-65*scale,4*scale,0,TAU); ctx.fill();
    ctx.fillStyle = "#ffab7d"; ctx.beginPath(); ctx.moveTo(x,y-56*scale); ctx.lineTo(x+26*scale,y-51*scale); ctx.lineTo(x,y-48*scale); ctx.fill();
    ctx.strokeStyle = "#8256d5"; ctx.lineWidth = 7*scale; ctx.beginPath(); ctx.arc(x,y-68*scale,34*scale,Math.PI,TAU); ctx.stroke();
    ctx.fillStyle = "#eb5fd6"; ctx.fillRect(x-35*scale,y-30*scale,70*scale,12*scale);
  }
  function drawGifts(cx, cy, scale) {
    [[-175,123,76,52,"#48c6db","#f36dd7"],[-45,143,86,57,"#ac61ff","#6cf1ff"],[104,130,80,62,"#fa7ab1","#ffd072"]].forEach((b,i) => {
      const [ox,oy,w,h,base,ribbon] = b, x = cx+ox*scale-w*scale/2, y = cy+oy*scale;
      ctx.fillStyle = base; ctx.globalAlpha = .86; ctx.fillRect(x,y,w*scale,h*scale); ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(226,250,255,.8)"; ctx.lineWidth = 2*scale; ctx.strokeRect(x,y,w*scale,h*scale);
      ctx.fillStyle = ribbon; ctx.fillRect(x+w*scale*.44,y,w*scale*.12,h*scale); ctx.fillRect(x,y+h*scale*.43,w*scale,h*scale*.14);
      glow(x+w*scale/2,y,24*scale,ribbon,.16);
    });
  }
  function giftRects(cx, cy, scale) {
    return [
      [-175,123,76,52],
      [-45,143,86,57],
      [104,130,80,62]
    ].map(([ox,oy,w,h]) => ({
      x: cx + ox*scale - w*scale/2 - 8*scale,
      y: cy + oy*scale - 8*scale,
      width: w*scale + 16*scale,
      height: h*scale + 16*scale
    }));
  }
  function showYjlWish() {
    let index = Math.floor(Math.random() * yjlWishes.length);
    if (yjlWishes.length > 1 && index === lastWishIndex) {
      index = (index + 1 + Math.floor(Math.random() * (yjlWishes.length - 1))) % yjlWishes.length;
    }
    lastWishIndex = index;
    wishPopups.length = 0;
    wishPopups.push({ text: yjlWishes[index], age: 0, duration: 4.2 });
  }
  function rayExitDistance(x, y, dx, dy) {
    const distances = [];
    if (dx > 0) distances.push((width - x) / dx);
    else if (dx < 0) distances.push(-x / dx);
    if (dy > 0) distances.push((height - y) / dy);
    else if (dy < 0) distances.push(-y / dy);
    return Math.min(...distances.filter(value => value >= 0));
  }
  function addEffect(kind, x, y) {
    const items = Array.from({ length: 12 }, (_, i) => ({ a: Math.random()*TAU, d: 35+Math.random()*110, kind: ["star","heart","gift"][i%3], phase: Math.random()*TAU }));
    let trajectory = {};
    if (kind === "shooting") {
      const angle = Math.PI * (.14 + Math.random() * .72);
      const dx = Math.cos(angle), dy = Math.sin(angle);
      const margin = Math.max(12, Math.min(width, height) * .035);
      const startX = width * (.08 + Math.random() * .84), startY = -margin;
      const forward = rayExitDistance(startX, startY, dx, dy) + margin;
      const endX = startX + dx * forward, endY = startY + dy * forward;
      const distance = Math.hypot(endX - startX, endY - startY);
      trajectory = {
        angle, dx, dy, startX, startY, endX, endY,
        duration: clamp(distance / 520, 1.45, 3.8),
        trailLength: clamp(Math.min(width, height) * .2, 74, 148)
      };
    }
    effects.push({
      kind, x, y, age: 0,
      duration: kind === "shooting" ? trajectory.duration : 2.25,
      ...trajectory,
      items
    });
  }
  function drawEffects() {
    for (const e of effects) {
      const p = clamp(e.age/e.duration,0,1), fade = smooth(Math.min(1,e.age*4))*smooth(Math.min(1,(e.duration-e.age)*3));
      if (e.kind === "shooting") {
        const travel = clamp(e.age / e.duration,0,1);
        const x = e.startX + (e.endX - e.startX) * travel;
        const y = e.startY + (e.endY - e.startY) * travel;
        const trailX = x - e.dx * e.trailLength;
        const trailY = y - e.dy * e.trailLength;
        ctx.strokeStyle=`rgba(224,250,255,${fade})`;ctx.lineWidth=4;
        ctx.beginPath();ctx.moveTo(trailX,trailY);ctx.lineTo(x,y);ctx.stroke();
        glow(x,y,28,"rgb(137,241,255)",.4*fade);
        continue;
      }
      for (const item of e.items) {
        const q=smooth(Math.min(1,p*1.2)), dist=item.d*q, x=e.x+Math.cos(item.a+e.age*.6)*dist, y=e.y+Math.sin(item.a+e.age*.6)*dist-25*Math.sin(p*Math.PI), s=7+4*Math.sin(e.age*2+item.phase);
        ctx.fillStyle=color(item.kind==="heart"?.9:item.kind==="gift"?.12:.55,.5,1,fade);
        if(item.kind==="star"){starPath(x,y,s,s*.38,5,e.age+item.phase);ctx.fill();}
        else if(item.kind==="gift"){ctx.fillRect(x-s,y-s,s*2,s*2);ctx.fillStyle=`rgba(255,220,130,${fade})`;ctx.fillRect(x-1,y-s,2,s*2);ctx.fillRect(x-s,y-1,s*2,2);}
        else {ctx.beginPath();ctx.arc(x-s*.45,y-s*.25,s*.45,0,TAU);ctx.arc(x+s*.45,y-s*.25,s*.45,0,TAU);ctx.fill();ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s);ctx.fill();}
      }
    }
  }
  function drawWishPopups() {
    for (const popup of wishPopups) {
      const fadeIn = smooth(Math.min(1, popup.age / .28));
      const fadeOut = smooth(Math.min(1, (popup.duration - popup.age) / .55));
      const alpha = fadeIn * fadeOut;
      const mobile = width < 650;
      const fontSize = mobile ? 17 : 21;
      const maxTextWidth = width - (mobile ? 42 : 120);
      ctx.save();
      ctx.font = `bold ${fontSize}px "Microsoft YaHei","Segoe UI",sans-serif`;
      const lines = [];
      let line = "";
      for (const char of popup.text) {
        const candidate = line + char;
        if (line && ctx.measureText(candidate).width > maxTextWidth) {
          lines.push(line);
          line = char;
        } else {
          line = candidate;
        }
      }
      if (line) lines.push(line);
      const lineHeight = fontSize * 1.48;
      const padX = mobile ? 18 : 28;
      const padY = 17;
      const textWidth = Math.min(maxTextWidth, Math.max(...lines.map(value => ctx.measureText(value).width)));
      const boxW = textWidth + padX * 2;
      const boxH = lines.length * lineHeight + padY * 2;
      const lift = (1 - fadeIn) * 12 - smooth(popup.age / popup.duration) * 16;
      const boxX = (width - boxW) / 2;
      const boxY = height * (mobile ? .68 : .70) - boxH / 2 + lift;
      const bg = ctx.createLinearGradient(boxX, boxY, boxX + boxW, boxY + boxH);
      bg.addColorStop(0, `rgba(36,38,105,${.94 * alpha})`);
      bg.addColorStop(1, `rgba(76,45,125,${.92 * alpha})`);
      glow(width / 2, boxY + boxH / 2, Math.min(width, height) * .22, "rgb(255,207,132)", .18 * alpha);
      ctx.fillStyle = bg;
      ctx.strokeStyle = `rgba(255,225,157,${.92 * alpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(boxX, boxY, boxW, boxH, 18);
      ctx.fill();
      ctx.stroke();
      ctx.font = `bold ${fontSize}px "Microsoft YaHei","Segoe UI",sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.lineWidth = 3;
      ctx.strokeStyle = `rgba(40,27,88,${alpha})`;
      ctx.fillStyle = `rgba(255,238,190,${alpha})`;
      lines.forEach((value, i) => {
        const lineY = boxY + padY + lineHeight * (i + .5);
        ctx.strokeText(value, width / 2, lineY);
        ctx.fillText(value, width / 2, lineY);
      });
      ctx.restore();
      const twinkle = (Math.sin(t * 4) + 1) / 2;
      for (const side of [-1, 1]) {
        const sx = width / 2 + side * (boxW / 2 + 9);
        const sy = boxY + boxH / 2;
        starPath(sx, sy, 5 + twinkle * 2, 2.2, 4, Math.PI / 4);
        ctx.fillStyle = `rgba(255,226,150,${alpha})`;
        ctx.fill();
      }
    }
  }
  function drawSnow() {
    for (const s of snow) { const x=s.x*width, y=s.y*height, r=s.r; ctx.fillStyle="rgba(225,249,255,.78)";ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill(); if(r>2.7){ctx.strokeStyle="rgba(164,225,255,.65)";ctx.beginPath();ctx.moveTo(x-r*2,y);ctx.lineTo(x+r*2,y);ctx.stroke();} }
  }
  function draw() {
    resetContext(); drawBackground();
    const mobile = width < 650;
    const scale = mobile ? Math.min(width / 920, height / 760) : Math.min(width / 1180, height / 760);
    const cx=width*.5, cy=mobile ? height*.59 : height*.58;
    drawFlow(cx,cy,scale); drawTree(cx,cy,scale); drawSnowman(cx,cy,scale); drawGifts(cx,cy,scale); drawSnow(); drawEffects();
    const y=mobile ? height*.08 : height*.10;
    const greetingSize = Math.max(mobile ? 19 : 22,29*scale);
    textWithOutline(custom.greeting,width*.5,y,greetingSize,"#ffe294","center");
    const topTitleSize = Math.max(mobile ? 11 : 13,16*scale);
    textWithOutline("MERRY CHRISTMAS",width*.5,y+greetingSize+10,topTitleSize,"#e4f9ff","center");
    const blessingX = mobile ? width*.06 : width*.07;
    const blessingY = mobile ? height*.34 : height*.43;
    const blessingSize = Math.max(mobile ? 16 : 18,25*scale);
    textWithOutline(custom.blessing,blessingX,blessingY,blessingSize,"#ffd27b","left");
    const blessingSubSize = Math.max(mobile ? 9 : 11,14*scale);
    const blessingGap = Math.max(16, blessingSize * .55);
    ctx.font=`${blessingSubSize}px "Segoe UI",sans-serif`;ctx.fillStyle="rgba(165,225,255,.88)";ctx.textAlign="left";ctx.fillText(custom.subtitle,blessingX,blessingY+blessingSize+blessingGap);
    drawWishPopups();
    ctx.font="12px \"Segoe UI\",sans-serif";ctx.fillStyle="rgba(222,243,255,.78)";ctx.textAlign="center";ctx.fillText(paused?"PAUSED · SPACE TO RESUME":"点击礼物收下祝福 · 点击树或雪人触发惊喜",width*.5,height-18);
  }
  function loop(now) { const dt=Math.min(.05,(now-last)/1000); last=now; if(!paused){t+=dt;updateWorld(dt);} draw(); requestAnimationFrame(loop); }
  canvas.addEventListener("pointermove", e => { mouseX=e.clientX/width; mouseY=e.clientY/height; });
  canvas.addEventListener("click", e => {
    const x=e.clientX,y=e.clientY,mobile=width<650;
    const scale=mobile?Math.min(width/920,height/760):Math.min(width/1180,height/760);
    const cx=width*.5,cy=mobile?height*.59:height*.58;
    const clickedGift = giftRects(cx,cy,scale).some(rect => x >= rect.x && x <= rect.x + rect.width && y >= rect.y && y <= rect.y + rect.height);
    if (clickedGift) { showYjlWish(); addEffect("gift",x,y); return; }
    if (Math.hypot(x-cx,y-(cy-40*scale)) < 225*scale) { addEffect("tree",x,y); revealClock=0; }
    else if (x>cx+245*scale && y>cy-40*scale && y<cy+150*scale) addEffect("snowman",x,y);
    else addEffect("shooting",x,y);
  });
  window.addEventListener("keydown", e => { if(e.code==="Space"){paused=!paused;e.preventDefault();} if(e.key.toLowerCase()==="f") document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.(); });
  window.addEventListener("resize", resize); resize(); requestAnimationFrame(loop);
})();
</script>
